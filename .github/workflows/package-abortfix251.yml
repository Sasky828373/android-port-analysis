name: Package ABORTFIX251 APK
on: { workflow_dispatch: {} }
jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Download Bridge241 and Build251
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $h=@{Authorization="Bearer $env:GH_TOKEN";Accept="application/vnd.github+json"}
          Invoke-WebRequest -Headers $h -Uri "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10890731099/zip" -OutFile b.zip
          Invoke-WebRequest -Headers $h -Uri "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10899169227/zip" -OutFile e.zip
          Expand-Archive b.zip b
          Expand-Archive e.zip e
          $apk=Get-ChildItem b -Recurse -Filter *.apk|Select-Object -First 1
          $so=Get-ChildItem e -Recurse -Filter libgtav.so|Select-Object -First 1
          if(!$apk -or !$so){throw "required artifact content missing"}
          Copy-Item $apk.FullName base.apk
          Copy-Item $so.FullName libgtav251.so
      - name: Patch and repack
        shell: pwsh
        run: |
          mkdir apk
          7z x base.apk -oapk -y | Out-Null
          Remove-Item apk\META-INF -Recurse -Force -ErrorAction SilentlyContinue
          @'
          from pathlib import Path
          import struct
          p=Path("apk/lib/arm64-v8a/libSDL2.so"); b=bytearray(p.read_bytes())
          phoff=struct.unpack_from("<Q",b,32)[0]; entsz=struct.unpack_from("<H",b,54)[0]; n=struct.unpack_from("<H",b,56)[0]
          ok=False
          for i in range(n):
            o=phoff+i*entsz
            if struct.unpack_from("<I",b,o)[0]!=2: continue
            off=struct.unpack_from("<Q",b,o+8)[0]; sz=struct.unpack_from("<Q",b,o+32)[0]
            for d in range(off,off+sz,16):
              tag,val=struct.unpack_from("<QQ",b,d)
              if tag==0: break
              if tag==0x6ffffffb:
                struct.pack_into("<Q",b,d+8,val|2); ok=True; print("DF_1_GLOBAL set"); break
          if not ok: raise SystemExit("DT_FLAGS_1 missing")
          p.write_bytes(b)
          '@ | Set-Content p.py
          python p.py
          Copy-Item libgtav251.so apk\lib\arm64-v8a\libgtav.so -Force
          Push-Location apk; 7z a -tzip -mx=0 ..\unsigned.apk * | Out-Null; Pop-Location
      - name: Align sign verify
        shell: pwsh
        run: |
          $bt=Get-ChildItem "$env:ANDROID_SDK_ROOT\build-tools" -Directory|Sort-Object {[version]$_.Name}|Select-Object -Last 1
          $za=Join-Path $bt.FullName zipalign.exe; $as=Join-Path $bt.FullName apksigner.bat
          & $za -f -P 16 4 unsigned.apk aligned.apk
          if($LASTEXITCODE){throw "zipalign failed"}
          & $za -c -P 16 -v 4 aligned.apk
          if($LASTEXITCODE){throw "alignment check failed"}
          keytool -genkeypair -noprompt -keystore debug.jks -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          & $as sign --ks debug.jks --ks-pass pass:android --key-pass pass:android --out XHYN_V0.17_NATIVE_VULKAN_ABORTFIX251_ALIGNED_SIGNED.apk aligned.apk
          if($LASTEXITCODE){throw "sign failed"}
          & $as verify --verbose --print-certs XHYN_V0.17_NATIVE_VULKAN_ABORTFIX251_ALIGNED_SIGNED.apk
          if($LASTEXITCODE){throw "verify failed"}
      - uses: actions/upload-artifact@v4
        with:
          name: XHYN-ABORTFIX251-ALIGNED-SIGNED
          path: XHYN_V0.17_NATIVE_VULKAN_ABORTFIX251_ALIGNED_SIGNED.apk
          compression-level: 0
