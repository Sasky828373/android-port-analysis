          "$AR" rcs "$ARCHIVE" "${WOLF_OBJS[@]}"

      - name: Build unresolved GTA startup modules
        if: ${{ false }} # already contained in completed build #241 archive
        shell: bash
        working-directory: AndroidGTAV/gta5/src/dev_ng/android_build
        run: |
          set -euxo pipefail
          OUT="$(cygpath -u "$GITHUB_WORKSPACE")/startup-retry"
          mkdir -p "$OUT/compiled"

          COMPAT="$OUT/compat-includes"
          rm -rf "$COMPAT"; mkdir -p "$COMPAT"

          PORT_H="$(find .. -type f -iname 'portcullis.h' -print -quit 2>/dev/null || true)"
          mkdir -p "$COMPAT/portcullis"
          if [ -n "$PORT_H" ]; then
            PORT_DIR="$(dirname "$PORT_H")"
            cp -a "$PORT_DIR"/. "$COMPAT/portcullis/"
            echo "Portcullis compatibility include: $PORT_H"
          else
            # Public AndroidGTAV snapshot omits Rockstar's Portcullis SDK header.
            # Provide an intentionally empty compatibility header first; if
            # ViewportManager uses concrete APIs, the compiler log will expose
            # the exact missing identifiers so we can bridge only those.
            cat > "$COMPAT/portcullis/portcullis.h" <<'EOF'
          #pragma once
          #ifndef PORTCULLIS_ENABLE
          #define PORTCULLIS_ENABLE 0
          #endif
          EOF
            echo "Portcullis SDK header absent; installed minimal compatibility header."
          fi

          GFX_H="$(find .. -type f -iname 'GFxPlayer.h' -print -quit 2>/dev/null || true)"
          if [ -n "$GFX_H" ]; then
            GFX_INC="$(dirname "$GFX_H")"
            mkdir -p "$COMPAT/Scaleform/Include" "$COMPAT/scaleform/Include"
            cp -a "$GFX_INC"/. "$COMPAT/Scaleform/Include/"
            cp -a "$GFX_INC"/. "$COMPAT/scaleform/Include/"
            echo "Scaleform compatibility include: $GFX_H"
          fi

          export CPATH="$COMPAT${CPATH:+:$CPATH}"
          export CPLUS_INCLUDE_PATH="$COMPAT${CPLUS_INCLUDE_PATH:+:$CPLUS_INCLUDE_PATH}"

          cat > "$OUT/sources.txt" <<'EOF'
          camera/viewports/ViewportManager.cpp
          system/AndroidKeyBindings.cpp
          EOF

          # Add only the two remaining GTA implementation groups.
          find ../game -type f -iname '*HudMarker*.cpp' -print | while read -r p; do
            rel="${p#../game/}"
            grep -qxF "$rel" "$OUT/sources.txt" || echo "$rel" >> "$OUT/sources.txt"
          done
          # Locate the implementation by symbol text, not filename.
          grep -RIl --include='*.cpp' 'CVideoEditorPlayback::' ../game/frontend/VideoEditor 2>/dev/null | while read -r p; do
            rel="${p#../game/}"
            grep -qxF "$rel" "$OUT/sources.txt" || echo "$rel" >> "$OUT/sources.txt"
          done

          echo "STARTUP_SOURCE_MATCHES=$(wc -l < "$OUT/sources.txt")"
          cat "$OUT/sources.txt"

          echo "=== AndroidKeyBindings source candidates ===" | tee "$OUT/source-locations.txt"
          find .. -type f \( -iname '*android*key*bind*.cpp' -o -iname '*android*key*bind*.cc' -o -iname '*android*key*bind*.cxx' -o -iname '*keybindings*.cpp' \) -print | tee -a "$OUT/source-locations.txt" || true
          echo "=== Portcullis references ===" | tee -a "$OUT/source-locations.txt"
          grep -n 'portcullis' ../game/camera/viewports/ViewportManager.cpp 2>/dev/null | tee -a "$OUT/source-locations.txt" || true

          if [ -s "$OUT/sources.txt" ]; then
            CONFIG=release scripts/build_sys.sh "$OUT/sources.txt" "$OUT/compiled" || true
          fi
          find "$OUT/compiled" -type f -name '*.o' -print | sort > "$OUT/objects.txt"
          cp "$OUT/compiled/failures.txt" "$OUT/failures.txt" 2>/dev/null || : > "$OUT/failures.txt"
          echo "STARTUP_OBJECTS=$(wc -l < "$OUT/objects.txt")"
          echo "STARTUP_FAILURES=$(wc -l < "$OUT/failures.txt")"
          cat "$OUT/failures.txt" || true
          tail -n 300 "$OUT/compiled/build.log" 2>/dev/null || true

      - name: Merge startup modules into engine archive
        if: ${{ false }} # already contained in completed build #241 archive
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$(cygpath -u "$GITHUB_WORKSPACE")/incremental-engine"
