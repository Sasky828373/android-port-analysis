name: Build AndroidGTAV Native APK

on:
  push:
    branches: [androidgtav-native-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 180

    env:
      NDK_VERSION: 29.0.14206865
      BUILD_TOOLS: 37.0.0
      FAST_FINAL_DIAG: 'true'

    steps:
      - name: Checkout control repo
        uses: actions/checkout@v4

      - name: Locate Android SDK
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_SDK_ROOT
          if (-not $sdk) { $sdk = $env:ANDROID_HOME }
          if (-not $sdk) { $sdk = Join-Path $env:LOCALAPPDATA "Android\Sdk" }
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Android SDK: $sdk"

      - name: Install exact upstream Android toolchain
        shell: pwsh
        run: |
          $sdkmanager = Get-ChildItem "$env:ANDROID_SDK_ROOT\cmdline-tools" -Recurse -Filter sdkmanager.bat |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $sdkmanager) { throw "sdkmanager.bat not found" }
          Write-Host "sdkmanager: $sdkmanager"
          & $sdkmanager "platform-tools" "platforms;android-35" "build-tools;$env:BUILD_TOOLS" "ndk;$env:NDK_VERSION" "ndk;27.3.13750724"
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed: $LASTEXITCODE" }

      - name: Clone current AndroidGTAV upstream
        shell: pwsh
        run: |
          # GitCode contains Windows-incompatible paths/names in the full tree.
          # Fetch the commit without checking it out, enable sparse checkout,
          # then materialize only the Android build plus source trees it needs.
          $repo = "$env:GITHUB_WORKSPACE\\AndroidGTAV"
          New-Item -ItemType Directory -Force -Path $repo | Out-Null
          Set-Location $repo

          git init
          if ($LASTEXITCODE -ne 0) { throw "git init failed" }
          git remote add origin https://gitcode.com/linyushu520/AndroidGTAV.git
          git config core.longpaths true
          git config core.protectNTFS false
          git config core.sparseCheckout true

          # GitCode occasionally drops long HTTP transfers. Retry the shallow
          # fetch instead of failing the whole build on a transient RPC/EOF.
          $fetched = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            Write-Host "GitCode fetch attempt $attempt/4"
            git -c http.version=HTTP/1.1 -c http.lowSpeedLimit=0 -c http.lowSpeedTime=999999 fetch --depth 1 origin HEAD
            if ($LASTEXITCODE -eq 0) { $fetched = $true; break }
            Start-Sleep -Seconds (5 * $attempt)
          }
          if (-not $fetched) { throw "GitCode fetch failed after 4 attempts" }

          @"
          gta5/src/dev_ng/android_build/
          gta5/src/dev_ng/rage/
          gta5/src/dev_ng/game/
          gta5/src/dev_ng/rage/3rdparty/
          gta5/src/dev_ng/rage/scaleform/
          "@ | Set-Content -Encoding ascii .git/info/sparse-checkout

          git checkout --force FETCH_HEAD
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Sparse checkout failed. Status:"
            git status --short
            throw "GitCode sparse checkout failed"
          }

          git rev-parse HEAD | Tee-Object "$env:GITHUB_WORKSPACE\\androidgtav-upstream-sha.txt"

      - name: Patch GTA V asset path to Games GTAV
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$(cygpath -u "$GITHUB_WORKSPACE")/AndroidGTAV/gta5"
          OLD='/storage/emulated/0/Android/obb/com.rage.gtav'
          OLD2='/sdcard/Android/obb/com.rage.gtav'
          NEW='/storage/emulated/0/Games/GTAV'

          python - "$ROOT" "$OLD" "$OLD2" "$NEW" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          old1, old2, new = sys.argv[2:5]
          exts = {
              '.c','.cc','.cpp','.cxx','.h','.hh','.hpp','.inl',
              '.java','.kt','.xml','.mk','.gradle','.properties','.txt','.py','.sh'
          }
          changed = []
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in exts:
                  continue
              try:
                  data = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              out = data.replace(old1, new).replace(old2, new)
              if out != data:
                  p.write_text(out, encoding='utf-8')
                  changed.append(str(p))
          print("GTAV_ASSET_PATH_REPLACEMENTS=", len(changed))
          for p in changed:
              print("patched:", p)

          # The public upstream documents the OBB path; fail loudly if source
          # layout changes and no runtime occurrence can be found.
          if not changed:
              print("warning: no literal runtime asset path occurrence found; continuing to source scan")
          PY

          echo "=== Remaining old GTA V asset path references ==="
          grep -RIn --binary-files=without-match -E '/storage/emulated/0/Android/obb/com\.rage\.gtav|/sdcard/Android/obb/com\.rage\.gtav' "$ROOT" || true
          echo "=== New GTA V asset path references ==="
          grep -RIn --binary-files=without-match -F '/storage/emulated/0/Games/GTAV' "$ROOT" || true

          # Direct native fopen() access to /storage/emulated/0/Games/GTAV on
          # modern Android requires broad external-storage access. Add the
          # manifest declarations used by this sideload/debug build.
          MANIFEST="$(find "$ROOT" -type f -path '*/android_build/app/AndroidManifest.xml' -print -quit)"
          if [ -n "$MANIFEST" ] && [ -f "$MANIFEST" ]; then
            python - "$MANIFEST" <<'PY'
          from pathlib import Path
          import sys, xml.etree.ElementTree as ET

          p = Path(sys.argv[1])
          ns = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', ns)
          tree = ET.parse(p)
          root = tree.getroot()

          wanted = [
              'android.permission.READ_EXTERNAL_STORAGE',
              'android.permission.WRITE_EXTERNAL_STORAGE',
              'android.permission.MANAGE_EXTERNAL_STORAGE',
          ]
          existing = {
              x.get(f'{{{ns}}}name')
              for x in root.findall('uses-permission')
          }
          insert_at = 0
          for perm in wanted:
              if perm not in existing:
                  el = ET.Element('uses-permission')
                  el.set(f'{{{ns}}}name', perm)
                  root.insert(insert_at, el)
                  insert_at += 1

          app = root.find('application')
          if app is not None:
              app.set(f'{{{ns}}}requestLegacyExternalStorage', 'true')

          tree.write(p, encoding='utf-8', xml_declaration=True)
          print('Patched manifest:', p)
          PY
          fi

          echo "GTAV_ASSET_ROOT=/storage/emulated/0/Games/GTAV" >> "$GITHUB_ENV"

      - name: Verify upstream Android build inputs
        shell: pwsh
        run: |
          $b = "$env:GITHUB_WORKSPACE\AndroidGTAV\gta5\src\dev_ng\android_build"
          if (-not (Test-Path "$b\scripts\build_sys.sh")) { throw "scripts/build_sys.sh missing" }
          if (-not (Test-Path "$b\package_apk.py")) { throw "package_apk.py missing" }

          $baseline = "$b\RB_zcode_audiosched_0919\integrated"
          $archive = Join-Path $baseline "libgtav_engine.a"
          $apks = @()
          if (Test-Path $baseline) {
            $apks = @(Get-ChildItem $baseline -Filter *.apk | Where-Object Name -ne "unsigned.apk")
          }
          $ready = (Test-Path $archive) -and ($apks.Count -eq 1)
          "ANDROIDGTAV_BASELINE_READY=$($ready.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append

          if ($ready) {
            Write-Host "Hot-package baseline found."
          } else {
            Write-Warning "The documented cumulative binary baseline is not tracked in this checkout."
            Write-Host "Native source compilation will continue. Existing archives/APKs:"
            Get-ChildItem $b -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -eq "libgtav_engine.a" -or $_.Extension -eq ".apk" } |
              Select-Object -First 100 -ExpandProperty FullName
          }

      - name: Map X drive required by upstream
        shell: cmd
        run: |
          subst X: "%GITHUB_WORKSPACE%\AndroidGTAV"
          if errorlevel 1 exit /b 1
          dir X:\gta5\src\dev_ng\android_build

      - name: Fast diagnostic mode
        if: env.FAST_FINAL_DIAG == 'true'
        shell: pwsh
        run: |
          Write-Host "FAST_FINAL_DIAG=true"
          Write-Host "Skipping Vulkan refresh, APK packaging/signing, and large artifact uploads."
          Write-Host "Running only: 4655-object baseline -> final 8 TUs -> libgtav.so link -> undefined-symbol audit."

      - name: Build latest native Vulkan translation units
        if: env.FAST_FINAL_DIAG != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          cd /x/gta5/src/dev_ng/android_build

          mkdir -p ci_native
          : > ci_native/sources.txt

          # Refresh the core native Vulkan renderer from current upstream source.
          for list in             lists/list_device_vk.txt             lists/list_effectvk.txt             lists/list_pipeline_vk.txt             lists/list_pipe_vk.txt; do
            if [ -f "$list" ]; then
              cat "$list" >> ci_native/sources.txt
            fi
          done

          # Remove comments/blanks and duplicates without truncating producer pipes.
          python - <<'PY'
          from pathlib import Path
          p=Path("ci_native/sources.txt")
          seen=set(); out=[]
          for raw in p.read_text(errors="replace").splitlines():
              s=raw.strip()
              if not s or s.startswith("#") or s in seen:
                  continue
              seen.add(s); out.append(s)
          p.write_text("\n".join(out)+"\n")
          print("translation units:", len(out))
          print("\n".join(out))
          PY

          if [ ! -s ci_native/sources.txt ]; then
            echo "::error::No Vulkan source list entries found"
            exit 1
          fi

          # Upstream build_sys.sh expects Scaleform at rage/3rdparty/Scaleform/Src,
          # while this Git snapshot stores it under rage/scaleform. Bridge the
          # historical path if the full 3rdparty copy is absent.
          if [ ! -d ../rage/3rdparty/Scaleform/Src ] && [ -d ../rage/scaleform/Src ]; then
            mkdir -p ../rage/3rdparty/Scaleform
            cp -a ../rage/scaleform/Src ../rage/3rdparty/Scaleform/
          fi

          echo "Scaleform expected path:"
          ls -la ../rage/3rdparty/Scaleform/Src || true

          # build_sys.sh hardcodes C:\\Android\\android-sdk\\ndk\\27.3.13750724
          # as if it were the LLVM bin directory itself. A previous compatibility
          # shim copied only bin/, which loses the NDK sysroot and causes even
          # <stddef.h> to disappear. Install NDK 27.3 and expose the COMPLETE
          # LLVM prebuilt tree at the exact path expected by upstream.
          # build_sys.sh expects clang++.exe directly at
          # C:\\Android\\android-sdk\\ndk\\27.3.13750724\\clang++.exe.
          # Keep the real NDK tree untouched and expose wrapper launchers there.
          SDK_MSYS="$(cygpath -u "$ANDROID_SDK_ROOT")"
          NDK27_ROOT="$SDK_MSYS/ndk/27.3.13750724"
          REAL_CLANG="$(find "$NDK27_ROOT" -type f -name 'clang++.exe' -print -quit 2>/dev/null || true)"
          if [ -z "$REAL_CLANG" ]; then
            echo "::error::clang++.exe not found under $NDK27_ROOT"
            find "$SDK_MSYS/ndk" -maxdepth 8 -type f -name 'clang++.exe' -print 2>/dev/null | head -n 30 || true
            exit 1
          fi

          REAL_CLANG_WIN="$(cygpath -w "$REAL_CLANG")"
          WRAP_DIR='/c/Android/android-sdk/ndk/27.3.13750724'
          mkdir -p "$WRAP_DIR"

          # build_sys.sh launches clang++.exe by this exact name. A .cmd wrapper
          # would not match, so copy the executable only and inject the REAL
          # sysroot/resource-dir through environment flags.
          cp -f "$REAL_CLANG" "$WRAP_DIR/clang++.exe"

          REAL_PREBUILT="$(dirname "$(dirname "$REAL_CLANG")")"
          REAL_SYSROOT="$REAL_PREBUILT/sysroot"
          # Do not trust --print-resource-dir after copying clang++.exe:
          # clang computes that path relative to its new location and can fall
          # back to a different SDK under "Program Files (x86)". Derive the
          # resource directory from the REAL NDK prebuilt tree instead.
          RESOURCE_DIR="$(find "$REAL_PREBUILT/lib/clang" -mindepth 1 -maxdepth 1 -type d -print -quit 2>/dev/null || true)"
          if [ ! -d "$REAL_SYSROOT" ]; then
            echo "::error::Real NDK sysroot missing: $REAL_SYSROOT"
            exit 1
          fi
          if [ -z "$RESOURCE_DIR" ] || [ ! -d "$RESOURCE_DIR" ]; then
            echo "::error::Clang resource dir missing under $REAL_PREBUILT/lib/clang"
            exit 1
          fi

          SYSROOT_CFG="$(cygpath -m "$REAL_SYSROOT")"
          RESOURCE_CFG="$(cygpath -m "$RESOURCE_DIR")"
          export CLANG_CONFIG_FILE_SYSTEM_DIR=
          printf '%s\n' \
            '--target=aarch64-linux-android26' \
            "--sysroot=$SYSROOT_CFG" \
            "-resource-dir=$RESOURCE_CFG" \
            > "$WRAP_DIR/clang++.cfg"
          unset CCC_OVERRIDE_OPTIONS

          echo "Real clang: $REAL_CLANG_WIN"
          echo "Real sysroot: $SYSROOT_CFG"
          echo "Resource dir: $RESOURCE_CFG"
          echo "clang++.cfg:"
          cat "$WRAP_DIR/clang++.cfg"
          ls -l "$WRAP_DIR/clang++.exe"

          # build_sys.sh intentionally summarizes failures into files. Always
          # print those files into the Actions log before deciding success/failure.
          set +e
          CONFIG=release bash scripts/build_sys.sh ci_native/sources.txt ci_native/compiled
          BUILD_RC=$?
          set -e

          echo "===== AndroidGTAV failures.txt ====="
          if [ -f ci_native/compiled/failures.txt ]; then
            cat ci_native/compiled/failures.txt
          else
            echo "(missing)"
          fi

          echo "===== AndroidGTAV build.log (last 400 lines) ====="
          if [ -f ci_native/compiled/build.log ]; then
            tail -n 400 ci_native/compiled/build.log
          else
            echo "(missing)"
          fi

          find ci_native/compiled -type f -name '*.o' -print > ci_native/objects.txt
          echo "===== compiled objects ====="
          cat ci_native/objects.txt || true

          if [ "$BUILD_RC" -ne 0 ] || [ ! -s ci_native/objects.txt ]; then
            echo "::error::Native AndroidGTAV compilation failed; compiler diagnostics are printed above."
            exit 1
          fi

      - name: Prepare upstream clang wrapper for fast diagnostics
        if: env.FAST_FINAL_DIAG == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          SDK_MSYS="$(cygpath -u "$ANDROID_SDK_ROOT")"
          NDK27_ROOT="$SDK_MSYS/ndk/27.3.13750724"
          REAL_CLANG="$(find "$NDK27_ROOT" -type f -name 'clang++.exe' -print -quit 2>/dev/null || true)"
          if [ -z "$REAL_CLANG" ]; then
            echo "::error::clang++.exe not found under $NDK27_ROOT"
            exit 1
          fi

          WRAP_DIR='/c/Android/android-sdk/ndk/27.3.13750724'
          mkdir -p "$WRAP_DIR"
          cp -f "$REAL_CLANG" "$WRAP_DIR/clang++.exe"

          REAL_PREBUILT="$(dirname "$(dirname "$REAL_CLANG")")"
          REAL_SYSROOT="$REAL_PREBUILT/sysroot"
          RESOURCE_DIR="$(find "$REAL_PREBUILT/lib/clang" -mindepth 1 -maxdepth 1 -type d -print -quit 2>/dev/null || true)"
          test -d "$REAL_SYSROOT"
          test -d "$RESOURCE_DIR"

          SYSROOT_CFG="$(cygpath -m "$REAL_SYSROOT")"
          RESOURCE_CFG="$(cygpath -m "$RESOURCE_DIR")"
          printf '%s\n' \
            '--target=aarch64-linux-android26' \
            "--sysroot=$SYSROOT_CFG" \
            "-resource-dir=$RESOURCE_CFG" \
            > "$WRAP_DIR/clang++.cfg"

          echo "Fast diagnostic clang wrapper ready:"
          ls -lh "$WRAP_DIR/clang++.exe" "$WRAP_DIR/clang++.cfg"
          cat "$WRAP_DIR/clang++.cfg"

      - name: Reuse completed startup-resolved engine archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dest = "$env:GITHUB_WORKSPACE\incremental-engine"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          gh run download 36196990768 --repo "${{ github.repository }}" --name "AndroidGTAV-engine-startup-resolved" --dir $dest
          if ($LASTEXITCODE -ne 0) { throw "Could not download completed build #241 engine archive" }
          $archive = Join-Path $dest "libgtav_engine_partial.a"
          if (-not (Test-Path $archive)) { throw "Completed startup-resolved engine archive missing" }
          Write-Host "Completed engine archive:"
          Get-Item $archive | Format-List FullName,Length,LastWriteTime

      - name: Fetch WolfSSL for final network units
        if: ${{ false }} # already contained in completed build #241 archive
        shell: bash
        run: |
          set -euxo pipefail
          DEST="$(cygpath -u "$GITHUB_WORKSPACE")/wolfssl-src"
          rm -rf "$DEST"
          git clone --depth 1 https://github.com/wolfSSL/wolfssl.git "$DEST"
          test -f "$DEST/wolfssl/ssl.h"
          test -f "$DEST/wolfssl/wolfcrypt/asn.h"
          test -f "$DEST/wolfssl/wolfcrypt/sha256.h"

          # AndroidGTAV compiles with WOLFSSL_USER_SETTINGS enabled.  Upstream
          # wolfSSL therefore requires a user_settings.h on the include path.
          # Keep this shim intentionally minimal: it satisfies the expected
          # integration contract without disabling algorithms that RAGE may use.
          cat > "$DEST/user_settings.h" <<'EOF'
          #ifndef ANDROIDGTAV_WOLFSSL_USER_SETTINGS_H
          #define ANDROIDGTAV_WOLFSSL_USER_SETTINGS_H

          /*
           * Match the feature surface expected by the RAGE network sources.
           * crypto.cpp uses ECC internals + sign/verify APIs, relay.cpp creates
           * a DTLS v1 client context, and tcp.cpp supplies its own allocation
           * hooks named XMALLOC/XFREE/XREALLOC.
           */
          #define HAVE_ECC
          #define HAVE_ECC_SIGN
          #define HAVE_ECC_VERIFY
          #define WOLFSSL_DTLS
          #define XMALLOC_USER

          #endif
          EOF
          test -s "$DEST/user_settings.h"

          # AndroidGTAV defines __PPU in shared engine headers even for this
          # Android target. wolfSSL interprets bare __PPU as PlayStation PPU and
          # tries to include <netex/errno.h>. Restrict that branch to non-Android.
          python - "$DEST/wolfssl/wolfio.h" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          old = "            #ifdef __PPU\n                #include <netex/errno.h>"
          new = "            #if defined(__PPU) && !defined(__ANDROID__)\n                #include <netex/errno.h>"
          if old not in s:
              raise SystemExit("wolfio __PPU compatibility block not found")
          p.write_text(s.replace(old, new, 1))
          PY

          echo "WOLFSSL_ROOT=$(cygpath -m "$DEST")" >> "$GITHUB_ENV"
          echo "WolfSSL headers + user_settings.h ready at $DEST"

      - name: Build only final unresolved network and ROS units
        if: ${{ false }} # already contained in completed build #241 archive
        shell: bash
        working-directory: AndroidGTAV/gta5/src/dev_ng/android_build
        run: |
          set -euxo pipefail
          OUT="$(cygpath -u "$GITHUB_WORKSPACE")/final-network-retry"
          mkdir -p "$OUT/compiled"

          # Rockstar's PCP/UPnP sources depend on proprietary custom headers
          # (pcp_rockstar_custom.h / upnprockstarcustom.h) that are not present
          # in the public AndroidGTAV tree.  For Android/offline startup provide
          # ABI-compatible no-op symbols so the engine can load without NAT
          # traversal. Online port mapping remains intentionally disabled.
          NAT_STUB="../rage/base/src/net/nat_android_fallback.cpp"
          cat > "$NAT_STUB" <<'EOF'
          #include <cstddef>
          #include <cstdint>

          extern "C" {
          alignas(16) unsigned char nat_upnp_info_storage[4096]
              __asm__("_ZN4rage10netNatUpNp11sm_UpNpInfoE") = {};
          alignas(16) unsigned char nat_pcp_info_storage[4096]
              __asm__("_ZN4rage9netNatPcp10sm_PcpInfoE") = {};

          std::uintptr_t nat_upnp_tunables() __asm__("_ZN4rage10netNatUpNp19SetTunablesReceivedEv");
          std::uintptr_t nat_upnp_tunables() { return 0; }
          std::uintptr_t nat_upnp_refresh(unsigned) __asm__("_ZN4rage10netNatUpNp24SetUpNpPortRefreshTimeMsEj");
          std::uintptr_t nat_upnp_refresh(unsigned) { return 0; }
          std::uintptr_t nat_upnp_cleanup(bool) __asm__("_ZN4rage10netNatUpNp25SetAllowCleanUpOldEntriesEb");
          std::uintptr_t nat_upnp_cleanup(bool) { return 0; }
          std::uintptr_t nat_upnp_reserve(bool) __asm__("_ZN4rage10netNatUpNp25SetReserveRelayMappedPortEb");
          std::uintptr_t nat_upnp_reserve(bool) { return 0; }
          std::uintptr_t nat_upnp_allow(bool) __asm__("_ZN4rage10netNatUpNp26SetAllowUpNpPortForwardingEb");
          std::uintptr_t nat_upnp_allow(bool) { return 0; }
          std::uintptr_t nat_upnp_shutdown() __asm__("_ZN4rage10netNatUpNp8ShutdownEv");
          std::uintptr_t nat_upnp_shutdown() { return 0; }

          std::uintptr_t nat_pcp_import(const void*, unsigned, unsigned*)
              __asm__("_ZN4rage13netNatPcpInfo6ImportEPKvjPj");
          std::uintptr_t nat_pcp_import(const void*, unsigned, unsigned*) { return 0; }
          std::uintptr_t nat_upnp_import(const void*, unsigned, unsigned*)
              __asm__("_ZN4rage14netNatUpNpInfo6ImportEPKvjPj");
          std::uintptr_t nat_upnp_import(const void*, unsigned, unsigned*) { return 0; }

          std::uintptr_t nat_pcp_refresh(unsigned) __asm__("_ZN4rage9netNatPcp19SetPcpRefreshTimeMsEj");
          std::uintptr_t nat_pcp_refresh(unsigned) { return 0; }
          std::uintptr_t nat_pcp_tunables() __asm__("_ZN4rage9netNatPcp19SetTunablesReceivedEv");
          std::uintptr_t nat_pcp_tunables() { return 0; }
          std::uintptr_t nat_pcp_reserve(bool) __asm__("_ZN4rage9netNatPcp28SetReserveRelayMappedAddressEb");
          std::uintptr_t nat_pcp_reserve(bool) { return 0; }
          std::uintptr_t nat_pcp_allow(bool) __asm__("_ZN4rage9netNatPcp29SetAllowPcpAddressReservationEb");
          std::uintptr_t nat_pcp_allow(bool) { return 0; }
          std::uintptr_t nat_pcp_init() __asm__("_ZN4rage9netNatPcp4InitEv");
          std::uintptr_t nat_pcp_init() { return 0; }
          std::uintptr_t nat_pcp_shutdown() __asm__("_ZN4rage9netNatPcp8ShutdownEv");
          std::uintptr_t nat_pcp_shutdown() { return 0; }

          std::uintptr_t nat_pcp_export(const void*, void*, unsigned, unsigned*)
              __asm__("_ZNK4rage13netNatPcpInfo6ExportEPvjPj");
          std::uintptr_t nat_pcp_export(const void*, void*, unsigned, unsigned*) { return 0; }
          std::uintptr_t nat_pcp_dump(const void*)
              __asm__("_ZNK4rage13netNatPcpInfo8DumpInfoEv");
          std::uintptr_t nat_pcp_dump(const void*) { return 0; }
          std::uintptr_t nat_upnp_export(const void*, void*, unsigned, unsigned*)
              __asm__("_ZNK4rage14netNatUpNpInfo6ExportEPvjPj");
          std::uintptr_t nat_upnp_export(const void*, void*, unsigned, unsigned*) { return 0; }
          std::uintptr_t nat_upnp_dump(const void*)
              __asm__("_ZNK4rage14netNatUpNpInfo8DumpInfoEv");
          std::uintptr_t nat_upnp_dump(const void*) { return 0; }
          }
          EOF

          cat > "$OUT/sources.txt" <<'EOF'
          net/crypto.cpp
          net/keyexchange.cpp
          net/nat_android_fallback.cpp
          net/relay.cpp
          net/tcp.cpp
          rline/ros/rlros.cpp
          rline/ros/rlroshttptask.cpp
          rline/ros/rlrostitleid.cpp
          EOF

          WOLFSSL_POSIX="$(cygpath -u "$WOLFSSL_ROOT")"

          # Current wolfSSL no longer exposes ecc_key internals transitively
          # through asn.h. RAGE crypto.cpp accesses key->dp and the *_hash_ex
          # APIs directly, so include the public ECC definition explicitly.
          CRYPTO_SRC="../rage/base/src/net/crypto.cpp"
          python - "$CRYPTO_SRC" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          inc = "#include <wolfssl/wolfcrypt/ecc.h>\n"
          if inc not in s:
              p.write_text(inc + s)
          PY

          export CPATH="$WOLFSSL_POSIX${CPATH:+:$CPATH}"
          export CPLUS_INCLUDE_PATH="$WOLFSSL_POSIX${CPLUS_INCLUDE_PATH:+:$CPLUS_INCLUDE_PATH}"
          echo "WolfSSL include root: $WOLFSSL_POSIX"
          CONFIG=release scripts/build_sys.sh "$OUT/sources.txt" "$OUT/compiled" || true
          find "$OUT/compiled" -type f -name '*.o' -print | sort > "$OUT/objects.txt"
          cp "$OUT/compiled/failures.txt" "$OUT/failures.txt" 2>/dev/null || : > "$OUT/failures.txt"

          echo "FAST_RETRY_OBJECTS=$(wc -l < "$OUT/objects.txt")"
          echo "FAST_RETRY_FAILURES=$(wc -l < "$OUT/failures.txt")"
          echo "===== FINAL NETWORK/ROS FAILURES ====="
          cat "$OUT/failures.txt" || true
          echo "===== FINAL NETWORK/ROS COMPILER LOG ====="
          cat "$OUT/compiled/build.log" || true

      - name: Merge fast retry objects into 4655-object engine archive
        if: ${{ false }} # already contained in completed build #241 archive
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$(cygpath -u "$GITHUB_WORKSPACE")/incremental-engine"
          RETRY="$(cygpath -u "$GITHUB_WORKSPACE")/final-network-retry"
          ARCHIVE="$OUT/libgtav_engine_partial.a"
          AR="$(find "$(cygpath -u "$ANDROID_SDK_ROOT")/ndk/27.3.13750724/toolchains/llvm/prebuilt/windows-x86_64/bin" -iname 'llvm-ar.exe' -print -quit)"
          test -f "$ARCHIVE"
          test -f "$AR"

          BEFORE=$("$AR" t "$ARCHIVE" | wc -l)
          mapfile -t NEW_OBJS < "$RETRY/objects.txt"
