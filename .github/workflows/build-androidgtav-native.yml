          cmake -S "$SRC" -B "$BUILD" -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-26             -DBUILD_SHARED_LIBS=OFF             -DCMAKE_C_FLAGS="$CFLAGS_USER"             -DWOLFSSL_USER_SETTINGS=yes             -DWOLFSSL_EXAMPLES=no             -DWOLFSSL_CRYPT_TESTS=no > "$OUT/wolfssl-cmake-config.log" 2>&1
          CFG_RC=$?
          if [ "$CFG_RC" -eq 0 ]; then
            cmake --build "$BUILD" --target wolfssl -j 4 > "$OUT/wolfssl-cmake-build.log" 2>&1
            BUILD_RC=$?
          else
            BUILD_RC=1
          fi
          set -e
          echo "WOLFSSL_CMAKE_CONFIG_RC=$CFG_RC"
