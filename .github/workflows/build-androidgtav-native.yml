name: Build AndroidGTAV Native APK

on:
  push:
    branches:
      - androidgtav-native-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      ANDROID_API: "28"
      ANDROID_ABI: arm64-v8a
      NDK_VERSION: "27.2.12479018"

    steps:
      - name: Checkout control repo
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git git-lfs python3 python3-pip ninja-build cmake \
            openjdk-17-jdk unzip zip p7zip-full patchelf file rsync
          git lfs install

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.31.1"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Clone upstream AndroidGTAV
        run: |
          git clone --depth 1 --recurse-submodules \
            https://gitcode.com/linyushu520/AndroidGTAV.git \
            "${GITHUB_WORKSPACE}/AndroidGTAV"
          cd "${GITHUB_WORKSPACE}/AndroidGTAV"
          git submodule update --init --recursive || true
          git rev-parse HEAD | tee "${GITHUB_WORKSPACE}/androidgtav-upstream-sha.txt"

      - name: Inspect upstream build layout
        run: |
          cd "${GITHUB_WORKSPACE}/AndroidGTAV"
          echo "==== PACKAGING DOCS ===="
          find . -type f \( -iname 'PACKAGING.md' -o -iname '*BUILD*.md' -o -iname 'README.md' \) -print
          echo "==== BUILD SCRIPTS ===="
          find . -maxdepth 6 -type f \( \
            -iname 'package_apk.py' -o \
            -iname '*android*build*.py' -o \
            -iname '*android*build*.sh' -o \
            -iname 'build*.py' -o \
            -iname 'build*.sh' -o \
            -iname 'CMakeLists.txt' -o \
            -iname 'build.gradle' -o \
            -iname 'build.gradle.kts' \
          \) -print | sort | head -400

          PACKAGING="$(find . -type f -iname 'PACKAGING.md' | head -1 || true)"
          if [ -n "${PACKAGING}" ]; then
            echo "==== ${PACKAGING} ===="
            sed -n '1,260p' "${PACKAGING}"
          fi

          PKG="$(find . -type f -iname 'package_apk.py' | head -1 || true)"
          if [ -n "${PKG}" ]; then
            echo "==== package_apk.py --help ===="
            python3 "${PKG}" --help || true
          fi

      - name: Build native ARM64 code
        shell: bash
        run: |
          set -euxo pipefail
          cd "${GITHUB_WORKSPACE}/AndroidGTAV"

          export PATH="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin:${PATH}"
          export CC="aarch64-linux-android${ANDROID_API}-clang"
          export CXX="aarch64-linux-android${ANDROID_API}-clang++"
          export AR="llvm-ar"
          export STRIP="llvm-strip"

          BUILT=0

          # Prefer upstream-provided Android build scripts.
          mapfile -t CANDIDATES < <(find . -maxdepth 6 -type f \( \
              -iname 'build_android.sh' -o \
              -iname 'android_build.sh' -o \
              -iname 'build_android.py' -o \
              -iname 'android_build.py' \
            \) | sort)

          for script in "${CANDIDATES[@]}"; do
            echo "Trying upstream build script: ${script}"
            case "${script}" in
              *.sh)
                chmod +x "${script}"
                if ANDROID_NDK_HOME="${ANDROID_NDK_HOME}" ANDROID_NDK_ROOT="${ANDROID_NDK_ROOT}" \
                   bash "${script}"; then
                  BUILT=1
                  break
                fi
                ;;
              *.py)
                if ANDROID_NDK_HOME="${ANDROID_NDK_HOME}" ANDROID_NDK_ROOT="${ANDROID_NDK_ROOT}" \
                   python3 "${script}"; then
                  BUILT=1
                  break
                fi
                ;;
            esac
          done

          # Fallback: Android-specific CMake project.
          if [ "${BUILT}" -eq 0 ]; then
            mapfile -t CMAKES < <(find . -maxdepth 5 -type f -name CMakeLists.txt -printf '%h\n' | \
              grep -Ei 'android|gta5' | sort -u)

            for src in "${CMAKES[@]}"; do
              echo "Trying CMake source: ${src}"
              rm -rf "${GITHUB_WORKSPACE}/cmake-build"
              if cmake -S "${src}" -B "${GITHUB_WORKSPACE}/cmake-build" -G Ninja \
                   -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
                   -DANDROID_ABI="${ANDROID_ABI}" \
                   -DANDROID_PLATFORM="android-${ANDROID_API}" \
                   -DCMAKE_BUILD_TYPE=Release && \
                 cmake --build "${GITHUB_WORKSPACE}/cmake-build" --parallel "$(nproc)"; then
                BUILT=1
                break
              fi
            done
          fi

          mkdir -p "${GITHUB_WORKSPACE}/native-output"
          find . "${GITHUB_WORKSPACE}/cmake-build" -type f \( -name '*.so' -o -name '*.a' \) \
            -exec cp -av --parents {} "${GITHUB_WORKSPACE}/native-output/" \; 2>/dev/null || true

          if [ "${BUILT}" -eq 0 ]; then
            echo "::error::No upstream Android build entry point completed successfully."
            exit 1
          fi

      - name: Package APK when upstream inputs are available
        shell: bash
        run: |
          set -euxo pipefail
          cd "${GITHUB_WORKSPACE}/AndroidGTAV"

          PKG="$(find . -type f -iname 'package_apk.py' | head -1 || true)"
          if [ -z "${PKG}" ]; then
            echo "::error::package_apk.py not found."
            exit 1
          fi

          # Some revisions package from an upstream baseline APK.
          BASE="$(find . -type f -iname '*.apk' | head -1 || true)"
          DEX="$(find . -type f -name 'classes.dex' | head -1 || true)"
          SO="$(find . "${GITHUB_WORKSPACE}/native-output" -type f -name '*.so' | \
                grep -Ei '/arm64|arm64-v8a|aarch64|libgtav' | head -1 || true)"

          mkdir -p "${GITHUB_WORKSPACE}/apk-output"

          echo "package script: ${PKG}"
          echo "baseline apk: ${BASE:-<none>}"
          echo "dex: ${DEX:-<none>}"
          echo "native so: ${SO:-<none>}"

          # First try the common positional/base form only when a baseline is bundled.
          if [ -n "${BASE}" ]; then
            set +e
            python3 "${PKG}" "${BASE}" \
              --output "${GITHUB_WORKSPACE}/apk-output/AndroidGTAV-native-unsigned.apk" \
              ${DEX:+--dex "${DEX}"}
            RC=$?
            set -e
            if [ "${RC}" -ne 0 ]; then
              echo "Upstream packager requires a different command line; packaging help was printed earlier."
            fi
          fi

          # Collect any APK produced by upstream build/package steps.
          find . -type f -iname '*.apk' -exec cp -av {} "${GITHUB_WORKSPACE}/apk-output/" \; || true

          COUNT="$(find "${GITHUB_WORKSPACE}/apk-output" -type f -iname '*.apk' | wc -l)"
          if [ "${COUNT}" -eq 0 ]; then
            echo "::error::Native compilation completed, but upstream did not provide enough packaging inputs to emit an APK."
            exit 1
          fi

      - name: APK diagnostics
        if: always()
        run: |
          echo "==== APK outputs ===="
          find "${GITHUB_WORKSPACE}" -type f -iname '*.apk' -print -exec file {} \; || true
          echo "==== Native outputs ===="
          find "${GITHUB_WORKSPACE}/native-output" -type f -name '*.so' -print 2>/dev/null || true

      - name: Upload native build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidGTAV-native-build
          path: |
            native-output/**
            androidgtav-upstream-sha.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidGTAV-native-apk
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 7
