      - name: Add native runtime crash diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$(cygpath -u "$GITHUB_WORKSPACE")/incremental-engine"
          ARCHIVE="$OUT/libgtav_engine_partial.a"
          NDK="$(cygpath -u "$ANDROID_SDK_ROOT")/ndk/29.0.14206865"
          CLANG="$(find "$NDK/toolchains/llvm/prebuilt/windows-x86_64/bin" -iname 'clang.exe' -print -quit)"
          AR="$(find "$NDK/toolchains/llvm/prebuilt/windows-x86_64/bin" -iname 'llvm-ar.exe' -print -quit)"
          test -s "$ARCHIVE"
          test -s "$CLANG"
          test -s "$AR"

          cat > "$OUT/gtav_runtime_diag.c" <<'EOF'
          #define _GNU_SOURCE
          #include <android/log.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <signal.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>
          #include <sys/stat.h>
          #include <sys/types.h>
          #include <ucontext.h>
          #include <unistd.h>
          #include <pthread.h>
          #include <dlfcn.h>
          #include <jni.h>
          #include <android/native_activity.h>
          #include <android/native_window_jni.h>
          #include <android/asset_manager_jni.h>
          #include <android/configuration.h>
          #include <android/looper.h>
          #include <android/api-level.h>

          static const char* kLog = "/storage/emulated/0/Games/GTAV/gtav-native-crash.txt";
          static const char* kTrace = "/storage/emulated/0/Games/GTAV/gtav-startup-trace.txt";
          static const char* kRoot = "/storage/emulated/0/Games/GTAV";

          static void write_all(int fd, const char* s) {
              if (fd < 0 || !s) return;
              size_t n = strlen(s);
              while (n) {
                  ssize_t r = write(fd, s, n);
                  if (r <= 0) break;
                  s += r; n -= (size_t)r;
              }
          }

          static void log_line(const char* s) {
              __android_log_print(ANDROID_LOG_ERROR, "GTAVNativeDiag", "%s", s ? s : "");
              int fd = open(kLog, O_CREAT|O_WRONLY|O_APPEND, 0666);
              if (fd >= 0) {
                  write_all(fd, s);
                  write_all(fd, "\n");
                  fsync(fd);
                  close(fd);
              }
              int tfd = open(kTrace, O_CREAT|O_WRONLY|O_APPEND, 0666);
              if (tfd >= 0) {
                  write_all(tfd, s);
                  write_all(tfd, "\n");
                  fsync(tfd);
                  close(tfd);
              }
          }


          static volatile unsigned long g_seq = 0;
          static void checkpoint(const char* tag) {
              char b[320];
              unsigned long n = __sync_add_and_fetch(&g_seq, 1);
              snprintf(b, sizeof(b), "SEQ=%lu CHECKPOINT=%s pid=%d", n, tag ? tag : "?", getpid());
              log_line(b);
          }

          __attribute__((destructor))
          static void gtav_diag_fini(void) {
              checkpoint("libgtav-unloading");
          }

          static void crash_handler(int sig, siginfo_t* info, void* ctxp) {
              char b[512];
              uintptr_t pc=0, sp=0, lr=0;
          #if defined(__aarch64__)
              ucontext_t* uc=(ucontext_t*)ctxp;
              if (uc) {
                  pc=(uintptr_t)uc->uc_mcontext.pc;
                  sp=(uintptr_t)uc->uc_mcontext.sp;
                  lr=(uintptr_t)uc->uc_mcontext.regs[30];
              }
          #endif
              int fd = open(kLog, O_CREAT|O_WRONLY|O_APPEND, 0666);
              if (fd >= 0) {
                  int n = snprintf(b, sizeof(b),
                      "\n=== GTAV NATIVE CRASH ===\n"
                      "seq=%lu signal=%d fault=%p pc=0x%lx lr=0x%lx sp=0x%lx errno=%d\n",
                      (unsigned long)__sync_add_and_fetch(&g_seq, 1), sig, info ? info->si_addr : 0,
                      (unsigned long)pc, (unsigned long)lr, (unsigned long)sp, errno);
                  if (n > 0) write(fd, b, (size_t)n);
                  close(fd);
              }
              signal(sig, SIG_DFL);
              raise(sig);
          }


          typedef unsigned long pthread_t_diag;
          extern int __real_pthread_create(pthread_t_diag*, const void*, void*(*)(void*), void*);
          int __wrap_pthread_create(pthread_t_diag* t, const void* a, void*(*fn)(void*), void* arg) {
              checkpoint("pthread-create");
              return __real_pthread_create(t, a, fn, arg);
          }

          extern void* __real_dlopen(const char*, int);
          void* __wrap_dlopen(const char* name, int flags) {
              char b[320];
              snprintf(b, sizeof(b), "dlopen:%s", name ? name : "(null)");
              checkpoint(b);
              return __real_dlopen(name, flags);
          }

          struct android_dlextinfo;
          extern void* __real_android_dlopen_ext(const char*, int, const struct android_dlextinfo*);
          void* __wrap_android_dlopen_ext(const char* name, int flags, const struct android_dlextinfo* ext) {
              char b[320];
              snprintf(b, sizeof(b), "android_dlopen_ext:%s", name ? name : "(null)");
              checkpoint(b);
              return __real_android_dlopen_ext(name, flags, ext);
          }

          extern void __real_exit(int);
          void __wrap_exit(int code) {
              char b[128];
              snprintf(b, sizeof(b), "process-exit:%d", code);
              checkpoint(b);
              __real_exit(code);
          }

          extern void __real__exit(int);
          void __wrap__exit(int code) {
              char b[128];
              snprintf(b, sizeof(b), "process-_exit:%d", code);
              checkpoint(b);
              __real__exit(code);
          }

          extern void __real_abort(void);
          void __wrap_abort(void) {
              checkpoint("process-abort");
              __real_abort();
          }


          /*
           * XHYN GTAVActivity extends SDLActivity and getMainFunction() returns
           * "SDL_main".  The engine itself implements NativeActivity-style
           * android_main(android_app*).  Build the missing compatibility bridge
           * from the live SDLActivity/Surface instead of casting argc to a pointer.
           */
          struct gtav_android_poll_source {
              int32_t id;
              struct gtav_android_app* app;
              void (*process)(struct gtav_android_app*, struct gtav_android_poll_source*);
          };

          struct gtav_android_app {
              void* userData;
              void (*onAppCmd)(struct gtav_android_app*, int32_t);
              int32_t (*onInputEvent)(struct gtav_android_app*, AInputEvent*);
              ANativeActivity* activity;
              AConfiguration* config;
              void* savedState;
              size_t savedStateSize;
              ALooper* looper;
              AInputQueue* inputQueue;
              ANativeWindow* window;
              ARect contentRect;
              int activityState;
              int destroyRequested;
              pthread_mutex_t mutex;
              pthread_cond_t cond;
              int msgread;
              int msgwrite;
              pthread_t thread;
              struct gtav_android_poll_source cmdPollSource;
              struct gtav_android_poll_source inputPollSource;
              int running;
              int stateSaved;
              int destroyed;
              int redrawNeeded;
              AInputQueue* pendingInputQueue;
              ANativeWindow* pendingWindow;
              ARect pendingContentRect;
          };

          extern void android_main(struct gtav_android_app*);

          static void* gtav_bridge_lifecycle(void* opaque) {
              struct gtav_android_app* app = (struct gtav_android_app*)opaque;
              checkpoint("sdl-bridge-lifecycle-thread");
              for (int i=0; i<500 && !app->onAppCmd; ++i) usleep(1000);
              if (!app->onAppCmd) {
                  checkpoint("sdl-bridge-no-onAppCmd");
                  return 0;
              }
              checkpoint("sdl-bridge-appcmd-start");
              app->activityState = 10;
              app->onAppCmd(app, 10); /* APP_CMD_START */
              checkpoint("sdl-bridge-appcmd-resume");
              app->activityState = 11;
              app->onAppCmd(app, 11); /* APP_CMD_RESUME */
              if (app->window) {
                  checkpoint("sdl-bridge-appcmd-init-window");
                  app->onAppCmd(app, 1); /* APP_CMD_INIT_WINDOW */
              }
              return 0;
          }

          __attribute__((visibility("default")))
          int SDL_main(int argc, char** argv) {
              (void)argc; (void)argv;
              checkpoint("SDL_main-enter");

              typedef JNIEnv* (*PFN_SDL_AndroidGetJNIEnv)(void);
              typedef jobject (*PFN_SDL_AndroidGetActivity)(void);
              typedef const char* (*PFN_SDL_Path)(void);

              void* sdl_handle = dlopen("libSDL2.so", RTLD_NOW | RTLD_NOLOAD);
              if (!sdl_handle) sdl_handle = dlopen("libSDL2.so", RTLD_NOW);
              if (!sdl_handle) {
                  checkpoint("sdl-bridge-no-sdl2-handle");
                  return -100;
              }
              checkpoint("sdl-bridge-sdl2-handle-ok");

              PFN_SDL_AndroidGetJNIEnv get_env =
                  (PFN_SDL_AndroidGetJNIEnv)dlsym(sdl_handle, "SDL_AndroidGetJNIEnv");
              PFN_SDL_AndroidGetActivity get_activity =
                  (PFN_SDL_AndroidGetActivity)dlsym(sdl_handle, "SDL_AndroidGetActivity");
              PFN_SDL_Path get_internal =
                  (PFN_SDL_Path)dlsym(sdl_handle, "SDL_AndroidGetInternalStoragePath");
              PFN_SDL_Path get_external =
                  (PFN_SDL_Path)dlsym(sdl_handle, "SDL_AndroidGetExternalStoragePath");

              if (!get_env || !get_activity) {
                  checkpoint("sdl-bridge-missing-sdl-api");
                  dlclose(sdl_handle);
                  return -101;
              }
              checkpoint("sdl-bridge-sdl-api-ok");

              JNIEnv* env = get_env();
              jobject activity_obj = get_activity();
              if (!env || !activity_obj) {
                  checkpoint("sdl-bridge-no-jni-activity");
                  return -102;
              }
              checkpoint("sdl-bridge-jni-activity-ok");

              JavaVM* vm = 0;
              if ((*env)->GetJavaVM(env, &vm) != JNI_OK || !vm) {
                  checkpoint("sdl-bridge-no-javavm");
                  return -103;
              }

              jclass sdl_cls = (*env)->FindClass(env, "org/libsdl/app/SDLActivity");
              if (!sdl_cls) {
                  (*env)->ExceptionClear(env);
                  checkpoint("sdl-bridge-no-sdlactivity-class");
                  return -104;
              }
              jfieldID surface_fid = (*env)->GetStaticFieldID(
                  env, sdl_cls, "mSurface", "Lorg/libsdl/app/SDLSurface;");
              if (!surface_fid) {
                  (*env)->ExceptionClear(env);
                  checkpoint("sdl-bridge-no-msurface-field");
                  return -105;
              }
              jobject surface_view = (*env)->GetStaticObjectField(env, sdl_cls, surface_fid);
              if (!surface_view) {
                  checkpoint("sdl-bridge-no-surface-view");
                  return -106;
              }

              jclass sv_cls = (*env)->GetObjectClass(env, surface_view);
              jmethodID get_holder = (*env)->GetMethodID(
                  env, sv_cls, "getHolder", "()Landroid/view/SurfaceHolder;");
              jobject holder = get_holder
                  ? (*env)->CallObjectMethod(env, surface_view, get_holder) : 0;
              if ((*env)->ExceptionCheck(env)) (*env)->ExceptionClear(env);
              if (!holder) {
                  checkpoint("sdl-bridge-no-surface-holder");
                  return -107;
              }

              jclass holder_cls = (*env)->GetObjectClass(env, holder);
              jmethodID get_surface = (*env)->GetMethodID(
                  env, holder_cls, "getSurface", "()Landroid/view/Surface;");
              jobject surface = get_surface
                  ? (*env)->CallObjectMethod(env, holder, get_surface) : 0;
              if ((*env)->ExceptionCheck(env)) (*env)->ExceptionClear(env);
              if (!surface) {
                  checkpoint("sdl-bridge-no-java-surface");
                  return -108;
              }

              ANativeWindow* window = ANativeWindow_fromSurface(env, surface);
              if (!window) {
                  checkpoint("sdl-bridge-no-native-window");
                  return -109;
              }
              checkpoint("sdl-bridge-native-window-ok");

              jclass act_cls = (*env)->GetObjectClass(env, activity_obj);
              jmethodID get_assets = (*env)->GetMethodID(
                  env, act_cls, "getAssets", "()Landroid/content/res/AssetManager;");
              jobject java_assets = get_assets
                  ? (*env)->CallObjectMethod(env, activity_obj, get_assets) : 0;
              if ((*env)->ExceptionCheck(env)) (*env)->ExceptionClear(env);
              AAssetManager* assets = java_assets
                  ? AAssetManager_fromJava(env, java_assets) : 0;

              static ANativeActivityCallbacks callbacks;
              static ANativeActivity native_activity;
              static struct gtav_android_app app;
              memset(&callbacks, 0, sizeof(callbacks));
              memset(&native_activity, 0, sizeof(native_activity));
              memset(&app, 0, sizeof(app));

              native_activity.callbacks = &callbacks;
              native_activity.vm = vm;
              native_activity.env = env;
              native_activity.clazz = (*env)->NewGlobalRef(env, activity_obj);
              native_activity.assetManager = assets;
              native_activity.internalDataPath = get_internal ? get_internal() : kRoot;
              native_activity.externalDataPath = get_external ? get_external() : kRoot;
              native_activity.sdkVersion = android_get_device_api_level();

              app.activity = &native_activity;
              app.config = AConfiguration_new();
              if (app.config && assets) AConfiguration_fromAssetManager(app.config, assets);
              app.looper = ALooper_forThread();
              if (!app.looper) app.looper = ALooper_prepare(ALOOPER_PREPARE_ALLOW_NON_CALLBACKS);
              app.window = window;
              app.pendingWindow = window;
              app.activityState = 11;
              app.running = 1;

              checkpoint("sdl-bridge-android-app-ready");

              pthread_t lifecycle;
              if (pthread_create(&lifecycle, 0, gtav_bridge_lifecycle, &app) == 0)
                  pthread_detach(lifecycle);
              else
                  checkpoint("sdl-bridge-lifecycle-thread-failed");

              checkpoint("android_main-enter");
              android_main(&app);
              checkpoint("android_main-return");

              if (app.config) AConfiguration_delete(app.config);
              ANativeWindow_release(window);
              dlclose(sdl_handle);
              return 0;
          }

          __attribute__((constructor))
          static void gtav_diag_init(void) {
              mkdir("/storage/emulated/0/Games", 0777);
              mkdir(kRoot, 0777);

              int fd = open(kLog, O_CREAT|O_WRONLY|O_TRUNC, 0666);
              if (fd >= 0) {
                  write_all(fd, "GTAV native runtime diagnostics v1\n");
                  close(fd);
              }

              struct stat st;
              char line[256];
              int ok = stat(kRoot, &st) == 0;
              snprintf(line, sizeof(line),
                       "CHECKPOINT=libgtav-loaded asset_root=%s exists=%d readable=%d writable=%d",
                       kRoot, ok, access(kRoot,R_OK)==0, access(kRoot,W_OK)==0);
              log_line(line);
              checkpoint("diagnostic-installed");
              checkpoint("signal-hooks-install-begin");

              const int sigs[] = {SIGSEGV,SIGABRT,SIGBUS,SIGILL,SIGTRAP,SIGFPE};
              struct sigaction sa;
              memset(&sa,0,sizeof(sa));
              sa.sa_sigaction=crash_handler;
              sa.sa_flags=SA_SIGINFO|SA_RESETHAND;
              sigemptyset(&sa.sa_mask);
              for (unsigned i=0;i<sizeof(sigs)/sizeof(sigs[0]);++i)
                  sigaction(sigs[i], &sa, 0);
              checkpoint("signal-hooks-installed");
              checkpoint("constructor-complete");
          }
          EOF

          "$CLANG" --target=aarch64-linux-android26 -fPIC -O2             -c "$OUT/gtav_runtime_diag.c" -o "$OUT/gtav_runtime_diag.o"
          "$AR" rcs "$ARCHIVE" "$OUT/gtav_runtime_diag.o"
          echo "Runtime diagnostics object merged."

      - name: Upload completed startup-resolved engine archive
        if: ${{ false }} # already contained in completed build #241 archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidGTAV-engine-startup-resolved
          path: incremental-engine/libgtav_engine_partial.a
          retention-days: 7
          compression-level: 0
      - name: Probe libgtav.so link with reconstructed engine archive
        shell: bash
        working-directory: AndroidGTAV/gta5/src/dev_ng/android_build
        run: |
          set -euxo pipefail
          OUT="$GITHUB_WORKSPACE/incremental-engine"
          ARCHIVE="$OUT/libgtav_engine_partial.a"
          test -f "$ARCHIVE"

          # Put our reconstructed archive where the upstream Android.mk expects
          # the cumulative engine archive. No APK baseline is required for this
          # diagnostic link pass.
          BASE="RB_zcode_audiosched_0919/integrated"
          mkdir -p "$BASE"
          cp -f "$ARCHIVE" "$BASE/libgtav_engine.a"
          # app/jni/Android.mk links jni/../../libgtav_engine.a, which resolves
          # to android_build/app/libgtav_engine.a (not the packaging baseline).
          # Feed the reconstructed engine archive at the exact path expected by
          # the real upstream linker.
          cp -f "$ARCHIVE" app/libgtav_engine.a
          # LOCAL_LDLIBS is evaluated from the NDK project root here, so the
          # literal jni/../../libgtav_engine.a resolves two levels above
          # android_build, not relative to app/jni/Android.mk.
          mkdir -p ../../
          cp -f "$ARCHIVE" ../../libgtav_engine.a
          test -s app/libgtav_engine.a
          test -s ../../libgtav_engine.a
          echo "Engine archive staged: $(wc -c < app/libgtav_engine.a) bytes (app + NDK root-relative target)"

          # package_apk.py/Android.mk expect the historical X: mapping and NDK29.
          # NDK r29 requires an explicit output directory when NDK_PROJECT_PATH=null.
          # Use the actual Android build directory as the NDK project root.
          # r29 otherwise enters its NDK_PROJECT_PATH=null validation path before
          # consuming APP_BUILD_SCRIPT on Windows.
          export NDK_PROJECT_PATH="X:/gta5/src/dev_ng/android_build"
          # ndk-build receives these as make variables; environment-only values
          # are not consistently honored by r29 on Windows.
          # ndk-build itself is a Windows cmd/make chain. Use native Windows paths
          # here; X:/ POSIX-style paths were rejected as an unknown build script.
          APP_BUILD_SCRIPT_WIN="X:\\gta5\\src\\dev_ng\\android_build\\Android.mk"
          NDK_APPLICATION_MK_WIN=""
          if [ -f Application.mk ]; then NDK_APPLICATION_MK_WIN="X:\\gta5\\src\\dev_ng\\android_build\\Application.mk"; fi
          # Upstream keeps the NDK makefile under jni/ on this snapshot.
          if [ -f Android.mk ]; then
            MAKEFILE_REL="Android.mk"
          elif [ -f jni/Android.mk ]; then
            MAKEFILE_REL="jni/Android.mk"
          else
            MAKEFILE_REL="$(find . -maxdepth 3 -type f -name Android.mk -print -quit)"
          fi
          if [ -z "$MAKEFILE_REL" ]; then
            echo "::error::Android.mk not found under $(pwd)"
            find . -maxdepth 3 -type f | sort | sed -n '1,200p'
            exit 1
          fi
          APP_BUILD_SCRIPT_WIN="X:\\gta5\\src\\dev_ng\\android_build\\${MAKEFILE_REL//\//\\}"
          echo "Android.mk present: $MAKEFILE_REL -> $APP_BUILD_SCRIPT_WIN"
          # Android.mk hardcodes a cwd-relative archive in LOCAL_LDLIBS. Replace
          # only that path in the ephemeral checkout with an absolute X: path,
          # avoiding ambiguity about ndk-build/clang's working directory.
          # Patch the real gtav module structurally: remove the raw archive
          # linker fragment, attach a whole-static module before BUILD_SHARED_LIBRARY,
          # then define the prebuilt archive as a separate module.
          python - "$MAKEFILE_REL" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()

          # Remove only the archive fragment while preserving the surrounding
          # LOCAL_LDFLAGS continuation and any other flags.
          s, n = re.subn(
              r'-Wl,--whole-archive\s+jni/\.\./\.\./libgtav_engine\.a\s+-Wl,--no-whole-archive',
              '',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit("raw engine archive fragment not found")

          marker = 'include $(BUILD_SHARED_LIBRARY)'
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit("gtav BUILD_SHARED_LIBRARY marker not found")

          # This assignment is inserted immediately before the first shared
          # library build, while LOCAL_MODULE is still gtav.
          attach = 'LOCAL_WHOLE_STATIC_LIBRARIES += gtav_engine_reconstructed\n'
          s = s[:pos] + attach + s[pos:]

          # Define the prebuilt only after gtav has been fully declared.
          pos = s.find(marker, pos + len(attach))
          end = pos + len(marker)
          prebuilt = (
              '\n\ninclude $(CLEAR_VARS)\n'
              'LOCAL_MODULE := gtav_engine_reconstructed\n'
              'LOCAL_SRC_FILES := X:/gta5/src/dev_ng/android_build/app/libgtav_engine.a\n'
              'include $(PREBUILT_STATIC_LIBRARY)\n'
          )
          s = s[:end] + prebuilt + s[end:]
          p.write_text(s)
          PY
          echo "=== Effective engine linker stanza ==="
          grep -n -E 'gtav_engine_reconstructed|libgtav_engine.a|WHOLE_STATIC' "$MAKEFILE_REL" || true
          # Keep make syntax untouched; pass diagnostic linker/runtime flags as
          # ndk-build variables instead of inserting lines into continued blocks.
          grep -n "libgtav_engine.a" "$MAKEFILE_REL" || true
          # The Android platform libraries are selected by API level. Vulkan is
          # available from API 24 and AAudio from API 26; the NDK defaulted this
          # diagnostic link to android-21, where neither stub is available.
          NDK_ARGS_EXTRA=("APP_PLATFORM=android-26")
          export NDK_OUT="$(cygpath -m "$GITHUB_WORKSPACE")/ndk-out"
          export NDK_LIBS_OUT="$(cygpath -m "$GITHUB_WORKSPACE")/ndk-libs"
          mkdir -p "$(cygpath -u "$GITHUB_WORKSPACE")/ndk-out" "$(cygpath -u "$GITHUB_WORKSPACE")/ndk-libs"
          NDKBUILD="$(cygpath -u "$ANDROID_SDK_ROOT")/ndk/29.0.14206865/ndk-build.cmd"
          test -f "$NDKBUILD"

          set +e
          WRAP_FLAGS="-Wl,--error-limit=0 -Wl,--wrap=pthread_create -Wl,--wrap=dlopen -Wl,--wrap=android_dlopen_ext -Wl,--wrap=exit -Wl,--wrap=_exit -Wl,--wrap=abort"
          NDK_ARGS=("NDK_PROJECT_PATH=X:\\gta5\\src\\dev_ng\\android_build" "APP_BUILD_SCRIPT=$APP_BUILD_SCRIPT_WIN" "NDK_OUT=$NDK_OUT" "NDK_LIBS_OUT=$NDK_LIBS_OUT" "CONFIG=release" "APP_ABI=arm64-v8a" "APP_STL=c++_shared" "V=1" "LOCAL_LDFLAGS+=$WRAP_FLAGS" "${NDK_ARGS_EXTRA[@]}")
          if [ -n "$NDK_APPLICATION_MK_WIN" ]; then NDK_ARGS+=("NDK_APPLICATION_MK=$NDK_APPLICATION_MK_WIN"); fi
          cmd.exe //c "$(cygpath -w "$NDKBUILD")" -C X:\\gta5\\src\\dev_ng\\android_build "${NDK_ARGS[@]}" > "$OUT/link.log" 2>&1
          LINK_RC=$?
          set -e

          echo "LINK_RC=$LINK_RC" | tee "$OUT/link-summary.txt"
          tail -n 500 "$OUT/link.log" || true
          echo "=== Effective linker command ===" | tee "$OUT/link-command.txt"
          grep -Ei 'clang\+\+|ld\.lld|whole-archive|libgtav_engine\.a' "$OUT/link.log" | tail -n 40 | tee -a "$OUT/link-command.txt" || true
          find . -type f -name 'libgtav.so' -print | tee "$OUT/libgtav-so.txt" || true

          # Resolve the final ELF before auditing exported NativeActivity symbols.
          SO="$(cygpath -u "$GITHUB_WORKSPACE")/ndk-libs/arm64-v8a/libgtav.so"
          if [ "$LINK_RC" -ne 0 ] || [ ! -s "$SO" ]; then
            echo "::error::libgtav.so link failed or output is missing (LINK_RC=$LINK_RC)"
            exit 1
          fi

          # XHYN launches through SDLActivity. SDL's nativeRunMain resolves
          # android_main from libgtav.so; ANativeActivity_onCreate is not used.
          NM="$(find "$(cygpath -u "$ANDROID_SDK_ROOT")/ndk/29.0.14206865/toolchains/llvm/prebuilt/windows-x86_64/bin" -iname 'llvm-nm.exe' -print -quit)"
          if [ -n "$NM" ] && [ -s "$NM" ]; then
            "$NM" -D "$SO" | grep -E 'android_main' | tee "$OUT/native-entrypoints.txt"
            grep -q 'android_main' "$OUT/native-entrypoints.txt" || {
              echo "::error::libgtav.so is missing SDL entry point android_main"
              exit 1
            }
          fi
          grep -oE 'undefined symbol: .*' "$OUT/link.log" | sed 's/^undefined symbol: //' | sort -u > "$OUT/undefined-symbols.txt" || true
          echo "Captured unresolved symbols: $(wc -l < "$OUT/undefined-symbols.txt")"

          # This is a diagnostic pass: preserve linker output even when symbols
          # are still missing so the next patch can target the exact failures.
          # Audit the final ELF: LINK_RC=0 may still leave RAGE symbols for dlopen.
          READELF="$(find "$(cygpath -u "$ANDROID_SDK_ROOT")/ndk/29.0.14206865/toolchains/llvm/prebuilt/windows-x86_64/bin" -iname 'llvm-readelf.exe' -print -quit)"
          CXXFILT="$(find "$(cygpath -u "$ANDROID_SDK_ROOT")/ndk/29.0.14206865/toolchains/llvm/prebuilt/windows-x86_64/bin" -iname 'llvm-cxxfilt.exe' -print -quit)"
          test -s "$READELF"; test -s "$SO"
          "$READELF" -Ws "$SO" | awk '$7=="UND" && $8!="" {print $8}' | sed 's/@.*$//' | sort -u > "$OUT/final-undefined-symbols.txt"
          grep '^_ZN4rage' "$OUT/final-undefined-symbols.txt" > "$OUT/final-rage-undefined.txt" || true
          if [ -n "$CXXFILT" ] && [ -s "$CXXFILT" ]; then "$CXXFILT" < "$OUT/final-rage-undefined.txt" > "$OUT/final-rage-undefined-demangled.txt"; fi
          echo "Final ELF undefined symbols: $(wc -l < "$OUT/final-undefined-symbols.txt")"
          echo "Final unresolved rage symbols: $(wc -l < "$OUT/final-rage-undefined.txt")"

          # XHYN/SDL can only dlopen libgtav.so when ALL non-platform imports
          # are provided. Track game/global/WolfSSL imports, not just rage::*.
          "$CXXFILT" < "$OUT/final-undefined-symbols.txt" > "$OUT/final-undefined-demangled.txt" || true
          python - "$OUT/final-undefined-symbols.txt" "$OUT/final-undefined-demangled.txt" "$OUT/final-custom-undefined.txt" <<'PY'
          from pathlib import Path
          import sys
          mangled=Path(sys.argv[1]).read_text(errors="ignore").splitlines()
          dem=Path(sys.argv[2]).read_text(errors="ignore").splitlines()
          out=[]
          for m,d in zip(mangled,dem):
              custom = (
                  (m.startswith("_Z") and not d.startswith(("std::","__gnu_cxx::"))) or
                  m.startswith(("wolfSSL","wolfTLS","wolfDTLS","g_","gVp","EmbedSend"))
              )
              if custom:
                  out.append(f"{m}\t{d}")
          Path(sys.argv[3]).write_text("\n".join(out)+("\n" if out else ""))
          print("FINAL_CUSTOM_UNRESOLVED=", len(out))
          for x in out[:250]: print(x)
          PY

          # Fast source locator for the concrete startup blocker; no 5,091-source rebuild.
          cd /x/gta5/src/dev_ng
          grep -RIl --include='*.cpp' --include='*.cc' --include='*.cxx' --include='*.c' --include='*.h' --include='*.hpp' --include='*.inl' -E 'sm_gameTime|fwTimer' rage game 2>/dev/null | sort -u > "$OUT/rage-symbol-source-hits.txt" || true
          echo "fwTimer/sm_gameTime source hits: $(wc -l < "$OUT/rage-symbol-source-hits.txt")"
          cat "$OUT/rage-symbol-source-hits.txt" || true

          exit 0

      - name: Upload libgtav link diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: AndroidGTAV-libgtav-link-diagnostics
          path: |
            incremental-engine/link.log
            incremental-engine/link-summary.txt
            incremental-engine/link-command.txt
            incremental-engine/libgtav-so.txt
            incremental-engine/undefined-symbols.txt
            incremental-engine/final-undefined-symbols.txt
            incremental-engine/final-rage-undefined.txt
            incremental-engine/final-rage-undefined-demangled.txt
            incremental-engine/rage-symbol-source-hits.txt
            incremental-engine/native-entrypoints.txt
            incremental-engine/final-undefined-demangled.txt
            incremental-engine/final-custom-undefined.txt
            startup-retry/sources.txt
            startup-retry/failures.txt
            startup-retry/compiled/build.log
            startup-retry/source-locations.txt
            incremental-engine/wolfssl-cmake-config.log
            incremental-engine/wolfssl-cmake-build.log
            incremental-engine/wolfssl-merge-skipped.txt
            final-network-retry/sources.txt
            final-network-retry/failures.txt
            final-network-retry/compiled/build.log
            AndroidGTAV/gta5/src/dev_ng/android_build/libs/**/libgtav.so
            AndroidGTAV/gta5/src/dev_ng/android_build/obj/**/libgtav.so
          if-no-files-found: warn
          retention-days: 7
      - name: Restore full ARM64 object cache
        if: env.FAST_FINAL_DIAG != 'true'
        id: full-cache
        uses: actions/cache@v4
        with:
          path: AndroidGTAV/gta5/src/dev_ng/android_build/ci_full
          key: androidgtav-arm64-full-${{ runner.os }}-${{ hashFiles('AndroidGTAV/gta5/src/dev_ng/android_build/lists/*.txt', 'AndroidGTAV/gta5/src/dev_ng/android_build/scripts/build_sys.sh') }}

      - name: Compile all upstream Android source manifests
        if: ${{ false }} # Full survey already completed; use existing compiled-object artifact for follow-up work.
        shell: bash
        working-directory: AndroidGTAV/gta5/src/dev_ng/android_build
        run: |
          set -euxo pipefail
          mkdir -p ci_full/compiled
          python - <<'PY'
          from pathlib import Path
          root = Path("lists")
          out = Path("ci_full/sources.txt")
          seen = set()
          rows = []
          for p in sorted(root.glob("*.txt")):
              for raw in p.read_text(encoding="utf-8", errors="ignore").splitlines():
                  s = raw.strip()
                  if not s or s.startswith("#"):
                      continue
                  if s not in seen:
                      seen.add(s)
                      rows.append(s)
          out.write_text("\n".join(rows) + "\n", encoding="utf-8")
          print(f"manifests={len(list(root.glob('*.txt')))} unique_sources={len(rows)}")
          PY

          if [ -s ci_full/physical_objects.txt ] && [ -d ci_full/compiled ]; then
            echo "Full ARM64 object cache restored; skipping 5,091-source rebuild."
            FULL_RC=0
          else
            set +e
            CONFIG=release bash scripts/build_sys.sh ci_full/sources.txt ci_full/compiled
            FULL_RC=$?
            set -e
          fi

          echo "===== FULL BUILD FAILURES ====="
          cat ci_full/compiled/failures.txt 2>/dev/null || true
          echo "===== FULL BUILD LOG TAIL ====="
          tail -n 500 ci_full/compiled/build.log 2>/dev/null || true

          find ci_full/compiled -type f -name '*.o' -print | sort > ci_full/objects.txt
          echo "Compiled object count: $(wc -l < ci_full/objects.txt)"
          echo "Source count: $(wc -l < ci_full/sources.txt)"
          echo "FULL_RC=$FULL_RC" > ci_full/summary.txt
          echo "OBJECTS=$(wc -l < ci_full/objects.txt)" >> ci_full/summary.txt
          echo "SOURCES=$(wc -l < ci_full/sources.txt)" >> ci_full/summary.txt

          # Preserve partial success: this stage is exploratory until every
          # upstream manifest is known to be Android-buildable.
          exit 0

      - name: Classify full-engine failures and build archive
        if: ${{ false }} # Disabled to avoid rebuilding 5,091 sources on every iteration.
        shell: bash
        working-directory: AndroidGTAV/gta5/src/dev_ng/android_build
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          base = Path("ci_full")
          fails = [x.strip() for x in (base/"compiled/failures.txt").read_text(errors="ignore").splitlines() if x.strip()]
          wolf = [x for x in fails if "wolfssl/" in x.lower()]
          engine = [x for x in fails if x not in wolf]
          (base/"wolfssl_failures.txt").write_text("\n".join(wolf)+("\n" if wolf else ""))
          (base/"engine_failures.txt").write_text("\n".join(engine)+("\n" if engine else ""))
          objs = sorted((base/"compiled").glob("*.o"))
          (base/"physical_objects.txt").write_text("\n".join(str(x) for x in objs)+("\n" if objs else ""))
          with (base/"archive_summary.txt").open("w") as h:
              h.write(f"TOTAL_FAILURES={len(fails)}\nWOLFSSL_FAILURES={len(wolf)}\nENGINE_FAILURES={len(engine)}\nPHYSICAL_OBJECTS={len(objs)}\n")
          print((base/"archive_summary.txt").read_text())
          PY

          AR="$(find /c/Android/android-sdk/ndk/27.3.13750724/toolchains/llvm/prebuilt/windows-x86_64/bin -iname 'llvm-ar.exe' -print -quit)"
          test -f "$AR"
          mapfile -t OBJS < ci_full/physical_objects.txt
          if [ "${#OBJS[@]}" -gt 0 ]; then
            rm -f ci_full/libgtav_engine_partial.a
            "$AR" rcs ci_full/libgtav_engine_partial.a "${OBJS[@]}"
            "$AR" t ci_full/libgtav_engine_partial.a > ci_full/archive_members.txt
            echo "ARCHIVE_MEMBERS=$(wc -l < ci_full/archive_members.txt)" >> ci_full/archive_summary.txt
          fi
          cat ci_full/archive_summary.txt

      - name: Upload full-engine compile survey
        if: ${{ false }} # Existing survey artifact is the baseline for incremental work.
        uses: actions/upload-artifact@v4
        with:
          name: AndroidGTAV-full-engine-survey
          path: |
            AndroidGTAV/gta5/src/dev_ng/android_build/ci_full/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload compiled native objects
        if: env.FAST_FINAL_DIAG != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AndroidGTAV-native-objects
          path: |
            AndroidGTAV/gta5/src/dev_ng/android_build/ci_native/**
            androidgtav-upstream-sha.txt
            apk-shell-inventory.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Package from historical baseline
        if: env.FAST_FINAL_DIAG != 'true' && env.ANDROIDGTAV_BASELINE_READY == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          BUILD=/x/gta5/src/dev_ng/android_build
          SO="$(cygpath -u "$GITHUB_WORKSPACE")/ndk-libs/arm64-v8a/libgtav.so"
          CXX="$(cygpath -u "$GITHUB_WORKSPACE")/ndk-libs/arm64-v8a/libc++_shared.so"
          test -s "$SO"
          test -s "$CXX"

          cd "$BUILD"
          mapfile -t OBJS < ci_native/objects.txt
          python package_apk.py "${OBJS[@]}"
          test -s dist/gtav.apk
          cp dist/gtav.apk "$GITHUB_WORKSPACE/AndroidGTAV-native-vulkan.apk"
          cp dist/verification.json "$GITHUB_WORKSPACE/verification.json" || true
          cp dist/verification.txt "$GITHUB_WORKSPACE/verification.txt" || true
          cp dist/build.log "$GITHUB_WORKSPACE/build.log" || true
            echo "Found manifest: $MANIFEST"
            echo "Found dex: $DEX"
            echo "::error::Manifest exists but no supported upstream APK shell builder has been wired yet; inventory artifact contains exact inputs."
            exit 1
          fi

      - name: Build minimal NativeActivity APK shell
        if: ${{ false }} # XHYN shell is repacked locally
        shell: bash
        run: |
          set -euxo pipefail
          BUILD=/x/gta5/src/dev_ng/android_build
          SO="$(cygpath -u "$GITHUB_WORKSPACE")/ndk-libs/arm64-v8a/libgtav.so"
          CXX="$(cygpath -u "$GITHUB_WORKSPACE")/ndk-libs/arm64-v8a/libc++_shared.so"
          MANIFEST="$BUILD/app/AndroidManifest.xml"
          test -s "$SO"
          test -s "$CXX"
          test -s "$MANIFEST"

          # Build an install-safe shell manifest. The upstream manifest may carry
          # stale package/install attributes from its original build environment.
          python - "$MANIFEST" "$GITHUB_WORKSPACE/apk-shell-manifest.xml" <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          src, dst = map(pathlib.Path, sys.argv[1:3])
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          ns="{http://schemas.android.com/apk/res/android}"
          tree=ET.parse(src); root=tree.getroot()
          # Use a fresh package identity for the install-test shell. CI uses
          # an ephemeral signing key, so reusing the same package name across
          # builds can trigger INSTALL_FAILED_UPDATE_INCOMPATIBLE on Android.
          root.set("package","com.androidgtav.native.test")
          root.set(ns+"versionCode","186")
          root.set(ns+"versionName","0.186-test")
          root.attrib.pop(ns+"sharedUserId", None)
          root.attrib.pop(ns+"sharedUserLabel", None)

          # Keep the shell installable on modern Android while loading native
          # code directly through NativeActivity.
          app=root.find("application")
          if app is not None:
              app.set(ns+"extractNativeLibs","true")
              app.set(ns+"debuggable","true")
              app.set(ns+"hasCode","false")

              # Android 12+ requires explicit exported state for components
              # carrying intent filters. Make the launcher NativeActivity
              # explicitly exported and point it at libgtav.
              for act in app.findall("activity"):
                  if act.find("intent-filter") is not None:
                      act.set(ns+"exported","true")
                  meta = act.find("meta-data[@android:name='android.app.lib_name']",
                                  {"android":"http://schemas.android.com/apk/res/android"})
                  if meta is None:
                      meta = ET.SubElement(act, "meta-data")
                      meta.set(ns+"name","android.app.lib_name")
                  meta.set(ns+"value","gtav")

          # Avoid carrying a stale target/minSdk pair from the upstream shell.
          uses = root.find("uses-sdk")
          if uses is None:
              uses = ET.Element("uses-sdk")
              root.insert(0, uses)
          uses.set(ns+"minSdkVersion","26")
          uses.set(ns+"targetSdkVersion","28")

          tree.write(dst, encoding="utf-8", xml_declaration=True)
          PY
          MANIFEST="$GITHUB_WORKSPACE/apk-shell-manifest.xml"

          echo "=== Native runtime sizes before APK packaging ==="
          ls -lh "$SO" "$CXX"
          wc -c "$SO" "$CXX"
          sha256sum "$SO" "$CXX"
          FILE_TOOL="$(find "$(cygpath -u "$ANDROID_NDK_ROOT")/toolchains/llvm/prebuilt" -type f -iname 'llvm-readelf.exe' -print -quit || true)"
          if [ -n "$FILE_TOOL" ]; then
            "$FILE_TOOL" -h "$SO" | grep -E 'Class:|Machine:|Type:' || true
          fi

          SHELL="$GITHUB_WORKSPACE/apk-shell"
          rm -rf "$SHELL"
          mkdir -p "$SHELL/lib/arm64-v8a"
          cp "$SO" "$SHELL/lib/arm64-v8a/libgtav.so"
          cp "$CXX" "$SHELL/lib/arm64-v8a/libc++_shared.so"

          # NativeActivity apps do not require classes.dex. Compile the real
          # upstream manifest/resources directly with aapt2, then add libs.
          AAPT2="$(find "$(cygpath -u "$ANDROID_SDK_ROOT")/build-tools" -type f -iname 'aapt2.exe' -print | sort -V | tail -1)"
          ZIPALIGN="$(find "$(cygpath -u "$ANDROID_SDK_ROOT")/build-tools" -type f -iname 'zipalign.exe' -print | sort -V | tail -1)"
          APKSIGNER="$(find "$(cygpath -u "$ANDROID_SDK_ROOT")/build-tools" -type f -iname 'apksigner.bat' -print | sort -V | tail -1)"
          ANDROID_JAR="$(find "$(cygpath -u "$ANDROID_SDK_ROOT")/platforms" -type f -name android.jar -print | sort -V | tail -1)"
          test -s "$AAPT2"; test -s "$ZIPALIGN"; test -s "$ANDROID_JAR"

          RES="$BUILD/app/res"
          COMPILED="$SHELL/compiled.zip"
          if [ -d "$RES" ]; then
            "$AAPT2" compile --dir "$RES" -o "$COMPILED"
            "$AAPT2" link -o "$SHELL/base.apk" -I "$ANDROID_JAR" --manifest "$MANIFEST" "$COMPILED"
          else
            "$AAPT2" link -o "$SHELL/base.apk" -I "$ANDROID_JAR" --manifest "$MANIFEST"
          fi

          cp "$SHELL/base.apk" "$SHELL/unsigned.apk"
          cd "$SHELL"
          # NativeActivity loads these directly from the APK when extractNativeLibs=false.
          # Keep ELF files uncompressed so the platform can mmap them; zipalign below
          # provides the required APK alignment.
          7z a -tzip -mx=0 unsigned.apk lib/arm64-v8a/libgtav.so lib/arm64-v8a/libc++_shared.so >/dev/null
          "$ZIPALIGN" -f -P 16 4 unsigned.apk aligned.apk
          "$ZIPALIGN" -c -P 16 -v 4 aligned.apk

          # Create an ephemeral CI signing key; it is only for install testing.
          KEYSTORE="$SHELL/debug.jks"
          keytool -genkeypair -noprompt -keystore "$KEYSTORE" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          cmd.exe //c "$(cygpath -w "$APKSIGNER")" sign --ks "$(cygpath -w "$KEYSTORE")" --ks-pass pass:android --key-pass pass:android --out "$(cygpath -w "$GITHUB_WORKSPACE/AndroidGTAV-native-vulkan.apk")" "$(cygpath -w "$SHELL/aligned.apk")"
          test -s "$GITHUB_WORKSPACE/AndroidGTAV-native-vulkan.apk"

      - name: Verify APK structure
        if: always() && hashFiles('AndroidGTAV-native-vulkan.apk') != ''
        shell: pwsh
        run: |
          $apk = "$env:GITHUB_WORKSPACE\AndroidGTAV-native-vulkan.apk"
          if (-not (Test-Path $apk)) { throw "APK output missing" }
          $apksigner = "$env:ANDROID_SDK_ROOT\build-tools\$env:BUILD_TOOLS\apksigner.bat"
          & $apksigner verify --verbose $apk
          if ($LASTEXITCODE -ne 0) { throw "APK signature verification failed" }
          $aapt = "$env:ANDROID_SDK_ROOT\\build-tools\\$env:BUILD_TOOLS\\aapt.exe"
          Write-Host "=== APK badging ==="
          & $aapt dump badging $apk | Select-Object -First 8
          $zipalign = "$env:ANDROID_SDK_ROOT\\build-tools\\$env:BUILD_TOOLS\\zipalign.exe"
          & $zipalign -c -v 4 $apk
          if ($LASTEXITCODE -ne 0) { throw "APK zip/native-library alignment verification failed" }
          Get-FileHash $apk -Algorithm SHA256
          Get-Item $apk | Format-List FullName,Length,LastWriteTime
          Write-Host "=== APK native entries ==="
          & 7z l -slt $apk | Select-String -Pattern 'Path = lib/arm64-v8a/|Size = |Packed Size = '
          $tmp = Join-Path $env:RUNNER_TEMP "apk-native-audit"
          Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $tmp | Out-Null
          & 7z x -y "-o$tmp" $apk "lib/arm64-v8a/libgtav.so" "lib/arm64-v8a/libc++_shared.so" | Out-Null
          Get-ChildItem "$tmp\lib\arm64-v8a" | Select-Object Name,Length
          Get-FileHash "$tmp\lib\arm64-v8a\libgtav.so" -Algorithm SHA256

      - name: Upload APK
        if: always() && hashFiles('AndroidGTAV-native-vulkan.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: AndroidGTAV-native-vulkan-apk
          path: |
            AndroidGTAV-native-vulkan.apk
            verification.json
            verification.txt
            build.log
            androidgtav-upstream-sha.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload compiler diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidGTAV-build-failure
          path: |
            AndroidGTAV/gta5/src/dev_ng/android_build/ci_native/**
            AndroidGTAV/gta5/src/dev_ng/android_build/dist/build.log
            androidgtav-upstream-sha.txt
          if-no-files-found: warn
          retention-days: 7
