          tail -n 200 "$OUT/wolfssl-cmake-config.log" || true
          tail -n 300 "$OUT/wolfssl-cmake-build.log" || true

          WOLF_A="$(find "$BUILD" -type f \( -name 'libwolfssl.a' -o -name 'wolfssl.a' \) -print -quit)"
          if [ "$BUILD_RC" -ne 0 ] || [ -z "$WOLF_A" ] || [ ! -s "$WOLF_A" ]; then
            echo "::warning::WolfSSL CMake build failed; continue to final undefined-symbol audit."
