name: Build AndroidGTAV Native APK

on:
  push:
    branches: [androidgtav-native-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 180

    env:
      NDK_VERSION: 29.0.14206865
      BUILD_TOOLS: 37.0.0

    steps:
      - name: Checkout control repo
        uses: actions/checkout@v4

      - name: Locate Android SDK
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_SDK_ROOT
          if (-not $sdk) { $sdk = $env:ANDROID_HOME }
          if (-not $sdk) { $sdk = Join-Path $env:LOCALAPPDATA "Android\Sdk" }
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Android SDK: $sdk"

      - name: Install exact upstream Android toolchain
        shell: pwsh
        run: |
          $sdkmanager = Get-ChildItem "$env:ANDROID_SDK_ROOT\cmdline-tools" -Recurse -Filter sdkmanager.bat |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $sdkmanager) { throw "sdkmanager.bat not found" }
          Write-Host "sdkmanager: $sdkmanager"
          & $sdkmanager "platform-tools" "platforms;android-35" "build-tools;$env:BUILD_TOOLS" "ndk;$env:NDK_VERSION" "ndk;27.3.13750724"
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed: $LASTEXITCODE" }

      - name: Clone current AndroidGTAV upstream
        shell: pwsh
        run: |
          # GitCode contains Windows-incompatible paths/names in the full tree.
          # Fetch the commit without checking it out, enable sparse checkout,
          # then materialize only the Android build plus source trees it needs.
          $repo = "$env:GITHUB_WORKSPACE\\AndroidGTAV"
          New-Item -ItemType Directory -Force -Path $repo | Out-Null
          Set-Location $repo

          git init
          if ($LASTEXITCODE -ne 0) { throw "git init failed" }
          git remote add origin https://gitcode.com/linyushu520/AndroidGTAV.git
          git config core.longpaths true
          git config core.protectNTFS false
          git config core.sparseCheckout true

          # GitCode occasionally drops long HTTP transfers. Retry the shallow
          # fetch instead of failing the whole build on a transient RPC/EOF.
          $fetched = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            Write-Host "GitCode fetch attempt $attempt/4"
            git -c http.version=HTTP/1.1 -c http.lowSpeedLimit=0 -c http.lowSpeedTime=999999 fetch --depth 1 origin HEAD
            if ($LASTEXITCODE -eq 0) { $fetched = $true; break }
            Start-Sleep -Seconds (5 * $attempt)
          }
          if (-not $fetched) { throw "GitCode fetch failed after 4 attempts" }

          @"
          gta5/src/dev_ng/android_build/
          gta5/src/dev_ng/rage/
          gta5/src/dev_ng/game/
          gta5/src/dev_ng/rage/3rdparty/
          gta5/src/dev_ng/rage/scaleform/
          "@ | Set-Content -Encoding ascii .git/info/sparse-checkout

          git checkout --force FETCH_HEAD
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Sparse checkout failed. Status:"
            git status --short
            throw "GitCode sparse checkout failed"
          }

          git rev-parse HEAD | Tee-Object "$env:GITHUB_WORKSPACE\\androidgtav-upstream-sha.txt"

      - name: Verify upstream Android build inputs
        shell: pwsh
        run: |
          $b = "$env:GITHUB_WORKSPACE\AndroidGTAV\gta5\src\dev_ng\android_build"
          if (-not (Test-Path "$b\scripts\build_sys.sh")) { throw "scripts/build_sys.sh missing" }
          if (-not (Test-Path "$b\package_apk.py")) { throw "package_apk.py missing" }

          $baseline = "$b\RB_zcode_audiosched_0919\integrated"
          $archive = Join-Path $baseline "libgtav_engine.a"
          $apks = @()
          if (Test-Path $baseline) {
            $apks = @(Get-ChildItem $baseline -Filter *.apk | Where-Object Name -ne "unsigned.apk")
          }
          $ready = (Test-Path $archive) -and ($apks.Count -eq 1)
          "ANDROIDGTAV_BASELINE_READY=$($ready.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append

          if ($ready) {
            Write-Host "Hot-package baseline found."
          } else {
            Write-Warning "The documented cumulative binary baseline is not tracked in this checkout."
            Write-Host "Native source compilation will continue. Existing archives/APKs:"
            Get-ChildItem $b -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -eq "libgtav_engine.a" -or $_.Extension -eq ".apk" } |
              Select-Object -First 100 -ExpandProperty FullName
          }

      - name: Map X drive required by upstream
        shell: cmd
        run: |
          subst X: "%GITHUB_WORKSPACE%\AndroidGTAV"
          if errorlevel 1 exit /b 1
          dir X:\gta5\src\dev_ng\android_build

      - name: Build latest native Vulkan translation units
        shell: bash
        run: |
          set -euxo pipefail
          cd /x/gta5/src/dev_ng/android_build

          mkdir -p ci_native
          : > ci_native/sources.txt

          # Refresh the core native Vulkan renderer from current upstream source.
          for list in             lists/list_device_vk.txt             lists/list_effectvk.txt             lists/list_pipeline_vk.txt             lists/list_pipe_vk.txt; do
            if [ -f "$list" ]; then
              cat "$list" >> ci_native/sources.txt
            fi
          done

          # Remove comments/blanks and duplicates without truncating producer pipes.
          python - <<'PY'
          from pathlib import Path
          p=Path("ci_native/sources.txt")
          seen=set(); out=[]
          for raw in p.read_text(errors="replace").splitlines():
              s=raw.strip()
              if not s or s.startswith("#") or s in seen:
                  continue
              seen.add(s); out.append(s)
          p.write_text("\n".join(out)+"\n")
          print("translation units:", len(out))
          print("\n".join(out))
          PY

          if [ ! -s ci_native/sources.txt ]; then
            echo "::error::No Vulkan source list entries found"
            exit 1
          fi

          # Upstream build_sys.sh expects Scaleform at rage/3rdparty/Scaleform/Src,
          # while this Git snapshot stores it under rage/scaleform. Bridge the
          # historical path if the full 3rdparty copy is absent.
          if [ ! -d ../rage/3rdparty/Scaleform/Src ] && [ -d ../rage/scaleform/Src ]; then
            mkdir -p ../rage/3rdparty/Scaleform
            cp -a ../rage/scaleform/Src ../rage/3rdparty/Scaleform/
          fi

          echo "Scaleform expected path:"
          ls -la ../rage/3rdparty/Scaleform/Src || true

          # build_sys.sh hardcodes C:\\Android\\android-sdk\\ndk\\27.3.13750724
          # as if it were the LLVM bin directory itself. A previous compatibility
          # shim copied only bin/, which loses the NDK sysroot and causes even
          # <stddef.h> to disappear. Install NDK 27.3 and expose the COMPLETE
          # LLVM prebuilt tree at the exact path expected by upstream.
          # build_sys.sh expects clang++.exe directly at
          # C:\\Android\\android-sdk\\ndk\\27.3.13750724\\clang++.exe.
          # Keep the real NDK tree untouched and expose wrapper launchers there.
          SDK_MSYS="$(cygpath -u "$ANDROID_SDK_ROOT")"
          NDK27_ROOT="$SDK_MSYS/ndk/27.3.13750724"
          REAL_CLANG="$(find "$NDK27_ROOT" -type f -name 'clang++.exe' -print -quit 2>/dev/null || true)"
          if [ -z "$REAL_CLANG" ]; then
            echo "::error::clang++.exe not found under $NDK27_ROOT"
            find "$SDK_MSYS/ndk" -maxdepth 8 -type f -name 'clang++.exe' -print 2>/dev/null | head -n 30 || true
            exit 1
          fi

          REAL_CLANG_WIN="$(cygpath -w "$REAL_CLANG")"
          WRAP_DIR='/c/Android/android-sdk/ndk/27.3.13750724'
          mkdir -p "$WRAP_DIR"

          # build_sys.sh launches clang++.exe by this exact name. A .cmd wrapper
          # would not match, so copy the executable only and inject the REAL
          # sysroot/resource-dir through environment flags.
          cp -f "$REAL_CLANG" "$WRAP_DIR/clang++.exe"

          REAL_PREBUILT="$(dirname "$(dirname "$REAL_CLANG")")"
          REAL_SYSROOT="$REAL_PREBUILT/sysroot"
          # Do not trust --print-resource-dir after copying clang++.exe:
          # clang computes that path relative to its new location and can fall
          # back to a different SDK under "Program Files (x86)". Derive the
          # resource directory from the REAL NDK prebuilt tree instead.
          RESOURCE_DIR="$(find "$REAL_PREBUILT/lib/clang" -mindepth 1 -maxdepth 1 -type d -print -quit 2>/dev/null || true)"
          if [ ! -d "$REAL_SYSROOT" ]; then
            echo "::error::Real NDK sysroot missing: $REAL_SYSROOT"
            exit 1
          fi
          if [ -z "$RESOURCE_DIR" ] || [ ! -d "$RESOURCE_DIR" ]; then
            echo "::error::Clang resource dir missing under $REAL_PREBUILT/lib/clang"
            exit 1
          fi

          SYSROOT_CFG="$(cygpath -m "$REAL_SYSROOT")"
          RESOURCE_CFG="$(cygpath -m "$RESOURCE_DIR")"
          export CLANG_CONFIG_FILE_SYSTEM_DIR=
          printf '%s\n' \
            '--target=aarch64-linux-android26' \
            "--sysroot=$SYSROOT_CFG" \
            "-resource-dir=$RESOURCE_CFG" \
            > "$WRAP_DIR/clang++.cfg"
          unset CCC_OVERRIDE_OPTIONS

          echo "Real clang: $REAL_CLANG_WIN"
          echo "Real sysroot: $SYSROOT_CFG"
          echo "Resource dir: $RESOURCE_CFG"
          echo "clang++.cfg:"
          cat "$WRAP_DIR/clang++.cfg"
          ls -l "$WRAP_DIR/clang++.exe"

          # build_sys.sh intentionally summarizes failures into files. Always
          # print those files into the Actions log before deciding success/failure.
          set +e
          CONFIG=release bash scripts/build_sys.sh ci_native/sources.txt ci_native/compiled
          BUILD_RC=$?
          set -e

          echo "===== AndroidGTAV failures.txt ====="
          if [ -f ci_native/compiled/failures.txt ]; then
            cat ci_native/compiled/failures.txt
          else
            echo "(missing)"
          fi

          echo "===== AndroidGTAV build.log (last 400 lines) ====="
          if [ -f ci_native/compiled/build.log ]; then
            tail -n 400 ci_native/compiled/build.log
          else
            echo "(missing)"
          fi

          find ci_native/compiled -type f -name '*.o' -print > ci_native/objects.txt
          echo "===== compiled objects ====="
          cat ci_native/objects.txt || true

          if [ "$BUILD_RC" -ne 0 ] || [ ! -s ci_native/objects.txt ]; then
            echo "::error::Native AndroidGTAV compilation failed; compiler diagnostics are printed above."
            exit 1
          fi

      - name: Reuse completed full-engine survey
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dest = "$env:GITHUB_WORKSPACE\full-engine-baseline"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          gh run download 36105093384 --repo "${{ github.repository }}" --name "AndroidGTAV-full-engine-survey" --dir $dest
          if ($LASTEXITCODE -ne 0) { throw "Could not download completed full-engine survey artifact" }
          $count = @(Get-ChildItem $dest -Recurse -Filter *.o).Count
          Write-Host "Reused ARM64 objects: $count"
          if ($count -lt 1000) { throw "Unexpectedly small object baseline: $count" }

      - name: Retry real non-WolfSSL engine failures only
        shell: bash
        working-directory: AndroidGTAV/gta5/src/dev_ng/android_build
        run: |
          set -euxo pipefail
          BASE="$(cygpath -u "$GITHUB_WORKSPACE")/full-engine-baseline"
          OUT="$(cygpath -u "$GITHUB_WORKSPACE")/targeted-retry"
          mkdir -p "$OUT/compiled"
          FAILS="$BASE/compiled/failures.txt"
          test -s "$FAILS"
          # Keep only failures that correspond to real source files in this checkout.
          # This excludes the broken WolfSSL manifest paths and other nonexistent inputs.
          python - "$FAILS" "$OUT/real-sources.txt" <<'PY'
          import pathlib, sys
          fails=pathlib.Path(sys.argv[1]).read_text(errors="ignore").splitlines()
          root=pathlib.Path.cwd()
          seen=set(); out=[]
          for raw in fails:
              s=raw.strip()
              if not s or "wolfssl" in s.lower(): continue
              p=(root/s).resolve()
              if p.is_file() and p.suffix.lower() in {".c",".cc",".cpp",".cxx"}:
                  q=str(p)
                  if q not in seen: seen.add(q); out.append(q)
          pathlib.Path(sys.argv[2]).write_text("\n".join(out)+("\n" if out else ""))
          print("real engine retry sources:", len(out))
          PY
          if [ ! -s "$OUT/real-sources.txt" ]; then
            echo "No real non-WolfSSL source failures require retry."
            : > "$OUT/failures.txt"
            exit 0
          fi
          # Reuse upstream compiler driver, but only for this small filtered list.
          CONFIG=release scripts/build_sys.sh "$OUT/real-sources.txt" "$OUT/compiled" || true
          find "$OUT/compiled" -type f -name '*.o' -print | sort > "$OUT/recovered-objects.txt"
          cp "$OUT/compiled/failures.txt" "$OUT/failures.txt" 2>/dev/null || : > "$OUT/failures.txt"
          echo "Recovered objects: $(wc -l < "$OUT/recovered-objects.txt")"
          echo "Remaining targeted failures: $(wc -l < "$OUT/failures.txt")"

      - name: Build reusable partial ARM64 engine archive
        shell: bash
        run: |
          set -euxo pipefail
          BASE="$(cygpath -u "$GITHUB_WORKSPACE")/full-engine-baseline"
          OUT="$(cygpath -u "$GITHUB_WORKSPACE")/incremental-engine"
          mkdir -p "$OUT"
          find "$BASE" -type f -name '*.o' -print | sort > "$OUT/objects.txt"
          # Add objects recovered by the targeted retry without rebuilding the 3838-object baseline.\n          if [ -d "$(cygpath -u "$GITHUB_WORKSPACE")/targeted-retry/compiled" ]; then\n            find "$(cygpath -u "$GITHUB_WORKSPACE")/targeted-retry/compiled" -type f -name '*.o' -print >> "$OUT/objects.txt"\n            sort -u -o "$OUT/objects.txt" "$OUT/objects.txt"\n          fi\n          AR="$(find "$(cygpath -u "$ANDROID_SDK_ROOT")/ndk/27.3.13750724/toolchains/llvm/prebuilt/windows-x86_64/bin" -iname 'llvm-ar.exe' -print -quit)"
          test -f "$AR"
          # Windows has a much smaller command-line limit than Linux. Feed
          # object files to llvm-ar in small batches instead of one huge argv.
          rm -f "$OUT/libgtav_engine_partial.a"
          TOTAL=0
          BATCH=0
          while IFS= read -r obj; do
            OBJS+=("$obj")
            TOTAL=$((TOTAL+1))
            if [ "${#OBJS[@]}" -ge 100 ]; then
              "$AR" rcs "$OUT/libgtav_engine_partial.a" "${OBJS[@]}"
              OBJS=()
              BATCH=$((BATCH+1))
            fi
          done < "$OUT/objects.txt"
          if [ "${#OBJS[@]}" -gt 0 ]; then
            "$AR" rcs "$OUT/libgtav_engine_partial.a" "${OBJS[@]}"
            BATCH=$((BATCH+1))
          fi
          "$AR" t "$OUT/libgtav_engine_partial.a" > "$OUT/archive_members.txt"
          echo "OBJECTS=$TOTAL" | tee "$OUT/summary.txt"
          echo "AR_BATCHES=$BATCH" | tee -a "$OUT/summary.txt"
          echo "ARCHIVE_MEMBERS=$(wc -l < "$OUT/archive_members.txt")" | tee -a "$OUT/summary.txt"

      - name: Upload reusable partial engine archive
        uses: actions/upload-artifact@v4
        with:
          name: AndroidGTAV-libgtav-engine-partial
          path: |
            incremental-engine/libgtav_engine_partial.a
            incremental-engine/summary.txt
            incremental-engine/archive_members.txt
          if-no-files-found: error
          retention-days: 7
      - name: Probe libgtav.so link with reconstructed engine archive
        shell: bash
        working-directory: AndroidGTAV/gta5/src/dev_ng/android_build
        run: |
          set -euxo pipefail
          OUT="$GITHUB_WORKSPACE/incremental-engine"
          ARCHIVE="$OUT/libgtav_engine_partial.a"
          test -f "$ARCHIVE"

          # Put our reconstructed archive where the upstream Android.mk expects
          # the cumulative engine archive. No APK baseline is required for this
          # diagnostic link pass.
          BASE="RB_zcode_audiosched_0919/integrated"
          mkdir -p "$BASE"
          cp -f "$ARCHIVE" "$BASE/libgtav_engine.a"
          # app/jni/Android.mk links jni/../../libgtav_engine.a, which resolves
          # to android_build/app/libgtav_engine.a (not the packaging baseline).
          # Feed the reconstructed engine archive at the exact path expected by
          # the real upstream linker.
          cp -f "$ARCHIVE" app/libgtav_engine.a
          # LOCAL_LDLIBS is evaluated from the NDK project root here, so the
          # literal jni/../../libgtav_engine.a resolves two levels above
          # android_build, not relative to app/jni/Android.mk.
          mkdir -p ../../
          cp -f "$ARCHIVE" ../../libgtav_engine.a
          test -s app/libgtav_engine.a
          test -s ../../libgtav_engine.a
          echo "Engine archive staged: $(wc -c < app/libgtav_engine.a) bytes (app + NDK root-relative target)"

          # package_apk.py/Android.mk expect the historical X: mapping and NDK29.
          # NDK r29 requires an explicit output directory when NDK_PROJECT_PATH=null.
          # Use the actual Android build directory as the NDK project root.
          # r29 otherwise enters its NDK_PROJECT_PATH=null validation path before
          # consuming APP_BUILD_SCRIPT on Windows.
          export NDK_PROJECT_PATH="X:/gta5/src/dev_ng/android_build"
          # ndk-build receives these as make variables; environment-only values
          # are not consistently honored by r29 on Windows.
          # ndk-build itself is a Windows cmd/make chain. Use native Windows paths
          # here; X:/ POSIX-style paths were rejected as an unknown build script.
          APP_BUILD_SCRIPT_WIN="X:\\gta5\\src\\dev_ng\\android_build\\Android.mk"
          NDK_APPLICATION_MK_WIN=""
          if [ -f Application.mk ]; then NDK_APPLICATION_MK_WIN="X:\\gta5\\src\\dev_ng\\android_build\\Application.mk"; fi
          # Upstream keeps the NDK makefile under jni/ on this snapshot.
          if [ -f Android.mk ]; then
            MAKEFILE_REL="Android.mk"
          elif [ -f jni/Android.mk ]; then
            MAKEFILE_REL="jni/Android.mk"
          else
            MAKEFILE_REL="$(find . -maxdepth 3 -type f -name Android.mk -print -quit)"
          fi
          if [ -z "$MAKEFILE_REL" ]; then
            echo "::error::Android.mk not found under $(pwd)"
            find . -maxdepth 3 -type f | sort | sed -n '1,200p'
            exit 1
          fi
          APP_BUILD_SCRIPT_WIN="X:\\gta5\\src\\dev_ng\\android_build\\${MAKEFILE_REL//\//\\}"
          echo "Android.mk present: $MAKEFILE_REL -> $APP_BUILD_SCRIPT_WIN"
          # Android.mk hardcodes a cwd-relative archive in LOCAL_LDLIBS. Replace
          # only that path in the ephemeral checkout with an absolute X: path,
          # avoiding ambiguity about ndk-build/clang's working directory.
          # Patch the real gtav module structurally: remove the raw archive
          # linker fragment, attach a whole-static module before BUILD_SHARED_LIBRARY,
          # then define the prebuilt archive as a separate module.
          python - "$MAKEFILE_REL" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()

          # Remove only the archive fragment while preserving the surrounding
          # LOCAL_LDFLAGS continuation and any other flags.
          s, n = re.subn(
              r'-Wl,--whole-archive\s+jni/\.\./\.\./libgtav_engine\.a\s+-Wl,--no-whole-archive',
              '',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit("raw engine archive fragment not found")

          marker = 'include $(BUILD_SHARED_LIBRARY)'
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit("gtav BUILD_SHARED_LIBRARY marker not found")

          # This assignment is inserted immediately before the first shared
          # library build, while LOCAL_MODULE is still gtav.
          attach = 'LOCAL_WHOLE_STATIC_LIBRARIES += gtav_engine_reconstructed\n'
          s = s[:pos] + attach + s[pos:]

          # Define the prebuilt only after gtav has been fully declared.
          pos = s.find(marker, pos + len(attach))
          end = pos + len(marker)
          prebuilt = (
              '\n\ninclude $(CLEAR_VARS)\n'
              'LOCAL_MODULE := gtav_engine_reconstructed\n'
              'LOCAL_SRC_FILES := X:/gta5/src/dev_ng/android_build/app/libgtav_engine.a\n'
              'include $(PREBUILT_STATIC_LIBRARY)\n'
          )
          s = s[:end] + prebuilt + s[end:]
          p.write_text(s)
          PY
          echo "=== Effective engine linker stanza ==="
          grep -n -E 'gtav_engine_reconstructed|libgtav_engine.a|WHOLE_STATIC' "$MAKEFILE_REL" || true
          # Keep make syntax untouched; pass diagnostic linker/runtime flags as
          # ndk-build variables instead of inserting lines into continued blocks.
          grep -n "libgtav_engine.a" "$MAKEFILE_REL" || true
          # The Android platform libraries are selected by API level. Vulkan is
          # available from API 24 and AAudio from API 26; the NDK defaulted this
          # diagnostic link to android-21, where neither stub is available.
          NDK_ARGS_EXTRA=("APP_PLATFORM=android-26")
          export NDK_OUT="$(cygpath -m "$GITHUB_WORKSPACE")/ndk-out"
          export NDK_LIBS_OUT="$(cygpath -m "$GITHUB_WORKSPACE")/ndk-libs"
          mkdir -p "$(cygpath -u "$GITHUB_WORKSPACE")/ndk-out" "$(cygpath -u "$GITHUB_WORKSPACE")/ndk-libs"
          NDKBUILD="$(cygpath -u "$ANDROID_SDK_ROOT")/ndk/29.0.14206865/ndk-build.cmd"
          test -f "$NDKBUILD"

          set +e
          NDK_ARGS=("NDK_PROJECT_PATH=X:\\gta5\\src\\dev_ng\\android_build" "APP_BUILD_SCRIPT=$APP_BUILD_SCRIPT_WIN" "NDK_OUT=$NDK_OUT" "NDK_LIBS_OUT=$NDK_LIBS_OUT" "CONFIG=release" "APP_ABI=arm64-v8a" "APP_STL=c++_shared" "V=1" "LOCAL_LDFLAGS+=-Wl,--error-limit=0" "${NDK_ARGS_EXTRA[@]}")
          if [ -n "$NDK_APPLICATION_MK_WIN" ]; then NDK_ARGS+=("NDK_APPLICATION_MK=$NDK_APPLICATION_MK_WIN"); fi
          cmd.exe //c "$(cygpath -w "$NDKBUILD")" -C X:\\gta5\\src\\dev_ng\\android_build "${NDK_ARGS[@]}" > "$OUT/link.log" 2>&1
          LINK_RC=$?
          set -e

          echo "LINK_RC=$LINK_RC" | tee "$OUT/link-summary.txt"
          tail -n 500 "$OUT/link.log" || true
          echo "=== Effective linker command ===" | tee "$OUT/link-command.txt"
          grep -Ei 'clang\+\+|ld\.lld|whole-archive|libgtav_engine\.a' "$OUT/link.log" | tail -n 40 | tee -a "$OUT/link-command.txt" || true
          find . -type f -name 'libgtav.so' -print | tee "$OUT/libgtav-so.txt" || true
          grep -oE 'undefined symbol: .*' "$OUT/link.log" | sed 's/^undefined symbol: //' | sort -u > "$OUT/undefined-symbols.txt" || true
          echo "Captured unresolved symbols: $(wc -l < "$OUT/undefined-symbols.txt")"

          # This is a diagnostic pass: preserve linker output even when symbols
          # are still missing so the next patch can target the exact failures.
          exit 0

      - name: Upload libgtav link diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: AndroidGTAV-libgtav-link-diagnostics
          path: |
            incremental-engine/link.log
            incremental-engine/link-summary.txt
            incremental-engine/link-command.txt
            incremental-engine/libgtav-so.txt
            incremental-engine/undefined-symbols.txt
            AndroidGTAV/gta5/src/dev_ng/android_build/libs/**/libgtav.so
            AndroidGTAV/gta5/src/dev_ng/android_build/obj/**/libgtav.so
          if-no-files-found: warn
          retention-days: 7
      - name: Restore full ARM64 object cache
        id: full-cache
        uses: actions/cache@v4
        with:
          path: AndroidGTAV/gta5/src/dev_ng/android_build/ci_full
          key: androidgtav-arm64-full-${{ runner.os }}-${{ hashFiles('AndroidGTAV/gta5/src/dev_ng/android_build/lists/*.txt', 'AndroidGTAV/gta5/src/dev_ng/android_build/scripts/build_sys.sh') }}

      - name: Compile all upstream Android source manifests
        if: ${{ false }} # Full survey already completed; use existing compiled-object artifact for follow-up work.
        shell: bash
        working-directory: AndroidGTAV/gta5/src/dev_ng/android_build
        run: |
          set -euxo pipefail
          mkdir -p ci_full/compiled
          python - <<'PY'
          from pathlib import Path
          root = Path("lists")
          out = Path("ci_full/sources.txt")
          seen = set()
          rows = []
          for p in sorted(root.glob("*.txt")):
              for raw in p.read_text(encoding="utf-8", errors="ignore").splitlines():
                  s = raw.strip()
                  if not s or s.startswith("#"):
                      continue
                  if s not in seen:
                      seen.add(s)
                      rows.append(s)
          out.write_text("\n".join(rows) + "\n", encoding="utf-8")
          print(f"manifests={len(list(root.glob('*.txt')))} unique_sources={len(rows)}")
          PY

          if [ -s ci_full/physical_objects.txt ] && [ -d ci_full/compiled ]; then
            echo "Full ARM64 object cache restored; skipping 5,091-source rebuild."
            FULL_RC=0
          else
            set +e
            CONFIG=release bash scripts/build_sys.sh ci_full/sources.txt ci_full/compiled
            FULL_RC=$?
            set -e
          fi

          echo "===== FULL BUILD FAILURES ====="
          cat ci_full/compiled/failures.txt 2>/dev/null || true
          echo "===== FULL BUILD LOG TAIL ====="
          tail -n 500 ci_full/compiled/build.log 2>/dev/null || true

          find ci_full/compiled -type f -name '*.o' -print | sort > ci_full/objects.txt
          echo "Compiled object count: $(wc -l < ci_full/objects.txt)"
          echo "Source count: $(wc -l < ci_full/sources.txt)"
          echo "FULL_RC=$FULL_RC" > ci_full/summary.txt
          echo "OBJECTS=$(wc -l < ci_full/objects.txt)" >> ci_full/summary.txt
          echo "SOURCES=$(wc -l < ci_full/sources.txt)" >> ci_full/summary.txt

          # Preserve partial success: this stage is exploratory until every
          # upstream manifest is known to be Android-buildable.
          exit 0

      - name: Classify full-engine failures and build archive
        if: ${{ false }} # Disabled to avoid rebuilding 5,091 sources on every iteration.
        shell: bash
        working-directory: AndroidGTAV/gta5/src/dev_ng/android_build
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          base = Path("ci_full")
          fails = [x.strip() for x in (base/"compiled/failures.txt").read_text(errors="ignore").splitlines() if x.strip()]
          wolf = [x for x in fails if "wolfssl/" in x.lower()]
          engine = [x for x in fails if x not in wolf]
          (base/"wolfssl_failures.txt").write_text("\n".join(wolf)+("\n" if wolf else ""))
          (base/"engine_failures.txt").write_text("\n".join(engine)+("\n" if engine else ""))
          objs = sorted((base/"compiled").glob("*.o"))
          (base/"physical_objects.txt").write_text("\n".join(str(x) for x in objs)+("\n" if objs else ""))
          with (base/"archive_summary.txt").open("w") as h:
              h.write(f"TOTAL_FAILURES={len(fails)}\nWOLFSSL_FAILURES={len(wolf)}\nENGINE_FAILURES={len(engine)}\nPHYSICAL_OBJECTS={len(objs)}\n")
          print((base/"archive_summary.txt").read_text())
          PY

          AR="$(find /c/Android/android-sdk/ndk/27.3.13750724/toolchains/llvm/prebuilt/windows-x86_64/bin -iname 'llvm-ar.exe' -print -quit)"
          test -f "$AR"
          mapfile -t OBJS < ci_full/physical_objects.txt
          if [ "${#OBJS[@]}" -gt 0 ]; then
            rm -f ci_full/libgtav_engine_partial.a
            "$AR" rcs ci_full/libgtav_engine_partial.a "${OBJS[@]}"
            "$AR" t ci_full/libgtav_engine_partial.a > ci_full/archive_members.txt
            echo "ARCHIVE_MEMBERS=$(wc -l < ci_full/archive_members.txt)" >> ci_full/archive_summary.txt
          fi
          cat ci_full/archive_summary.txt

      - name: Upload full-engine compile survey
        if: ${{ false }} # Existing survey artifact is the baseline for incremental work.
        uses: actions/upload-artifact@v4
        with:
          name: AndroidGTAV-full-engine-survey
          path: |
            AndroidGTAV/gta5/src/dev_ng/android_build/ci_full/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload compiled native objects
        uses: actions/upload-artifact@v4
        with:
          name: AndroidGTAV-native-objects
          path: |
            AndroidGTAV/gta5/src/dev_ng/android_build/ci_native/**
            androidgtav-upstream-sha.txt
            apk-shell-inventory.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Package from historical baseline
        if: env.ANDROIDGTAV_BASELINE_READY == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          BUILD=/x/gta5/src/dev_ng/android_build
          SO="$(cygpath -u "$GITHUB_WORKSPACE")/ndk-libs/arm64-v8a/libgtav.so"
          CXX="$(cygpath -u "$GITHUB_WORKSPACE")/ndk-libs/arm64-v8a/libc++_shared.so"
          test -s "$SO"
          test -s "$CXX"

          cd "$BUILD"
          mapfile -t OBJS < ci_native/objects.txt
          python package_apk.py "${OBJS[@]}"
          test -s dist/gtav.apk
          cp dist/gtav.apk "$GITHUB_WORKSPACE/AndroidGTAV-native-vulkan.apk"
          cp dist/verification.json "$GITHUB_WORKSPACE/verification.json" || true
          cp dist/verification.txt "$GITHUB_WORKSPACE/verification.txt" || true
          cp dist/build.log "$GITHUB_WORKSPACE/build.log" || true
            echo "Found manifest: $MANIFEST"
            echo "Found dex: $DEX"
            echo "::error::Manifest exists but no supported upstream APK shell builder has been wired yet; inventory artifact contains exact inputs."
            exit 1
          fi

      - name: Build minimal NativeActivity APK shell
        if: env.ANDROIDGTAV_BASELINE_READY != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          BUILD=/x/gta5/src/dev_ng/android_build
          SO="$(cygpath -u "$GITHUB_WORKSPACE")/ndk-libs/arm64-v8a/libgtav.so"
          CXX="$(cygpath -u "$GITHUB_WORKSPACE")/ndk-libs/arm64-v8a/libc++_shared.so"
          MANIFEST="$BUILD/app/AndroidManifest.xml"
          test -s "$SO"
          test -s "$CXX"
          test -s "$MANIFEST"

          echo "=== Native runtime sizes before APK packaging ==="
          ls -lh "$SO" "$CXX"
          wc -c "$SO" "$CXX"
          sha256sum "$SO" "$CXX"
          FILE_TOOL="$(find "$(cygpath -u "$ANDROID_NDK_ROOT")/toolchains/llvm/prebuilt" -type f -iname 'llvm-readelf.exe' -print -quit || true)"
          if [ -n "$FILE_TOOL" ]; then
            "$FILE_TOOL" -h "$SO" | grep -E 'Class:|Machine:|Type:' || true
          fi

          SHELL="$GITHUB_WORKSPACE/apk-shell"
          rm -rf "$SHELL"
          mkdir -p "$SHELL/lib/arm64-v8a"
          cp "$SO" "$SHELL/lib/arm64-v8a/libgtav.so"
          cp "$CXX" "$SHELL/lib/arm64-v8a/libc++_shared.so"

          # NativeActivity apps do not require classes.dex. Compile the real
          # upstream manifest/resources directly with aapt2, then add libs.
          AAPT2="$(find "$(cygpath -u "$ANDROID_SDK_ROOT")/build-tools" -type f -iname 'aapt2.exe' -print | sort -V | tail -1)"
          ZIPALIGN="$(find "$(cygpath -u "$ANDROID_SDK_ROOT")/build-tools" -type f -iname 'zipalign.exe' -print | sort -V | tail -1)"
          APKSIGNER="$(find "$(cygpath -u "$ANDROID_SDK_ROOT")/build-tools" -type f -iname 'apksigner.bat' -print | sort -V | tail -1)"
          ANDROID_JAR="$(find "$(cygpath -u "$ANDROID_SDK_ROOT")/platforms" -type f -name android.jar -print | sort -V | tail -1)"
          test -s "$AAPT2"; test -s "$ZIPALIGN"; test -s "$ANDROID_JAR"

          RES="$BUILD/app/res"
          COMPILED="$SHELL/compiled.zip"
          if [ -d "$RES" ]; then
            "$AAPT2" compile --dir "$RES" -o "$COMPILED"
            "$AAPT2" link -o "$SHELL/base.apk" -I "$ANDROID_JAR" --manifest "$MANIFEST" "$COMPILED"
          else
            "$AAPT2" link -o "$SHELL/base.apk" -I "$ANDROID_JAR" --manifest "$MANIFEST"
          fi

          cp "$SHELL/base.apk" "$SHELL/unsigned.apk"
          cd "$SHELL"
          # NativeActivity loads these directly from the APK when extractNativeLibs=false.
          # Keep ELF files uncompressed so the platform can mmap them; zipalign below
          # provides the required APK alignment.
          7z a -tzip -mx=0 unsigned.apk lib/arm64-v8a/libgtav.so lib/arm64-v8a/libc++_shared.so >/dev/null
          "$ZIPALIGN" -f -P 16 4 unsigned.apk aligned.apk
          "$ZIPALIGN" -c -P 16 -v 4 aligned.apk

          # Create an ephemeral CI signing key; it is only for install testing.
          KEYSTORE="$SHELL/debug.jks"
          keytool -genkeypair -noprompt -keystore "$KEYSTORE" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          cmd.exe //c "$(cygpath -w "$APKSIGNER")" sign --ks "$(cygpath -w "$KEYSTORE")" --ks-pass pass:android --key-pass pass:android --out "$(cygpath -w "$GITHUB_WORKSPACE/AndroidGTAV-native-vulkan.apk")" "$(cygpath -w "$SHELL/aligned.apk")"
          test -s "$GITHUB_WORKSPACE/AndroidGTAV-native-vulkan.apk"

      - name: Verify APK structure
        shell: pwsh
        run: |
          $apk = "$env:GITHUB_WORKSPACE\AndroidGTAV-native-vulkan.apk"
          if (-not (Test-Path $apk)) { throw "APK output missing" }
          $apksigner = "$env:ANDROID_SDK_ROOT\build-tools\$env:BUILD_TOOLS\apksigner.bat"
          & $apksigner verify --verbose $apk
          if ($LASTEXITCODE -ne 0) { throw "APK signature verification failed" }
          $zipalign = "$env:ANDROID_SDK_ROOT\\build-tools\\$env:BUILD_TOOLS\\zipalign.exe"
          & $zipalign -c -P 16 -v 4 $apk
          if ($LASTEXITCODE -ne 0) { throw "APK zip/native-library alignment verification failed" }
          Get-FileHash $apk -Algorithm SHA256
          Get-Item $apk | Format-List FullName,Length,LastWriteTime
          Write-Host "=== APK native entries ==="
          & 7z l -slt $apk | Select-String -Pattern 'Path = lib/arm64-v8a/|Size = |Packed Size = '
          $tmp = Join-Path $env:RUNNER_TEMP "apk-native-audit"
          Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $tmp | Out-Null
          & 7z x -y "-o$tmp" $apk "lib/arm64-v8a/libgtav.so" "lib/arm64-v8a/libc++_shared.so" | Out-Null
          Get-ChildItem "$tmp\lib\arm64-v8a" | Select-Object Name,Length
          Get-FileHash "$tmp\lib\arm64-v8a\libgtav.so" -Algorithm SHA256

      - name: Upload APK
        if: always() && hashFiles('AndroidGTAV-native-vulkan.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: AndroidGTAV-native-vulkan-apk
          path: |
            AndroidGTAV-native-vulkan.apk
            verification.json
            verification.txt
            build.log
            androidgtav-upstream-sha.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload compiler diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidGTAV-build-failure
          path: |
            AndroidGTAV/gta5/src/dev_ng/android_build/ci_native/**
            AndroidGTAV/gta5/src/dev_ng/android_build/dist/build.log
            androidgtav-upstream-sha.txt
          if-no-files-found: warn
          retention-days: 7
