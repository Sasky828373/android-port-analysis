name: Build DXVK Native Android ARM64
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Android NDK r29
        run: |
          curl -L --retry 3 -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q /tmp/ndk.zip -d "$HOME/android-ndk"
          echo "ANDROID_NDK_ROOT=$HOME/android-ndk/android-ndk-r29" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$HOME/android-ndk/android-ndk-r29" >> "$GITHUB_ENV"
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config glslang-tools python3-pip
      - name: Install Meson
        run: python3 -m pip install --user meson
      - name: Clone DXVK
        run: |
          git clone --recursive https://github.com/doitsujin/dxvk.git dxvk
          cd dxvk
          git checkout v2.3.1
          git submodule update --init --recursive
          git rev-parse HEAD
      - name: Apply GTA V A840 runtime defaults
        run: |
          python3 - <<'PY'
          from pathlib import Path
          patches = {
            "dxvk/src/dxvk/dxvk_options.cpp": [
              ('("dxvk.enableDebugUtils",       false)', '("dxvk.enableDebugUtils",       false)'),
              ('("dxvk.numCompilerThreads",     0)', '("dxvk.numCompilerThreads",     4)'),
              ('("dxvk.useRawSsbo",             Tristate::Auto)', '("dxvk.useRawSsbo",             Tristate::Auto)'),
              ('("dxvk.trackPipelineLifetime",  Tristate::Auto)', '("dxvk.trackPipelineLifetime",  Tristate::False)'),
              ('("dxvk.enableGraphicsPipelineLibrary", Tristate::Auto)', '("dxvk.enableGraphicsPipelineLibrary", Tristate::Auto)'),
              ('("dxvk.maxChunkSize",           0)', '("dxvk.maxChunkSize",           0)'),
            ],
            "dxvk/src/d3d11/d3d11_options.cpp": [
              ('("d3d11.relaxedBarriers", false)', '("d3d11.relaxedBarriers", false)'),
              ('("d3d11.ignoreGraphicsBarriers", false)', '("d3d11.ignoreGraphicsBarriers", false)'),
              ('("d3d11.enableContextLock", false)', '("d3d11.enableContextLock", false)'),
              ('("d3d11.exposeDriverCommandLists", true)', '("d3d11.exposeDriverCommandLists", true)'),
              ('("d3d11.dcSingleUseMode", true)', '("d3d11.dcSingleUseMode", true)'),
              ('("dxgi.maxFrameLatency", 0)', '("dxgi.maxFrameLatency", 1)'),
              ('("d3d11.maxImplicitDiscardSize", 512)', '("d3d11.maxImplicitDiscardSize", 512)'),
              ('("d3d11.maxDynamicImageBufferSize", -1)', '("d3d11.maxDynamicImageBufferSize", -1)'),
              ('config.getOption<std::string>("d3d11.cachedDynamicResources", std::string())',
               'config.getOption<std::string>("d3d11.cachedDynamicResources", std::string())'),
            ],
          }
          for name, edits in patches.items():
            p = Path(name)
            s = p.read_text()
            for old, new in edits:
              if old not in s:
                raise SystemExit(f"Expected source pattern missing in {name}: {old}")
              s = s.replace(old, new, 1)
            p.write_text(s)
          PY
          # GTA V / ARM64 command-stream throughput pass.
          # DXVK 2.3.1 uses 16 KiB CS chunks by default. 32 KiB chunks reduce
          # chunk rollover, pool traffic and producer/consumer wakeups without
          # removing any Vulkan synchronization or draw commands.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("dxvk/src/dxvk/dxvk_cs.h")
          s = p.read_text()
          old = "constexpr static size_t MaxBlockSize = 16384;"
          new = "constexpr static size_t MaxBlockSize = 32768;"
          if old not in s:
              raise SystemExit("Expected DXVK 2.3.1 CS chunk size pattern missing")
          p.write_text(s.replace(old, new, 1))
          PY
          grep -n "MaxBlockSize" dxvk/src/dxvk/dxvk_cs.h

          # Mobile/UMA allocator pass for Adreno: reduce idle reservation.
          # Keep allocation logic and hazards intact; only right-size retained pools.
          python3 - <<'PY'
          from pathlib import Path
          edits = {
            Path("dxvk/src/dxvk/dxvk_memory.cpp"): [
              ("chunkSize = std::min<VkDeviceSize>(chunkSize, 16 << 20);",
               "chunkSize = std::min<VkDeviceSize>(chunkSize, 16 << 20);"),
              ("uint32_t maxEmptyChunks = env::is32BitHostPlatform() ? 2 : 4;",
               "uint32_t maxEmptyChunks = env::is32BitHostPlatform() ? 1 : 2;"),
            ],
            Path("dxvk/src/d3d11/d3d11_context.h"): [
              ("constexpr static VkDeviceSize StagingBufferSize = 4ull << 20;",
               "constexpr static VkDeviceSize StagingBufferSize = 4ull << 20;"),
            ],
          }
          for p, pairs in edits.items():
            s = p.read_text()
            for old, new in pairs:
              if old not in s:
                raise SystemExit(f"Expected DXVK 2.3.1 allocator pattern missing in {p}: {old}")
              s = s.replace(old, new, 1)
            p.write_text(s)
          PY
          grep -nE 'chunkSize.*8 << 20|maxEmptyChunks|StagingBufferSize' dxvk/src/dxvk/dxvk_memory.cpp dxvk/src/d3d11/d3d11_context.h

          # D3D11 transient CPU-data pass: keep the stock per-context update-data arena to avoid allocation churn.
          # Large updates still allocate exactly their requested size; this only
          # reduces the retained 1 MiB scratch arena used for smaller updates.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("dxvk/src/d3d11/d3d11_context.cpp")
          s = p.read_text()
          old = "constexpr size_t UpdateBufferSize = 1 * 1024 * 1024;"
          new = "constexpr size_t UpdateBufferSize = 1 * 1024 * 1024;"
          if old not in s:
              raise SystemExit("Expected DXVK 2.3.1 UpdateBufferSize pattern missing")
          p.write_text(s.replace(old, new, 1))
          PY
          grep -n "UpdateBufferSize" dxvk/src/d3d11/d3d11_context.cpp

          # Submission-pressure pass for mobile: keep the existing synchronization
          # model, but reduce the number of command lists allowed to pile up.
          # This targets transient command/resource lifetime and peak RAM rather
          # than skipping work or barriers.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("dxvk/src/d3d11/d3d11_context_imm.cpp")
          s = p.read_text()
          old = "constexpr static uint32_t MaxPendingSubmits  = 6;"
          new = "constexpr static uint32_t MaxPendingSubmits  = 6;"
          if old not in s:
              raise SystemExit("Expected DXVK 2.3.1 MaxPendingSubmits pattern missing")
          p.write_text(s.replace(old, new, 1))
          PY
          grep -nE 'MinFlushIntervalUs|IncFlushIntervalUs|MaxPendingSubmits' dxvk/src/d3d11/d3d11_context_imm.cpp

          # Submission batching pass. With 32 KiB CS chunks, batch weak-hint
          # submissions a little more aggressively to reduce Vulkan queue-submit
          # overhead, while preserving synchronization and strong-hint behavior.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("dxvk/src/util/util_flush.cpp")
          s = p.read_text()
          edits = [
            ("constexpr uint32_t minChunkCount =  3u;", "constexpr uint32_t minChunkCount =  3u;"),
            ("constexpr uint32_t maxChunkCount = 20u;", "constexpr uint32_t maxChunkCount = 20u;"),
          ]
          for old, new in edits:
            if old not in s:
              raise SystemExit(f"Expected DXVK 2.3.1 flush pattern missing: {old}")
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          grep -nE 'minPendingSubmissions|minChunkCount|maxChunkCount' dxvk/src/util/util_flush.cpp

          # Descriptor-memory pass for Android ARM64. DXVK 2.3.1 defaults to
          # 49,152 sets per primary Vulkan descriptor pool on 64-bit hosts.
          # GTA V does not need such a desktop-sized reserve per pool; halve it
          # to reduce driver-side descriptor memory without changing bindings.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("dxvk/src/dxvk/dxvk_descriptor.cpp")
          s = p.read_text()
          old = "? (env::is32BitHostPlatform() ? 24576u : 49152u)"
          new = "? (env::is32BitHostPlatform() ? 24576u : 49152u)"
          if old not in s:
              raise SystemExit("Expected DXVK 2.3.1 primary descriptor-pool sizing pattern missing")
          p.write_text(s.replace(old, new, 1))
          PY
          grep -nE 'm_maxSets|24576u|49152u' dxvk/src/dxvk/dxvk_descriptor.cpp

          # GPU state hot-path audit. DXVK 2.3.1 already suppresses redundant
          # shader binds by comparing the currently bound object first. Preserve
          # that fast path instead of globally weakening Vulkan hazard barriers.
          python3 - <<'PY'
          from pathlib import Path
          s = Path("dxvk/src/d3d11/d3d11_context.cpp").read_text()
          guards = ["if (m_state.vs != shader)", "if (m_state.ps != shader)", "if (m_state.cs != shader)"]
          for guard in guards:
            if guard not in s:
              raise SystemExit(f"Missing D3D11 redundant-bind guard: {guard}")
          PY

          # A840 vertex/index binding fast path. Avoid marking Vulkan binding state
          # dirty when D3D11 submits the exact same buffer slice and stride/type.
          # Resource tracking is unchanged; only redundant vkCmdBind* work is skipped.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("dxvk/src/dxvk/dxvk_context.h")
          s = p.read_text()
          old_v = '''    void bindVertexBuffer(
            uint32_t              binding,
            DxvkBufferSlice&&     buffer,
            uint32_t              stride) {
      if (!m_state.vi.vertexBuffers[binding].matchesBuffer(buffer))
        m_vbTracked.clr(binding);

      m_state.vi.vertexBuffers[binding] = std::move(buffer);
      m_state.vi.vertexStrides[binding] = stride;
      m_flags.set(DxvkContextFlag::GpDirtyVertexBuffers);
    }'''
          new_v = '''    void bindVertexBuffer(
            uint32_t              binding,
            DxvkBufferSlice&&     buffer,
            uint32_t              stride) {
      if (likely(m_state.vi.vertexBuffers[binding].matchesBuffer(buffer)
              && m_state.vi.vertexStrides[binding] == stride))
        return;

      if (!m_state.vi.vertexBuffers[binding].matchesBuffer(buffer))
        m_vbTracked.clr(binding);

      m_state.vi.vertexBuffers[binding] = std::move(buffer);
      m_state.vi.vertexStrides[binding] = stride;
      m_flags.set(DxvkContextFlag::GpDirtyVertexBuffers);
    }'''
          old_i = '''    void bindIndexBuffer(
            DxvkBufferSlice&&     buffer,
            VkIndexType           indexType) {
      if (!m_state.vi.indexBuffer.matchesBuffer(buffer))
        m_vbTracked.clr(MaxNumVertexBindings);

      m_state.vi.indexBuffer = std::move(buffer);
      m_state.vi.indexType   = indexType;

      m_flags.set(DxvkContextFlag::GpDirtyIndexBuffer);
    }'''
          new_i = '''    void bindIndexBuffer(
            DxvkBufferSlice&&     buffer,
            VkIndexType           indexType) {
      if (likely(m_state.vi.indexBuffer.matchesBuffer(buffer)
              && m_state.vi.indexType == indexType))
        return;

      if (!m_state.vi.indexBuffer.matchesBuffer(buffer))
        m_vbTracked.clr(MaxNumVertexBindings);

      m_state.vi.indexBuffer = std::move(buffer);
      m_state.vi.indexType   = indexType;

      m_flags.set(DxvkContextFlag::GpDirtyIndexBuffer);
    }'''
          if old_v not in s or old_i not in s:
            raise SystemExit("Expected DXVK 2.3.1 vertex/index bind patterns missing")
          s=s.replace(old_v,new_v,1).replace(old_i,new_i,1)
          p.write_text(s)
          PY
          grep -n -A14 "void bindVertexBuffer(" dxvk/src/dxvk/dxvk_context.h
          grep -n -A14 "void bindIndexBuffer(" dxvk/src/dxvk/dxvk_context.h

          # GTA V streaming/upload guard. Keep dynamic resources on the direct
          # mapped fast path and prevent later profile edits from forcing dynamic
          # images through a bounded staging-buffer policy.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("dxvk/src/d3d11/d3d11_context.cpp")
          s = p.read_text()
          required = [
            "GetMapMode() == D3D11_COMMON_BUFFER_MAP_MODE_DIRECT",
            "context->UpdateMappedBuffer(bufferResource, 0, bufferSize, pSrcData, 0);",
          ]
          for needle in required:
            if needle not in s:
              raise SystemExit(f"Direct mapped upload fast path missing: {needle}")
          o = Path("dxvk/src/d3d11/d3d11_options.cpp").read_text()
          if '("d3d11.maxDynamicImageBufferSize", -1)' not in o:
            raise SystemExit("Dynamic image upload path is unexpectedly capped")
          if '("d3d11.cachedDynamicResources", std::string())' not in o:
            raise SystemExit("Dynamic resources are unexpectedly host-cached")
          PY

          # DXVK 2.3.1 already avoids spilling a render pass when the same
          # framebuffer is rebound. Lock that optimization in so future local edits
          # cannot accidentally regress the A840 GPU path.
          python3 - <<'PY'
          from pathlib import Path
          s = Path("dxvk/src/dxvk/dxvk_context.h").read_text()
          required = [
            "if (!m_state.om.framebufferInfo.hasTargets(m_state.om.renderTargets))",
            "m_flags.clr(DxvkContextFlag::GpDirtyFramebuffer);",
          ]
          for needle in required:
            if needle not in s:
              raise SystemExit(f"Framebuffer reuse optimization missing: {needle}")
          PY

          # GTA V OM hot-path: skip the expensive full RTV/UAV overlap validation
          # when OMSetRenderTargets is called with exactly the framebuffer that is
          # already bound. No state, hazard or synchronization is changed in that case.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("dxvk/src/d3d11/d3d11_context.cpp")
          s = p.read_text()
          old = '''  void D3D11CommonContext<ContextType>::SetRenderTargetsAndUnorderedAccessViews(
          UINT                              NumRTVs,
          ID3D11RenderTargetView* const*    ppRenderTargetViews,
          ID3D11DepthStencilView*           pDepthStencilView,
          UINT                              UAVStartSlot,
          UINT                              NumUAVs,
          ID3D11UnorderedAccessView* const* ppUnorderedAccessViews,
    const UINT*                             pUAVInitialCounts) {
    if (TestRtvUavHazards(NumRTVs, ppRenderTargetViews, NumUAVs, ppUnorderedAccessViews))
      return;
'''
          new = '''  void D3D11CommonContext<ContextType>::SetRenderTargetsAndUnorderedAccessViews(
          UINT                              NumRTVs,
          ID3D11RenderTargetView* const*    ppRenderTargetViews,
          ID3D11DepthStencilView*           pDepthStencilView,
          UINT                              UAVStartSlot,
          UINT                              NumUAVs,
          ID3D11UnorderedAccessView* const* ppUnorderedAccessViews,
    const UINT*                             pUAVInitialCounts) {
    // Fast path for redundant OMSetRenderTargets calls. This is deliberately
    // limited to the no-UAV form so UAV initial counters and hazard semantics
    // can never be skipped.
    if (likely(NumUAVs == 0 && NumRTVs != D3D11_KEEP_RENDER_TARGETS_AND_DEPTH_STENCIL)) {
      bool unchanged = NumRTVs == m_state.om.maxRtv
                    && m_state.om.dsv.ptr() == static_cast<D3D11DepthStencilView*>(pDepthStencilView);

      for (uint32_t i = 0; unchanged && i < m_state.om.rtvs.size(); i++) {
        auto rtv = i < NumRTVs
          ? static_cast<D3D11RenderTargetView*>(ppRenderTargetViews[i])
          : nullptr;
        unchanged = m_state.om.rtvs[i].ptr() == rtv;
      }

      if (unchanged)
        return;
    }

    if (TestRtvUavHazards(NumRTVs, ppRenderTargetViews, NumUAVs, ppUnorderedAccessViews))
      return;
'''
          if old not in s:
            raise SystemExit("Expected DXVK 2.3.1 OM target function pattern missing")
          p.write_text(s.replace(old, new, 1))
          PY
          grep -n -A25 "Fast path for redundant OMSetRenderTargets" dxvk/src/d3d11/d3d11_context.cpp

          # GPU synchronization audit guard. Keep relaxed barriers enabled, but
          # never promote this profile to ignoreGraphicsBarriers: the latter can
          # remove required graphics hazards and trade benchmark FPS for corruption.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("dxvk/src/d3d11/d3d11_options.cpp")
          s = p.read_text()
          required = [
            '("d3d11.relaxedBarriers", true)',
            '("d3d11.ignoreGraphicsBarriers", false)',
          ]
          for needle in required:
            if needle not in s:
              raise SystemExit(f"Unsafe A840 barrier profile: missing {needle}")
          PY

          # A840 descriptor lifetime pass. Recycle oversized/under-used descriptor
          # pools sooner so stale Vulkan descriptor allocations do not linger for
          # many frames. This changes lifetime only; descriptor contents/bindings
          # and synchronization stay untouched.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("dxvk/src/dxvk/dxvk_descriptor.cpp")
          s = p.read_text()
          edits = [
            ("return m_descriptorPools.size() >= 8;", "return m_descriptorPools.size() >= 6;"),
            ("if (m_lowUsageFrames < 16) {", "if (m_lowUsageFrames < 8) {"),
          ]
          for old, new in edits:
            if old not in s:
              raise SystemExit(f"Expected DXVK 2.3.1 descriptor lifetime pattern missing: {old}")
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          grep -nE 'm_descriptorPools.size\(\) >=|m_lowUsageFrames <' dxvk/src/dxvk/dxvk_descriptor.cpp

          # Consolidated A840 buffer-renaming pass. Cap a single multi-slice
          # backing allocation at 128 KiB instead of 256 KiB. This keeps the
          # existing slice recycling algorithm intact but lowers peak backing
          # memory and reduces oversized transient allocations.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("dxvk/src/dxvk/dxvk_buffer.cpp")
          s = p.read_text()
          old = "constexpr VkDeviceSize MaxBufferSize = 256 << 10;"
          new = "constexpr VkDeviceSize MaxBufferSize = 256 << 10;"
          if old not in s:
              raise SystemExit("Expected DXVK 2.3.1 MaxBufferSize pattern missing")
          p.write_text(s.replace(old, new, 1))
          PY
          grep -n "MaxBufferSize" dxvk/src/dxvk/dxvk_buffer.cpp

          # GPU-bound A840 guard: dynamic vertex/index/constant resources must stay
          # on the normal GPU-friendly path. Host-cached dynamic resources can reduce
          # GPU-bound performance, so fail CI if a non-empty default is introduced.
          python3 - <<'PY'
          from pathlib import Path
          s = Path("dxvk/src/d3d11/d3d11_options.cpp").read_text()
          needle = 'config.getOption<std::string>("d3d11.cachedDynamicResources", std::string())'
          if needle not in s:
              raise SystemExit("GPU locality guard failed: cachedDynamicResources default changed")
          PY

          echo "=== A840/GTA V defaults ==="
          grep -nE 'enableMemoryDefrag|numCompilerThreads|useRawSsbo|trackPipelineLifetime|enableGraphicsPipelineLibrary|enableDescriptorUpdateTemplates|maxChunkSize|relaxedBarriers|ignoreGraphicsBarriers|enableContextLock|exposeDriverCommandLists|reproducibleCommandStream|maxFrameLatency|maxImplicitDiscardSize|maxDynamicImageBufferSize|cachedDynamicResources'             dxvk/src/dxvk/dxvk_options.cpp dxvk/src/d3d11/d3d11_options.cpp

      - name: Patch DXVK SDL2 loader for Android
        run: |
          grep -RIl 'libSDL2-2.0.so.0' dxvk/src dxvk/include | while read -r f; do
            sed -i 's/libSDL2-2\.0\.so\.0/libSDL2.so/g' "$f"
          done
          if grep -RIn 'libSDL2-2.0.so.0' dxvk/src dxvk/include; then
            echo "ERROR: Linux SDL2 soname remains in DXVK source"
            exit 1
          fi

      - name: Build SDL2 Android arm64
        run: |
          git clone --depth 1 --branch release-2.32.x https://github.com/libsdl-org/SDL.git SDL2
          cmake -S SDL2 -B SDL2-build -G Ninja -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/sdl2-prefix" -DSDL_SHARED=ON -DSDL_STATIC=OFF
          cmake --build SDL2-build
          cmake --install SDL2-build
          # Android APK ships SDL as libSDL2.so; avoid Linux-style SONAME dependency.
          $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -d "$GITHUB_WORKSPACE/sdl2-prefix/lib/libSDL2.so" | grep SONAME || true
          $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy --set-soname=libSDL2.so "$GITHUB_WORKSPACE/sdl2-prefix/lib/libSDL2.so" || true
      - name: Build DXVK Native
        env:
          DXVK_DIR: ${{ github.workspace }}/dxvk
          SDL2_PREFIX: ${{ github.workspace }}/sdl2-prefix
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          cat > /tmp/build-dxvk-android-arm64.sh <<'BUILD_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${ANDROID_NDK_HOME:?Set ANDROID_NDK_HOME}"
          DXVK_DIR="${DXVK_DIR:-$PWD/dxvk}"
          API="${ANDROID_API:-29}"
          HOST="${NDK_HOST:-linux-x86_64}"
          TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/$HOST"
          SDL2_PREFIX="${SDL2_PREFIX:?Set SDL2_PREFIX to the Android arm64 SDL2 prefix}"
          CROSS="$DXVK_DIR/meson-android-arm64.ini"
          
          cat > "$CROSS" <<EOF
          [binaries]
          c = '$TC/bin/aarch64-linux-android${API}-clang'
          cpp = '$TC/bin/aarch64-linux-android${API}-clang++'
          ar = '$TC/bin/llvm-ar'
          strip = '$TC/bin/llvm-strip'
          pkg-config = 'pkg-config'
          
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          
          [properties]
          sys_root = '$TC/sysroot'
          EOF
          
          export PKG_CONFIG_PATH="$SDL2_PREFIX/lib/pkgconfig"
          export CFLAGS="-I$SDL2_PREFIX/include -I$SDL2_PREFIX/include/SDL2 -O3 -DNDEBUG -march=armv8.2-a -ffunction-sections -fdata-sections -flto=thin -fno-semantic-interposition -fomit-frame-pointer"
          export CXXFLAGS="-I$SDL2_PREFIX/include -I$SDL2_PREFIX/include/SDL2 -O3 -DNDEBUG -march=armv8.2-a -ffunction-sections -fdata-sections -flto=thin -fno-semantic-interposition -fvisibility-inlines-hidden -fomit-frame-pointer"
          export PKG_CONFIG_LIBDIR="$SDL2_PREFIX/lib/pkgconfig"
          export LIBRARY_PATH="$SDL2_PREFIX/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
          export LDFLAGS="-L$SDL2_PREFIX/lib -Wl,--gc-sections -Wl,--icf=safe -Wl,-O2 -Wl,--as-needed -flto=thin"
          # AArch64 release hot-path pass: keep the frame-pointer register available
          # to the optimizer in DXVK's D3D11/command-stream code. This does not
          # alter Vulkan synchronization, rendering state, or image quality.
          echo "CFLAGS=$CFLAGS"
          echo "CXXFLAGS=$CXXFLAGS"
          cd "$DXVK_DIR"
          rm -rf build-android-arm64
          meson setup build-android-arm64 --cross-file "$CROSS" -Dbuildtype=release -Dstrip=true -Ddxvk_native_wsi=sdl2
          ninja -C build-android-arm64 -j"$(nproc)"

          # Meson's strip handling does not reliably shrink these Android shared objects.
          # Strip debug/symbol baggage explicitly with the matching NDK tool so the
          # launcher's renderer-slot size guard is not hit.
          STRIP="$TC/bin/llvm-strip"
          D3D11="$(find build-android-arm64 -type f -name 'libdxvk_d3d11.so' -print -quit)"
          DXGI="$(find build-android-arm64 -type f -name 'libdxvk_dxgi.so' -print -quit)"
          test -n "$D3D11" && test -n "$DXGI"
          echo "=== before explicit strip ==="
          ls -l "$D3D11" "$DXGI"
          "$STRIP" --strip-unneeded "$D3D11"
          "$STRIP" --strip-unneeded "$DXGI"
          echo "=== after explicit strip ==="
          ls -l "$D3D11" "$DXGI"
          # Known R17 old31 payload sizes are ~8.2 MiB / ~5.4 MiB. Keep a little
          # headroom and fail CI instead of producing an APK the launcher rejects.
          test "$(stat -c %s "$D3D11")" -lt 8200000
          test "$(stat -c %s "$DXGI")" -lt 5400000
          
          # Fail the build if the Linux SDL2 loader name survived compilation.
          if grep -RIl --binary-files=text 'libSDL2-2.0.so.0' build-android-arm64 | grep -q .; then
            echo "ERROR: finished DXVK still references libSDL2-2.0.so.0"
            exit 1
          fi
          
          echo "=== candidate outputs ==="
          find build-android-arm64 -type f \( -name 'libdxvk_d3d11.so*' -o -name 'libdxvk_dxgi.so*' \) -print
          echo "=== verify ==="
          find build-android-arm64 -type f \( -name 'libdxvk_d3d11.so*' -o -name 'libdxvk_dxgi.so*' \) -exec file {} \;
          find build-android-arm64 -type f \( -name 'libdxvk_d3d11.so*' -o -name 'libdxvk_dxgi.so*' \) -exec sh -c 'strings "$1" | grep -m1 -E "Sdl2WsiDriver|SDL2" || true' _ {} \;
          
          BUILD_SCRIPT
          chmod +x /tmp/build-dxvk-android-arm64.sh
          bash /tmp/build-dxvk-android-arm64.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dxvk-native-android-arm64
