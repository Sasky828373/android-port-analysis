name: Build DXVK Native Android ARM64
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Android NDK r29
        run: |
          curl -L --retry 3 -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q /tmp/ndk.zip -d "$HOME/android-ndk"
          echo "ANDROID_NDK_ROOT=$HOME/android-ndk/android-ndk-r29" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$HOME/android-ndk/android-ndk-r29" >> "$GITHUB_ENV"
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config glslang-tools python3-pip
      - name: Install Meson
        run: python3 -m pip install --user meson
      - name: Clone DXVK
        run: |
          git clone --recursive https://github.com/doitsujin/dxvk.git dxvk
          cd dxvk
          git checkout v2.3.1
          git submodule update --init --recursive
          git rev-parse HEAD
      - name: Apply GTA V A840 runtime defaults
        run: |
          python3 - <<'PY'
          from pathlib import Path
          patches = {
            "dxvk/src/dxvk/dxvk_options.cpp": [
              ('("dxvk.enableDebugUtils",       false)', '("dxvk.enableDebugUtils",       false)'),
              ('("dxvk.numCompilerThreads",     0)', '("dxvk.numCompilerThreads",     4)'),
              ('("dxvk.enableMemoryDefrag",     Tristate::Auto)', '("dxvk.enableMemoryDefrag",     Tristate::True)'),
              ('("dxvk.useRawSsbo",             Tristate::Auto)', '("dxvk.useRawSsbo",             Tristate::True)'),
              ('("dxvk.trackPipelineLifetime",  Tristate::Auto)', '("dxvk.trackPipelineLifetime",  Tristate::False)'),
              ('("dxvk.enableGraphicsPipelineLibrary", Tristate::Auto)', '("dxvk.enableGraphicsPipelineLibrary", Tristate::True)'),
              ('("dxvk.enableDescriptorUpdateTemplates", false)', '("dxvk.enableDescriptorUpdateTemplates", true)'),
              ('("dxvk.maxChunkSize",           0)', '("dxvk.maxChunkSize",           0)'),
            ],
            "dxvk/src/d3d11/d3d11_options.cpp": [
              ('("d3d11.relaxedBarriers", false)', '("d3d11.relaxedBarriers", true)'),
              ('("d3d11.relaxedGraphicsBarriers", false)', '("d3d11.relaxedGraphicsBarriers", true)'),
              ('("d3d11.enableContextLock", false)', '("d3d11.enableContextLock", false)'),
              ('("d3d11.exposeDriverCommandLists", true)', '("d3d11.exposeDriverCommandLists", true)'),
              ('("d3d11.reproducibleCommandStream", false)', '("d3d11.reproducibleCommandStream", false)'),
              ('("d3d11.dcSingleUseMode", true)', '("d3d11.dcSingleUseMode", true)'),
              ('("dxgi.maxFrameLatency", 0)', '("dxgi.maxFrameLatency", 1)'),
              ('("d3d11.maxImplicitDiscardSize", 256)', '("d3d11.maxImplicitDiscardSize", 2048)'),
              ('("d3d11.maxDynamicImageBufferSize", -1)', '("d3d11.maxDynamicImageBufferSize", 256)'),
              ('config.getOption<std::string>("d3d11.cachedDynamicResources", std::string())',
               'config.getOption<std::string>("d3d11.cachedDynamicResources", std::string("cvi"))'),
            ],
          }
          for name, edits in patches.items():
            p = Path(name)
            s = p.read_text()
            for old, new in edits:
              if old not in s:
                raise SystemExit(f"Expected source pattern missing in {name}: {old}")
              s = s.replace(old, new, 1)
            p.write_text(s)
          PY
          echo "=== A840/GTA V defaults ==="
          grep -nE 'enableMemoryDefrag|numCompilerThreads|useRawSsbo|trackPipelineLifetime|enableGraphicsPipelineLibrary|enableDescriptorUpdateTemplates|maxChunkSize|relaxedBarriers|relaxedGraphicsBarriers|enableContextLock|exposeDriverCommandLists|reproducibleCommandStream|maxFrameLatency|maxImplicitDiscardSize|maxDynamicImageBufferSize|cachedDynamicResources'             dxvk/src/dxvk/dxvk_options.cpp dxvk/src/d3d11/d3d11_options.cpp

      - name: Patch DXVK SDL2 loader for Android
        run: |
          grep -RIl 'libSDL2-2.0.so.0' dxvk/src dxvk/include | while read -r f; do
            sed -i 's/libSDL2-2\.0\.so\.0/libSDL2.so/g' "$f"
          done
          if grep -RIn 'libSDL2-2.0.so.0' dxvk/src dxvk/include; then
            echo "ERROR: Linux SDL2 soname remains in DXVK source"
            exit 1
          fi

      - name: Build SDL2 Android arm64
        run: |
          git clone --depth 1 --branch release-2.32.x https://github.com/libsdl-org/SDL.git SDL2
          cmake -S SDL2 -B SDL2-build -G Ninja -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/sdl2-prefix" -DSDL_SHARED=ON -DSDL_STATIC=OFF
          cmake --build SDL2-build
          cmake --install SDL2-build
          # Android APK ships SDL as libSDL2.so; avoid Linux-style SONAME dependency.
          $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -d "$GITHUB_WORKSPACE/sdl2-prefix/lib/libSDL2.so" | grep SONAME || true
          $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy --set-soname=libSDL2.so "$GITHUB_WORKSPACE/sdl2-prefix/lib/libSDL2.so" || true
      - name: Build DXVK Native
        env:
          DXVK_DIR: ${{ github.workspace }}/dxvk
          SDL2_PREFIX: ${{ github.workspace }}/sdl2-prefix
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          cat > /tmp/build-dxvk-android-arm64.sh <<'BUILD_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${ANDROID_NDK_HOME:?Set ANDROID_NDK_HOME}"
          DXVK_DIR="${DXVK_DIR:-$PWD/dxvk}"
          API="${ANDROID_API:-29}"
          HOST="${NDK_HOST:-linux-x86_64}"
          TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/$HOST"
          SDL2_PREFIX="${SDL2_PREFIX:?Set SDL2_PREFIX to the Android arm64 SDL2 prefix}"
          CROSS="$DXVK_DIR/meson-android-arm64.ini"
          
          cat > "$CROSS" <<EOF
          [binaries]
          c = '$TC/bin/aarch64-linux-android${API}-clang'
          cpp = '$TC/bin/aarch64-linux-android${API}-clang++'
          ar = '$TC/bin/llvm-ar'
          strip = '$TC/bin/llvm-strip'
          pkg-config = 'pkg-config'
          
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          
          [properties]
          sys_root = '$TC/sysroot'
          EOF
          
          export PKG_CONFIG_PATH="$SDL2_PREFIX/lib/pkgconfig"
          export CFLAGS="-I$SDL2_PREFIX/include -I$SDL2_PREFIX/include/SDL2 -O3 -DNDEBUG -march=armv8.2-a -mtune=cortex-x2 -fomit-frame-pointer -fno-exceptions -fno-unwind-tables -fno-asynchronous-unwind-tables -ffunction-sections -fdata-sections -flto=thin -fno-semantic-interposition"
          export CXXFLAGS="-I$SDL2_PREFIX/include -I$SDL2_PREFIX/include/SDL2 -O3 -DNDEBUG -march=armv8.2-a -ffunction-sections -fdata-sections -flto=thin -fno-semantic-interposition -fvisibility-inlines-hidden"
          export PKG_CONFIG_LIBDIR="$SDL2_PREFIX/lib/pkgconfig"
          export LIBRARY_PATH="$SDL2_PREFIX/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
          export LDFLAGS="-L$SDL2_PREFIX/lib -Wl,--gc-sections -Wl,--icf=all -Wl,-O2 -Wl,--as-needed -Wl,--pack-dyn-relocs=android+relr -flto=thin"
          cd "$DXVK_DIR"
          rm -rf build-android-arm64
          meson setup build-android-arm64 --cross-file "$CROSS" -Dbuildtype=release -Dstrip=true -Ddxvk_native_wsi=sdl2
          ninja -C build-android-arm64 -j"$(nproc)"

          # Meson's strip handling does not reliably shrink these Android shared objects.
          # Strip debug/symbol baggage explicitly with the matching NDK tool so the
          # launcher's renderer-slot size guard is not hit.
          STRIP="$TC/bin/llvm-strip"
          D3D11="$(find build-android-arm64 -type f -name 'libdxvk_d3d11.so' -print -quit)"
          DXGI="$(find build-android-arm64 -type f -name 'libdxvk_dxgi.so' -print -quit)"
          test -n "$D3D11" && test -n "$DXGI"
          echo "=== before explicit strip ==="
          ls -l "$D3D11" "$DXGI"
          "$STRIP" --strip-unneeded "$D3D11"
          "$STRIP" --strip-unneeded "$DXGI"
          echo "=== after explicit strip ==="
          ls -l "$D3D11" "$DXGI"
          # Known R17 old31 payload sizes are ~8.2 MiB / ~5.4 MiB. Keep a little
          # headroom and fail CI instead of producing an APK the launcher rejects.
          test "$(stat -c %s "$D3D11")" -lt 8200000
          test "$(stat -c %s "$DXGI")" -lt 5400000
          
          # Fail the build if the Linux SDL2 loader name survived compilation.
          if grep -RIl --binary-files=text 'libSDL2-2.0.so.0' build-android-arm64 | grep -q .; then
            echo "ERROR: finished DXVK still references libSDL2-2.0.so.0"
            exit 1
          fi
          
          echo "=== candidate outputs ==="
          find build-android-arm64 -type f \( -name 'libdxvk_d3d11.so*' -o -name 'libdxvk_dxgi.so*' \) -print
          echo "=== verify ==="
          find build-android-arm64 -type f \( -name 'libdxvk_d3d11.so*' -o -name 'libdxvk_dxgi.so*' \) -exec file {} \;
          find build-android-arm64 -type f \( -name 'libdxvk_d3d11.so*' -o -name 'libdxvk_dxgi.so*' \) -exec sh -c 'strings "$1" | grep -m1 -E "Sdl2WsiDriver|SDL2" || true' _ {} \;
          
          BUILD_SCRIPT
          chmod +x /tmp/build-dxvk-android-arm64.sh
          bash /tmp/build-dxvk-android-arm64.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dxvk-native-android-arm64
          path: |
            dxvk/build-android-arm64/**/libdxvk_d3d11.so*
            dxvk/build-android-arm64/**/libdxvk_dxgi.so*
