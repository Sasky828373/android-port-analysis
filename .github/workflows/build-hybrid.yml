name: Build XHYN Vulkan Hybrid
# Hybrid build pipeline v1

on:
  push:
    branches: [hybrid-apk-unpacked]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install actual GOLD renderer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf gold-extract
          mkdir gold-extract
          unzip -q 2.6.1.zip -d gold-extract
          D3D11="$(find gold-extract -type f -name 'libdxvk_d3d11*.so' | head -1)"
          DXGI="$(find gold-extract -type f -name 'libdxvk_dxgi*.so' | head -1)"
          test -n "$D3D11" && test -n "$DXGI"
          cp "$D3D11" XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_d3d11.so
          cp "$DXGI" XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_dxgi.so
          D3D10="$(find gold-extract -type f -name 'libdxvk_d3d10core*.so' | head -1 || true)"
          if [ -n "$D3D10" ]; then
            cp "$D3D10" XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_d3d10core.so
          fi
          echo "GOLD D3D11: $D3D11"
          echo "GOLD DXGI:  $DXGI"
          strings -a XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_d3d11.so | grep -E 'GTAV_VULKAN_LIBRARY|gtav_android_surface_state|Android swapchain' || true

      - name: Reconstruct libgtav
        shell: bash
        run: |
          set -euo pipefail
          cd XHYN_V017_UNPACKED
          cat libgtav_parts/libgtav.so.part.* > lib/arm64-v8a/libgtav.so
          test "$(stat -c%s lib/arm64-v8a/libgtav.so)" = "154327768"
          sha256sum lib/arm64-v8a/libgtav.so > HYBRID-libgtav.sha256

      - name: Native hot-path cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct

          p = Path("XHYN_V017_UNPACKED/lib/arm64-v8a/libgtav.so")
          data = bytearray(p.read_bytes())
          # ELF mapping verified for this libgtav build: file offset = virtual address - 0x4000.
          # These are gameplay diagnostics/telemetry update functions, not rendering functions.
          targets = {
              "MetricsCapture_Update":       0x4a31e34,
              "MetricsCapture_DrawWindows":  0x4a32660,
              "NetworkDebugTelemetry_Update":0x58fe1bc,
          }
          ret = bytes.fromhex("c0035fd6")  # AArch64 RET
          report = []
          for name, va in targets.items():
              off = va - 0x4000
              if off < 0 or off + 4 > len(data):
                  raise SystemExit(f"{name}: offset out of range: {off:#x}")
              old = bytes(data[off:off+4])
              # Refuse to silently patch an already-RET location or zero/corrupt area.
              if old == b"\x00\x00\x00\x00":
                  raise SystemExit(f"{name}: unexpected zero instruction at {off:#x}")
              data[off:off+4] = ret
              report.append(f"{name}: VA={va:#x} file={off:#x} old={old.hex()} new={ret.hex()}")

          p.write_bytes(data)
          Path("hybrid-report").mkdir(exist_ok=True)
          Path("hybrid-report/native-hotpath-patches.txt").write_text(
              "\n".join(report) + "\nsha256=" + hashlib.sha256(data).hexdigest() + "\n"
          )
          PY
          sha256sum XHYN_V017_UNPACKED/lib/arm64-v8a/libgtav.so

      - name: Verify hybrid native stack
        shell: bash
        run: |
          set -euo pipefail
          cd XHYN_V017_UNPACKED
          grep -q '^interop_native=true' assets/default-android.ini
          strings -a lib/arm64-v8a/libgtav_vulkan.so | grep -q 'gtav_android_surface_state'
          strings -a lib/arm64-v8a/libgtav_vulkan.so | grep -q 'gtav_android_lock_surface'
          strings -a lib/arm64-v8a/libgtav_vulkan.so | grep -q 'gtav_android_unlock_surface'
          strings -a lib/arm64-v8a/libdxvk_d3d11.so | grep -q 'GTAV_VULKAN_LIBRARY'
          strings -a lib/arm64-v8a/libdxvk_d3d11.so | grep -q 'gtav_android_surface_state'
          test -s lib/arm64-v8a/libgtav.so
          test -s lib/arm64-v8a/libgtav_vulkan.so
          test -s lib/arm64-v8a/libgtavvk.so
          test -s lib/arm64-v8a/libdxvk_d3d11.so
          test -s lib/arm64-v8a/libdxvk_dxgi.so

      - name: Native hybrid report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hybrid-report
          for f in XHYN_V017_UNPACKED/lib/arm64-v8a/{libgtav.so,libgtav_vulkan.so,libgtavvk.so,libdxvk_d3d11.so,libdxvk_dxgi.so}; do
            b="$(basename "$f")"
            {
              echo "===== $b ====="
              file "$f"
              sha256sum "$f"
              readelf -h "$f" || true
              echo "--- NEEDED/DYNAMIC ---"
              readelf -d "$f" || true
              echo "--- EXPORTED SYMBOLS ---"
              readelf -Ws "$f" | grep -E 'gtav_android|Java_com_gtavsource|vkQueue|vkAcquire|vkCreateSwapchain|vkGetSwapchain' || true
              echo "--- HYBRID STRINGS ---"
              strings -a "$f" | grep -Ei 'GTAV_VULKAN|gtav_android|swapchain|surface|interop|skin|luminance|refract|present|vulkan' | head -n 500 || true
            } > "hybrid-report/$b.txt"
          done

      - name: Patch original APK without rebuilding package structure
        shell: bash
        run: |
          set -euo pipefail
          rm -rf patchstage out
          mkdir -p patchstage out
          cp "XHYN V_0.17custom.apk" out/XHYN_V0.17_HYBRID_FULL_UNSIGNED.apk

          # Strip the old signature only. Keep the original manifest/resources/ZIP layout.
          zip -q -d out/XHYN_V0.17_HYBRID_FULL_UNSIGNED.apk 'META-INF/*' || true

          # Only files intentionally changed by the hybrid are replaced.
          mkdir -p patchstage/assets patchstage/lib/arm64-v8a
          cp XHYN_V017_UNPACKED/assets/default-android.ini patchstage/assets/
          cp XHYN_V017_UNPACKED/assets/dxvk.conf patchstage/assets/
          cp XHYN_V017_UNPACKED/lib/arm64-v8a/libgtav.so patchstage/lib/arm64-v8a/\n          cp XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_d3d11.so patchstage/lib/arm64-v8a/
          cp XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_dxgi.so patchstage/lib/arm64-v8a/
          if [ -f XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_d3d10core.so ]; then
            cp XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_d3d10core.so patchstage/lib/arm64-v8a/
          fi

          # Replace native libraries uncompressed; this is required by many modern Android APKs.
          (
            cd patchstage
            zip -q -0 -u ../out/XHYN_V0.17_HYBRID_FULL_UNSIGNED.apk lib/arm64-v8a/libdxvk_d3d11.so lib/arm64-v8a/libdxvk_dxgi.so lib/arm64-v8a/libgtav.so $(test -f lib/arm64-v8a/libdxvk_d3d10core.so && echo lib/arm64-v8a/libdxvk_d3d10core.so || true)
            zip -q -9 -u ../out/XHYN_V0.17_HYBRID_FULL_UNSIGNED.apk assets/default-android.ini assets/dxvk.conf
          )

      - name: Align sign and validate install package
        shell: bash
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"

          "$BT/zipalign" -f -p 4             out/XHYN_V0.17_HYBRID_FULL_UNSIGNED.apk             out/XHYN_V0.17_HYBRID_FULL_ALIGNED.apk
          "$BT/zipalign" -c -p 4 out/XHYN_V0.17_HYBRID_FULL_ALIGNED.apk

          keytool -genkeypair -noprompt             -keystore out/hybrid.keystore -storepass android -keypass android             -alias hybrid -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=XHYN Hybrid,O=Android,C=DE"

          "$BT/apksigner" sign             --ks out/hybrid.keystore --ks-pass pass:android --key-pass pass:android             --out out/XHYN_V0.17_HYBRID_FULL_SIGNED.apk             out/XHYN_V0.17_HYBRID_FULL_ALIGNED.apk

          "$BT/apksigner" verify --verbose --print-certs out/XHYN_V0.17_HYBRID_FULL_SIGNED.apk
          "$BT/aapt" dump badging out/XHYN_V0.17_HYBRID_FULL_SIGNED.apk | tee out/aapt-badging.txt
          "$BT/aapt" dump xmltree out/XHYN_V0.17_HYBRID_FULL_SIGNED.apk AndroidManifest.xml >/dev/null
          unzip -t out/XHYN_V0.17_HYBRID_FULL_SIGNED.apk >/dev/null
          sha256sum out/XHYN_V0.17_HYBRID_FULL_SIGNED.apk > out/XHYN_V0.17_HYBRID_FULL_SIGNED.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: XHYN-V0.17-HYBRID-FULL
          path: |
            out/XHYN_V0.17_HYBRID_FULL_SIGNED.apk
            out/XHYN_V0.17_HYBRID_FULL_SIGNED.apk.sha256
            hybrid-report/
          compression-level: 0
