            hybrid-report/rage-d3d11-symbols.txt
            hybrid-report/rage-d3d11-migration-targets.txt
            hybrid-report/full-native/grc-device-initclass.disasm.txt
            hybrid-report/full-native/vulkan-runtime-init.disasm.txt
            hybrid-report/native-adapter/bootstrap-symbols.txt
