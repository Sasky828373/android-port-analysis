            'isrequested-value1.txt':(0x2285eda,64),
            'isrequested-value2.txt':(0x218d945,64),
            'isrequested-env2.txt':(0x2484d74,96),
            'isrequested-config-default.txt':(0x23892bc,96),
          }
          with open(p,'rb') as f:
            for name,(va,n) in req.items():
              for lo,filesz,p_offset in segs:
                hi=lo+filesz
                if lo <= va < hi:
                  off=p_offset+(va-lo); f.seek(off); b=f.read(n)
                  printable=''.join(chr(x) if 32<=x<127 else '.' for x in b)
                  strings=[s.decode('utf-8','replace') for s in b.split(b'\0') if s]
                  with open('hybrid-report/native-adapter/'+name,'w') as o:
                    o.write(f'VA=0x{va:x} file_off=0x{off:x} len={len(b)}\\n')
                    o.write('hex='+b.hex()+'\\n')
                    o.write('ascii='+printable+'\\n')
                    o.write('strings='+repr(strings)+'\\n')
