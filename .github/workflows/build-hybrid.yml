          "$OBJDUMP" -s --start-address=0x622ef80 --stop-address=0x622f300 XHYN_V017_UNPACKED/lib/arm64-v8a/libgtav.so > hybrid-report/native-adapter/native-device-adapter.bytes.txt
          grep -n -E 'grVulkanNativeDeviceAdapter|sysParam|Get@plt|IsRequested|Initialize|Driver|Vulkan' hybrid-report/native-adapter/native-device-adapter.disasm.txt > hybrid-report/native-adapter/native-device-adapter-highlights.txt || true
          test -s hybrid-report/native-adapter/native-device-adapter.disasm.txt
