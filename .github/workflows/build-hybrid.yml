      - name: Apply first native Vulkan bootstrap patch
        shell: bash
        run: |
          set -euo pipefail
          LIB=XHYN_V017_UNPACKED/lib/arm64-v8a/libgtav.so
          python3 - <<'PY'
          import struct
          p="XHYN_V017_UNPACKED/lib/arm64-v8a/libgtav.so"
          data=bytearray(open(p,"rb").read())

          # ELF64 PT_LOAD VA -> file offset.
          e_phoff=struct.unpack_from("<Q",data,0x20)[0]
          e_phentsize=struct.unpack_from("<H",data,0x36)[0]
          e_phnum=struct.unpack_from("<H",data,0x38)[0]
          def vaoff(va):
              for i in range(e_phnum):
                  o=e_phoff+i*e_phentsize
                  p_type=struct.unpack_from("<I",data,o)[0]
                  if p_type != 1: continue
                  p_offset=struct.unpack_from("<Q",data,o+0x08)[0]
                  p_vaddr=struct.unpack_from("<Q",data,o+0x10)[0]
                  p_filesz=struct.unpack_from("<Q",data,o+0x20)[0]
                  if p_vaddr <= va < p_vaddr+p_filesz:
                      return p_offset+(va-p_vaddr)
              raise RuntimeError(hex(va))

          # Keep IsRequested forced native (already validated as a real adapter path).
          # Patch the legacy DX feature-level query so native bootstrap does not
          # immediately dereference a D3D device merely to report FL11_0.
          va=0x61b1db0
          off=vaoff(va)
          original=bytes(data[off:off+8])
          # mov w0,#0x44c ; ret
          patch=struct.pack("<II",0x52808980,0xd65f03c0)
          data[off:off+8]=patch

          open(p,"wb").write(data)
          print("patched GetDXFeatureLevelSupported",hex(va),
                "old",original.hex(),"new",patch.hex())
          PY

          mkdir -p hybrid-report/native-patch
          {
            echo "PATCH: grcDevice::GetDXFeatureLevelSupported @ 0x61b1db0"
            echo "ACTION: return 0x44c (D3D feature level 11.0 engine code) without dereferencing legacy D3D device"
            echo "PURPOSE: first executable native-Vulkan bootstrap patch; remove one proven post-bootstrap D3D object dependency"
            echo "NOTE: D3D11CreateDeviceAndSwapChain itself is intentionally not NOPed yet because InitClass immediately consumes real swapchain/device/context objects."
          } > hybrid-report/native-patch/patch-manifest.txt

      - name: Keep verified bootable engine startup
        shell: bash
        run: |
          set -euo pipefail
          # Do not force the unverified native selector here. This libgtav does not
          # export grVulkanNativeDeviceAdapter::IsRequested in its symbol table, and
          # the previous hard-coded address froze startup. Keep the engine bytes intact.
          LIB=XHYN_V017_UNPACKED/lib/arm64-v8a/libgtav.so
          test -s "$LIB"
