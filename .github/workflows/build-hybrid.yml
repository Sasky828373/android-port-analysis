          test -n "$ANDROID_NDK_HOME"
          cmake -S native-renderer -B native-renderer/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28
          cmake --build native-renderer/build --parallel 2
          test -s native-renderer/build/libgtav_native_renderer.so
          cp -f native-renderer/build/libgtav_native_renderer.so XHYN_V017_UNPACKED/lib/arm64-v8a/
          sudo apt-get install -y patchelf
          BRIDGE=XHYN_V017_UNPACKED/lib/arm64-v8a/libgtav_vulkan.so
          patchelf --add-needed libgtav_native_renderer.so "$BRIDGE"
          patchelf --print-needed "$BRIDGE" | grep -Fx libgtav_native_renderer.so
          readelf -d "$BRIDGE" | grep -F 'libgtav_native_renderer.so'
          file XHYN_V017_UNPACKED/lib/arm64-v8a/libgtav_native_renderer.so | tee hybrid-report/native-renderer-build.txt
          readelf -Ws XHYN_V017_UNPACKED/lib/arm64-v8a/libgtav_native_renderer.so | \
            grep -E 'gtav_native_renderer_(attach|get_dispatch|register_resource|draw|draw_indexed|dispatch|submit)' \
            | tee -a hybrid-report/native-renderer-build.txt

      - name: Verify hybrid native stack
        shell: bash
        run: |
          set -euo pipefail
          cd XHYN_V017_UNPACKED
          grep -q '^interop_native=true' assets/default-android.ini
          strings -a lib/arm64-v8a/libgtav_vulkan.so | grep -q 'gtav_android_surface_state'
          strings -a lib/arm64-v8a/libgtav_vulkan.so | grep -q 'gtav_android_lock_surface'
          strings -a lib/arm64-v8a/libgtav_vulkan.so | grep -q 'gtav_android_unlock_surface'
          test -s lib/arm64-v8a/libgtav.so
          test -s lib/arm64-v8a/libgtav_vulkan.so
          test -s lib/arm64-v8a/libgtavvk.so
          test -s lib/arm64-v8a/libgtav_native_renderer.so

      - name: Patch original APK without rebuilding package structure
        shell: bash
        run: |
          set -euo pipefail
          rm -rf patchstage out
          mkdir -p patchstage/assets patchstage/lib/arm64-v8a out
          cp "XHYN V_0.17custom.apk" out/XHYN_V0.17_HYBRID_PERFORMANCE_UNSIGNED.apk
          zip -q -d out/XHYN_V0.17_HYBRID_PERFORMANCE_UNSIGNED.apk 'META-INF/*' || true
          cp XHYN_V017_UNPACKED/assets/default-android.ini patchstage/assets/
          cp XHYN_V017_UNPACKED/lib/arm64-v8a/libgtav.so patchstage/lib/arm64-v8a/
          cp XHYN_V017_UNPACKED/lib/arm64-v8a/libgtav_vulkan.so patchstage/lib/arm64-v8a/
          cp XHYN_V017_UNPACKED/lib/arm64-v8a/libgtav_native_renderer.so patchstage/lib/arm64-v8a/
          sudo apt-get update -q
          sudo apt-get install -y patchelf
          patchelf --remove-needed libdxvk_d3d11.so patchstage/lib/arm64-v8a/libgtav.so || true
          patchelf --remove-needed libdxvk_dxgi.so patchstage/lib/arm64-v8a/libgtav.so || true
          patchelf --remove-needed libdxvk_d3d10core.so patchstage/lib/arm64-v8a/libgtav.so || true
          patchelf --print-needed patchstage/lib/arm64-v8a/libgtav.so > /tmp/libgtav-needed.txt
          if grep -q '^libdxvk_' /tmp/libgtav-needed.txt; then exit 1; fi

          # Known remaining imports after DXVK removal are handled by the native cutover work.
          readelf -Ws patchstage/lib/arm64-v8a/libgtav.so | awk '$7 == "UND" { print $8 }' | sort -u > /tmp/libgtav-undefined.txt
          grep -E '^(CreateDXGIFactory|D3D11CreateDevice|D3D11CreateDeviceAndSwapChain)$' /tmp/libgtav-undefined.txt || true
          zip -q -d out/XHYN_V0.17_HYBRID_PERFORMANCE_UNSIGNED.apk 'lib/arm64-v8a/libdxvk_d3d11.so' 'lib/arm64-v8a/libdxvk_dxgi.so' 'lib/arm64-v8a/libdxvk_d3d10core.so' 'assets/dxvk.conf' 'assets/*dxvk*' 'assets/dxvk/*' || true
          cd patchstage
          zip -q -0 -u ../out/XHYN_V0.17_HYBRID_PERFORMANCE_UNSIGNED.apk lib/arm64-v8a/libgtav.so lib/arm64-v8a/libgtav_vulkan.so lib/arm64-v8a/libgtav_native_renderer.so
          zip -q -9 -u ../out/XHYN_V0.17_HYBRID_PERFORMANCE_UNSIGNED.apk assets/default-android.ini
          cd ..

      - name: Align sign and validate install package
        shell: bash
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"

          "$BT/zipalign" -f -p 4             out/XHYN_V0.17_HYBRID_PERFORMANCE_UNSIGNED.apk             out/XHYN_V0.17_HYBRID_PERFORMANCE_ALIGNED.apk
          "$BT/zipalign" -c -p 4 out/XHYN_V0.17_HYBRID_PERFORMANCE_ALIGNED.apk

          keytool -genkeypair -noprompt             -keystore out/hybrid.keystore -storepass android -keypass android             -alias hybrid -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=XHYN Hybrid,O=Android,C=DE"

          "$BT/apksigner" sign             --ks out/hybrid.keystore --ks-pass pass:android --key-pass pass:android             --out out/XHYN_V0.17_HYBRID_PERFORMANCE_SIGNED.apk             out/XHYN_V0.17_HYBRID_PERFORMANCE_ALIGNED.apk

          "$BT/apksigner" verify --verbose --print-certs out/XHYN_V0.17_HYBRID_PERFORMANCE_SIGNED.apk
          "$BT/aapt" dump badging out/XHYN_V0.17_HYBRID_PERFORMANCE_SIGNED.apk | tee out/aapt-badging.txt
          "$BT/aapt" dump xmltree out/XHYN_V0.17_HYBRID_PERFORMANCE_SIGNED.apk AndroidManifest.xml >/dev/null
          unzip -t out/XHYN_V0.17_HYBRID_PERFORMANCE_SIGNED.apk >/dev/null
          unzip -l out/XHYN_V0.17_HYBRID_PERFORMANCE_SIGNED.apk | grep -F 'lib/arm64-v8a/libgtav_native_renderer.so'
          ! unzip -l out/XHYN_V0.17_HYBRID_PERFORMANCE_SIGNED.apk | grep -E 'libdxvk_(d3d11|dxgi|d3d10core)\.so|assets/dxvk\.conf'
          unzip -p out/XHYN_V0.17_HYBRID_PERFORMANCE_SIGNED.apk lib/arm64-v8a/libgtav_vulkan.so | strings | grep -F 'libgtav_native_renderer.so'
          unzip -l out/XHYN_V0.17_HYBRID_PERFORMANCE_SIGNED.apk > /tmp/apk-list.txt
          if grep -Eiq 'dxvk' /tmp/apk-list.txt; then
            echo "DXVK payload remains in final APK" >&2
            grep -Ei 'dxvk' /tmp/apk-list.txt >&2
            exit 1
          fi
          unzip -p out/XHYN_V0.17_HYBRID_PERFORMANCE_SIGNED.apk lib/arm64-v8a/libgtav.so > /tmp/final-libgtav.so
          patchelf --print-needed /tmp/final-libgtav.so > /tmp/final-needed.txt
          if grep -q '^libdxvk_' /tmp/final-needed.txt; then
            echo "DXVK dependency remains in packaged libgtav.so" >&2
            cat /tmp/final-needed.txt >&2
            exit 1
          fi
          cp out/XHYN_V0.17_HYBRID_PERFORMANCE_SIGNED.apk /tmp/final.apk
          unzip -t /tmp/final.apk >/dev/null
          sha256sum out/XHYN_V0.17_HYBRID_PERFORMANCE_SIGNED.apk > out/XHYN_V0.17_HYBRID_PERFORMANCE_SIGNED.apk.sha256

      - name: Publish direct APK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="native-capture-${GITHUB_RUN_NUMBER}"
          APK="out/XHYN_V0.17_HYBRID_PERFORMANCE_SIGNED.apk"
          SUM="out/XHYN_V0.17_HYBRID_PERFORMANCE_SIGNED.apk.sha256"
          gh release create "$TAG" "$APK" "$SUM" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "XHYN Native Capture ${GITHUB_RUN_NUMBER}" \
            --notes "Direct APK download. Built from ${GITHUB_SHA} and validated with zipalign, apksigner and unzip -t."

      - name: Upload APK only
        uses: actions/upload-artifact@v4
        with:
          name: XHYN-V0.17-APK-ONLY
          path: |
            out/XHYN_V0.17_HYBRID_PERFORMANCE_SIGNED.apk
            out/XHYN_V0.17_HYBRID_PERFORMANCE_SIGNED.apk.sha256
          compression-level: 0
