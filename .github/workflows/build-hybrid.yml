name: Build XHYN Vulkan Hybrid Performance
# Hybrid build pipeline v1

on:
  push:
    branches: [hybrid-apk-unpacked]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install actual GOLD renderer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf gold-extract
          mkdir gold-extract
          unzip -q 2.6.1.zip -d gold-extract
          D3D11="$(find gold-extract -type f -name 'libdxvk_d3d11*.so' | head -1)"
          DXGI="$(find gold-extract -type f -name 'libdxvk_dxgi*.so' | head -1)"
          test -n "$D3D11" && test -n "$DXGI"
          cp "$D3D11" XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_d3d11.so
          cp "$DXGI" XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_dxgi.so
          D3D10="$(find gold-extract -type f -name 'libdxvk_d3d10core*.so' | head -1 || true)"
          if [ -n "$D3D10" ]; then
            cp "$D3D10" XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_d3d10core.so
          fi
          echo "GOLD D3D11: $D3D11"
          echo "GOLD DXGI:  $DXGI"
          strings -a XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_d3d11.so | grep -E 'GTAV_VULKAN_LIBRARY|gtav_android_surface_state|Android swapchain' || true

      - name: Reconstruct libgtav
        shell: bash
        run: |
          set -euo pipefail
          cd XHYN_V017_UNPACKED
          cat libgtav_parts/libgtav.so.part.* > lib/arm64-v8a/libgtav.so
          test "$(stat -c%s lib/arm64-v8a/libgtav.so)" = "154327768"
          sha256sum lib/arm64-v8a/libgtav.so > HYBRID-libgtav.sha256

      - name: Native hot-path cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct

          p = Path("XHYN_V017_UNPACKED/lib/arm64-v8a/libgtav.so")
          data = bytearray(p.read_bytes())
          # ELF mapping verified for this libgtav build: file offset = virtual address - 0x4000.
          # These are diagnostics/telemetry and PIX instrumentation entry points, not rendering passes.
          targets = {
              "MetricsCapture_Update":       0x4a31e34,
              "MetricsCapture_DrawWindows":  0x4a32660,
              "NetworkDebugTelemetry_Update":0x58fe1bc,
              "PIX_marker_61329f8":          0x61329f8,
              "PIX_marker_611d854":          0x611d854,
              "PIX_marker_6135ec0":          0x6135ec0,
              "PIX_marker_612eaf8":          0x612eaf8,
              "PIX_marker_611d6d4":          0x611d6d4,
              "PIX_marker_6136044":          0x6136044,
          }
          ret = bytes.fromhex("c0035fd6")  # AArch64 RET
          # Safety gate: every patch must still look like a normal AArch64 function entry.
          # This prevents silently patching the wrong build/address.
          allowed_first = {
              0xa9bf7bfd, 0xa9be7bfd, 0xa9bd7bfd, 0xa9bc7bfd, 0xd503201f,
          }
          report = []
          for name, va in targets.items():
              off = va - 0x4000
              if off < 0 or off + 4 > len(data):
                  raise SystemExit(f"{name}: offset out of range: {off:#x}")
              old = bytes(data[off:off+4])
              insn = int.from_bytes(old, "little")
              # Accept common frame prologues or stack-pointer SUB forms only.
              is_sub_sp = (insn & 0xffc003ff) == 0xd10003ff
              is_stp_fp_lr = (insn & 0xffc07fff) == 0xa9807bfd
              if old == ret:
                  report.append(f"{name}: already RET at {off:#x}")
                  continue
              if old == b"\x00\x00\x00\x00" or not (is_sub_sp or is_stp_fp_lr or insn in allowed_first):
                  raise SystemExit(f"{name}: unexpected entry instruction {old.hex()} at {off:#x}; refusing unsafe patch")
              data[off:off+4] = ret
              report.append(f"{name}: VA={va:#x} file={off:#x} old={old.hex()} new={ret.hex()}")

          p.write_bytes(data)
          Path("hybrid-report").mkdir(exist_ok=True)
          Path("hybrid-report/native-hotpath-patches.txt").write_text(
              "\n".join(report) + "\nsha256=" + hashlib.sha256(data).hexdigest() + "\n"
          )
          PY
          sha256sum XHYN_V017_UNPACKED/lib/arm64-v8a/libgtav.so

      - name: Native Vulkan efficiency audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hybrid-report
          {
            echo "=== GOLD Vulkan synchronization/submission symbols ==="
            for f in XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_d3d11.so XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_dxgi.so XHYN_V017_UNPACKED/lib/arm64-v8a/libgtav_vulkan.so; do
              echo "--- $f ---"
              readelf -Ws "$f" | grep -E 'vk(QueueSubmit|QueuePresent|WaitForFences|ResetFences|WaitSemaphores|SignalSemaphore|AcquireNextImage|AllocateMemory|FreeMemory|AllocateDescriptor|UpdateDescriptor)' || true
              strings -a "$f" | grep -Ei 'queue submit|wait.*fence|semaphore|descriptor|allocation|memory budget|present wait|frame pace' | head -n 250 || true
            done
          } > hybrid-report/native-efficiency-audit.txt

          # Locate actual AArch64 call sites that reference the Vulkan wait/submit symbols.
          # Report only: no synchronization semantics are changed until a caller is verified.
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          libs = [
            Path("XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_d3d11.so"),
            Path("XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_dxgi.so"),
          ]
          needles = ("vkWaitForFences","vkWaitSemaphores","vkQueueSubmit","vkQueuePresentKHR",
                     "vkAcquireNextImageKHR","vkUpdateDescriptorSets","vkUpdateDescriptorSetWithTemplate")
          out=[]
          for lib in libs:
            out.append(f"=== {lib.name} dynamic Vulkan imports ===")
            try:
              syms=subprocess.check_output(["readelf","-Ws",str(lib)],text=True,errors="replace")
            except subprocess.CalledProcessError as e:
              syms=e.output or ""
            for line in syms.splitlines():
              if any(n in line for n in needles):
                out.append(line)
            out.append("")
            out.append("=== relocation references ===")
            try:
              rel=subprocess.check_output(["readelf","-rW",str(lib)],text=True,errors="replace")
            except subprocess.CalledProcessError as e:
              rel=e.output or ""
            for line in rel.splitlines():
              if any(n in line for n in needles):
                out.append(line)
            out.append("")
          Path("hybrid-report/vulkan-sync-relocations.txt").write_text("\n".join(out)+"\n")
          PY

      - name: GOLD embedded Vulkan dispatch audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hybrid-report
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          libs=[
            Path("XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_d3d11.so"),
            Path("XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_dxgi.so"),
          ]
          needles=("vkGetDeviceProcAddr","vkGetInstanceProcAddr","vkWaitForFences","vkWaitSemaphores",
                   "vkQueueSubmit","vkQueuePresentKHR","vkAcquireNextImageKHR",
                   "vkUpdateDescriptorSets","vkUpdateDescriptorSetWithTemplate")
          out=[]
          for lib in libs:
            out += [f"=== {lib.name} ==="]
            for cmd,title in [(["readelf","-Ws",str(lib)],"symbols"),
                              (["readelf","-rW",str(lib)],"relocations"),
                              (["readelf","-x",".dynstr",str(lib)],"dynstr")]:
              out.append(f"-- {title} --")
              p=subprocess.run(cmd,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              hits=[ln for ln in p.stdout.splitlines() if any(n in ln for n in needles)]
              out.extend(hits or ["(no direct entries)"])
            # Dynamic dispatch tables often hide direct relocations; retain loader/dispatch strings.
            s=subprocess.run(["strings","-a","-t","x",str(lib)],text=True,stdout=subprocess.PIPE).stdout
            out.append("-- string offsets --")
            hits=[ln for ln in s.splitlines() if any(n in ln for n in needles)]
            out.extend(hits or ["(no strings)"])
            out.append("")
          Path("hybrid-report/gold-vulkan-dispatch-audit.txt").write_text("\n".join(out)+"\n")
          PY

      - name: Disassemble GOLD Vulkan dispatch call sites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hybrid-report
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu
          for f in XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_d3d11.so XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_dxgi.so; do
            b="$(basename "$f")"
            aarch64-linux-gnu-objdump -d -C "$f" > "hybrid-report/$b.disasm.txt"
            strings -a -t x "$f" | grep -Ei 'Failed to wait for WSI fence|Failed to wait for semaphore|Frame pace:|vkWaitForFences|vkWaitSemaphores|vkQueueSubmit|vkQueuePresentKHR|vkAcquireNextImageKHR|vkUpdateDescriptorSets|vkUpdateDescriptorSetWithTemplate' > "hybrid-report/$b.sync-string-offsets.txt" || true
          done
          {
            echo "GOLD uses an internal Vulkan dispatch table; empty ELF imports/relocations are expected."
            echo "The disassembly and string offsets are the inputs for mapping indirect BLR calls to Presenter/submit/wait code."
          } > hybrid-report/gold-dispatch-note.txt

      - name: Resolve GOLD Vulkan string Xrefs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          lib=Path("XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_d3d11.so")
          targets=[
            b"vkQueuePresentKHR",b"vkQueueSubmit",b"vkQueueSubmit2",
            b"vkWaitForFences",b"vkWaitSemaphores",b"vkAcquireNextImageKHR",
            b"vkUpdateDescriptorSets",b"vkUpdateDescriptorSetWithTemplate",
            b"Presenter: Failed to wait for WSI fence: ",b"Failed to wait for semaphore: "
          ]
          data=lib.read_bytes()
          ph=subprocess.check_output(["readelf","-lW",str(lib)],text=True)
          seg=[]
          for line in ph.splitlines():
            m=re.match(r"\s*LOAD\s+0x([0-9a-fA-F]+)\s+0x([0-9a-fA-F]+)\s+0x[0-9a-fA-F]+\s+0x([0-9a-fA-F]+)",line)
            if m: seg.append(tuple(int(x,16) for x in m.groups()))
          def f2v(off):
            for fo,va,fs in seg:
              if fo <= off < fo+fs: return va+(off-fo)
          dis=subprocess.check_output(["aarch64-linux-gnu-objdump","-d","-C",str(lib)],text=True,errors="replace")
          lines=dis.splitlines()
          ins=[]
          for i,line in enumerate(lines):
            m=re.match(r"\s*([0-9a-fA-F]+):\s+[0-9a-fA-F]+\s+([^\s]+)\s*(.*)",line)
            if m: ins.append((i,int(m.group(1),16),m.group(2),m.group(3)))
          out=[]
          for s in targets:
            off=data.find(s)
            if off<0: continue
            va=f2v(off)
            out.append(f"=== {s.decode(errors='replace')} file=0x{off:x} va={('0x%x'%va) if va is not None else 'N/A'} ===")
            if va is None: continue
            # objdump resolves many ADR/ADRP targets in comments/operands; capture direct references.
            hits=[]
            hx=f"{va:x}"
            for idx,(li,addr,mn,op) in enumerate(ins):
              if hx in op.lower():
                hits.append(idx)
            for h in hits[:24]:
              li=ins[h][0]
              out.extend(lines[max(0,li-10):min(len(lines),li+15)])
              out.append("---")
            if not hits: out.append("no direct resolved xref; likely address built through ADRP+ADD/GOT/dispatch table")
          Path("hybrid-report/gold-vulkan-xrefs.txt").write_text("\n".join(out)+"\n")
          PY

      - name: Map GOLD Vulkan loader dispatch table
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hybrid-report
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          lib=Path("XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_d3d11.so")
          names=["vkQueuePresentKHR","vkQueueSubmit","vkQueueSubmit2","vkWaitForFences",
                 "vkWaitSemaphores","vkAcquireNextImageKHR","vkUpdateDescriptorSets",
                 "vkUpdateDescriptorSetWithTemplate"]
          data=lib.read_bytes()
          dis=subprocess.check_output(["aarch64-linux-gnu-objdump","-d","-C",str(lib)],text=True,errors="replace")
          # Vulkan proc names are loader data, not code xrefs. Locate the loader routine instead:
          # search disassembly around calls to dlsym/dlopen/vkGet*ProcAddr PLT and indirect BLR clusters.
          lines=dis.splitlines()
          out=[]
          keys=("dlsym@plt","dlopen@plt","vkGetInstanceProcAddr","vkGetDeviceProcAddr")
          for i,line in enumerate(lines):
            if any(k in line for k in keys):
              out.append("=== loader/proc resolver call ===")
              out.extend(lines[max(0,i-18):min(len(lines),i+28)])
          # Also record all proc-name file offsets in one compact table.
          out.append("=== Vulkan proc-name offsets ===")
          for n in names:
            off=data.find(n.encode())
            out.append(f"{n}: file_off=0x{off:x}" if off>=0 else f"{n}: missing")
          Path("hybrid-report/gold-vulkan-loader-map.txt").write_text("\n".join(out)+"\n")
          PY

      - name: Extract GOLD Vulkan dispatch slot map
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hybrid-report
          # The loader map shows a real dlsym-populated function-pointer object around 0x345048.
          # Dump the whole constructor and every indirect call through that object's slots.
          aarch64-linux-gnu-objdump -d -C \
            --start-address=0x345048 --stop-address=0x345700 \
            XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_d3d11.so \
            > hybrid-report/gold-vulkan-dispatch-constructor.txt
          aarch64-linux-gnu-objdump -d -C XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_d3d11.so \
            | grep -E -B6 -A10 'blr[[:space:]]+x[0-9]+' \
            > hybrid-report/gold-indirect-call-sites.txt || true
          {
            echo "Known constructor stores:"
            echo "object+0x10 <- dlsym result"
            echo "object+0x18 <- dlsym result"
            echo "object+0x20 <- dlsym result"
            echo "object+0x28 <- dlsym result"
            echo "object+0x30 <- dlsym result"
            echo "object+0x38 <- dlsym result"
            echo "object+0x40 <- dlsym result"
            echo
            echo "Next step: resolve each ADRP+ADD name address in constructor to the actual string,"
            echo "then map LDR [object,#slot] + BLR call sites."
          } > hybrid-report/gold-dispatch-slots.txt

      - name: Resolve GOLD dispatch symbol names
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          lib=Path("XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_d3d11.so")
          data=lib.read_bytes()
          src=Path("hybrid-report/gold-vulkan-dispatch-constructor.txt").read_text(errors="replace").splitlines()
          out=[]
          page=None
          for i,line in enumerate(src):
            m=re.search(r'adrp\s+x1,\s*([0-9a-fA-F]+)',line)
            if m: page=int(m.group(1),16)
            m=re.search(r'add\s+x1,\s*x1,\s*#0x([0-9a-fA-F]+)',line)
            if m and page is not None:
              va=page+int(m.group(1),16)
              if i+1 < len(src) and "dlsym@plt" in src[i+1]:
                end=data.find(b'\0',va,va+256)
                name=data[va:end].decode(errors="replace") if end>va else "?"
                slot="?"
                for j in range(i+2,min(i+8,len(src))):
                  sm=re.search(r'str\s+x(?:8|0),\s*\[x19(?:,\s*#(\d+))?\]',src[j])
                  if sm:
                    slot=int(sm.group(1) or 0); break
                out.append(f"slot +0x{slot:x} ({slot:3d}) <- {name} @0x{va:x}")
          Path("hybrid-report/gold-dispatch-symbol-map.txt").write_text("\n".join(out)+"\n")
          PY

      - name: Locate GOLD Vulkan dispatch objects
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          lib=Path("XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_d3d11.so")
          data=lib.read_bytes()
          dis=subprocess.check_output(["aarch64-linux-gnu-objdump","-d","-C",str(lib)],text=True,errors="replace").splitlines()
          wanted=[b"vkQueueSubmit",b"vkQueueSubmit2",b"vkQueuePresentKHR",b"vkWaitForFences",
                  b"vkWaitSemaphores",b"vkAcquireNextImageKHR",b"vkUpdateDescriptorSets",
                  b"vkUpdateDescriptorSetWithTemplate",b"vkGetDeviceProcAddr",b"vkGetInstanceProcAddr"]
          out=[]
          for s in wanted:
            off=data.find(s)
            if off<0: continue
            out.append(f"=== {s.decode()} @ file/VA 0x{off:x} ===")
            page=off & ~0xfff; lo=off & 0xfff
            # Find ADRP to page, then nearby ADD/LDR forming exact address.
            for i,line in enumerate(dis):
              m=re.search(r'adrp\s+x(\d+),\s*([0-9a-fA-F]+)',line)
              if not m or int(m.group(2),16)!=page: continue
              reg=m.group(1)
              for j in range(i+1,min(i+8,len(dis))):
                if re.search(rf'add\s+x{reg},\s*x{reg},\s*#0x{lo:x}\b',dis[j]):
                  out.append("\n".join(dis[max(0,i-10):min(len(dis),j+18)]))
                  out.append("---")
                  break
          Path("hybrid-report/gold-vulkan-proc-xrefs-v2.txt").write_text("\n".join(out)+"\n")
          PY

      - name: Trace GOLD Vulkan hot dispatch slots
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          lib=Path("XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_d3d11.so")
          dis=subprocess.check_output(["aarch64-linux-gnu-objdump","-d","-C",str(lib)],text=True,errors="replace").splitlines()
          slots={
            "vkQueueSubmit":0x38,
            "vkQueueSubmit2":0x40,
            "vkWaitForFences":0x108,
            "vkWaitSemaphores":0x2f8,
            "vkAcquireNextImageKHR":0x588,
            "vkQueuePresentKHR":0x590,
            "vkUpdateDescriptorSets":0x248,
            "vkUpdateDescriptorSetWithTemplate":0x2d0,
          }
          out=[]
          for name,slot in slots.items():
            out.append(f"=== {name} dispatch-slot +0x{slot:x} ===")
            pats=[
              re.compile(rf'ldr\s+x(\d+),\s*\[x(\d+),\s*#(?:0x)?{slot:x}\]'),
              re.compile(rf'ldur\s+x(\d+),\s*\[x(\d+),\s*#(?:0x)?{slot:x}\]'),
            ]
            hits=0
            for i,line in enumerate(dis):
              if any(p.search(line) for p in pats):
                # only useful if an indirect call follows shortly
                window=dis[i:min(i+8,len(dis))]
                if any(re.search(r'\bblr\s+x\d+',x) for x in window):
                  out.extend(dis[max(0,i-12):min(len(dis),i+18)])
                  out.append("---"); hits+=1
            out.append(f"hits={hits}")
          Path("hybrid-report/gold-vulkan-hot-slot-calls.txt").write_text("\n".join(out)+"\n")
          PY

      - name: Trace GOLD dispatch through nested device table
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          lib=Path("XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_d3d11.so")
          dis=subprocess.check_output(["aarch64-linux-gnu-objdump","-d","-C",str(lib)],text=True,errors="replace").splitlines()
          # Direct offset-only matching produced false positives because ordinary C++ vtables share offsets.
          # Require evidence that the base object came from the GOLD Vulkan dispatch/device object:
          # look for the characteristic nested load [base,#16/40] before the slot load and BLR.
          slots={"vkQueueSubmit":0x38,"vkQueueSubmit2":0x40,"vkWaitForFences":0x108,
                 "vkWaitSemaphores":0x2f8,"vkAcquireNextImageKHR":0x588,"vkQueuePresentKHR":0x590,
                 "vkUpdateDescriptorSets":0x248,"vkUpdateDescriptorSetWithTemplate":0x2d0}
          out=[]
          for name,slot in slots.items():
            out.append(f"=== {name} expected slot +0x{slot:x} ===")
            hits=0
            for i,line in enumerate(dis):
              if not re.search(rf'ldr\s+x(\d+),\s*\[x(\d+),\s*#(?:0x)?{slot:x}\]',line): continue
              before="\n".join(dis[max(0,i-10):i])
              after="\n".join(dis[i:min(len(dis),i+8)])
              if "blr" not in after: continue
              # Reject obvious virtual-method patterns and retain dispatch-like object chains.
              if re.search(r'ldr\s+x\d+,\s*\[x\d+\]\n.*ldr\s+x\d+,\s*\[x\d+,\s*#(?:16|40)\]',before):
                out.extend(dis[max(0,i-14):min(len(dis),i+14)]); out.append("---"); hits+=1
            out.append(f"filtered_hits={hits}")
          Path("hybrid-report/gold-vulkan-hot-slot-calls-v2.txt").write_text("\n".join(out)+"\n")
          PY

      - name: Native V10 safe instruction audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hybrid-report
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path("XHYN_V017_UNPACKED/lib/arm64-v8a/libgtav.so")
          # Audit the previously identified renderer-statistics locations without modifying code.
          # This gives exact function context before any V10 native patch is allowed.
          addrs=[0x61b0398,0x619aa5c,0x4a331a8]
          out=[]
          for a in addrs:
            lo=max(0,a-0x80); hi=a+0x100
            cmd=["aarch64-linux-gnu-objdump","-d","-C",
                 f"--start-address=0x{lo:x}",f"--stop-address=0x{hi:x}",str(p)]
            q=subprocess.run(cmd,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            out.append(f"=== target 0x{a:x} ===")
            out.append(q.stdout)
          Path("hybrid-report/native-v10-candidate-disasm.txt").write_text("\n".join(out))
          PY

      - name: Verify hybrid native stack
        shell: bash
        run: |
          set -euo pipefail
          cd XHYN_V017_UNPACKED
          grep -q '^interop_native=true' assets/default-android.ini
          strings -a lib/arm64-v8a/libgtav_vulkan.so | grep -q 'gtav_android_surface_state'
          strings -a lib/arm64-v8a/libgtav_vulkan.so | grep -q 'gtav_android_lock_surface'
          strings -a lib/arm64-v8a/libgtav_vulkan.so | grep -q 'gtav_android_unlock_surface'
          strings -a lib/arm64-v8a/libdxvk_d3d11.so | grep -q 'GTAV_VULKAN_LIBRARY'
          strings -a lib/arm64-v8a/libdxvk_d3d11.so | grep -q 'gtav_android_surface_state'
          test -s lib/arm64-v8a/libgtav.so
          test -s lib/arm64-v8a/libgtav_vulkan.so
          test -s lib/arm64-v8a/libgtavvk.so
          test -s lib/arm64-v8a/libdxvk_d3d11.so
          test -s lib/arm64-v8a/libdxvk_dxgi.so

      - name: Native hybrid report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hybrid-report
          for f in XHYN_V017_UNPACKED/lib/arm64-v8a/{libgtav.so,libgtav_vulkan.so,libgtavvk.so,libdxvk_d3d11.so,libdxvk_dxgi.so}; do
            b="$(basename "$f")"
            {
              echo "===== $b ====="
              file "$f"
              sha256sum "$f"
              readelf -h "$f" || true
              echo "--- NEEDED/DYNAMIC ---"
              readelf -d "$f" || true
              echo "--- EXPORTED SYMBOLS ---"
              readelf -Ws "$f" | grep -E 'gtav_android|Java_com_gtavsource|vkQueue|vkAcquire|vkCreateSwapchain|vkGetSwapchain' || true
              echo "--- HYBRID STRINGS ---"
              strings -a "$f" | grep -Ei 'GTAV_VULKAN|gtav_android|swapchain|surface|interop|skin|luminance|refract|present|vulkan' | head -n 500 || true
            } > "hybrid-report/$b.txt"
          done

      - name: Patch original APK without rebuilding package structure
        shell: bash
        run: |
          set -euo pipefail
          rm -rf patchstage out
          mkdir -p patchstage out
          cp "XHYN V_0.17custom.apk" out/XHYN_V0.17_HYBRID_PERFORMANCE_UNSIGNED.apk

          # Strip the old signature only. Keep the original manifest/resources/ZIP layout.
          zip -q -d out/XHYN_V0.17_HYBRID_PERFORMANCE_UNSIGNED.apk 'META-INF/*' || true

          # Only files intentionally changed by the hybrid are replaced.
          mkdir -p patchstage/assets patchstage/lib/arm64-v8a
          cp XHYN_V017_UNPACKED/assets/default-android.ini patchstage/assets/
          cp XHYN_V017_UNPACKED/assets/dxvk.conf patchstage/assets/
          cp XHYN_V017_UNPACKED/lib/arm64-v8a/libgtav.so patchstage/lib/arm64-v8a/
          cp XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_d3d11.so patchstage/lib/arm64-v8a/
          cp XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_dxgi.so patchstage/lib/arm64-v8a/
          if [ -f XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_d3d10core.so ]; then
            cp XHYN_V017_UNPACKED/lib/arm64-v8a/libdxvk_d3d10core.so patchstage/lib/arm64-v8a/
          fi

          # Replace native libraries uncompressed; this is required by many modern Android APKs.
          (
            cd patchstage
            zip -q -0 -u ../out/XHYN_V0.17_HYBRID_PERFORMANCE_UNSIGNED.apk lib/arm64-v8a/libdxvk_d3d11.so lib/arm64-v8a/libdxvk_dxgi.so lib/arm64-v8a/libgtav.so $(test -f lib/arm64-v8a/libdxvk_d3d10core.so && echo lib/arm64-v8a/libdxvk_d3d10core.so || true)
            zip -q -9 -u ../out/XHYN_V0.17_HYBRID_PERFORMANCE_UNSIGNED.apk assets/default-android.ini assets/dxvk.conf
          )

      - name: Align sign and validate install package
        shell: bash
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"

          "$BT/zipalign" -f -p 4             out/XHYN_V0.17_HYBRID_PERFORMANCE_UNSIGNED.apk             out/XHYN_V0.17_HYBRID_PERFORMANCE_ALIGNED.apk
          "$BT/zipalign" -c -p 4 out/XHYN_V0.17_HYBRID_PERFORMANCE_ALIGNED.apk

          keytool -genkeypair -noprompt             -keystore out/hybrid.keystore -storepass android -keypass android             -alias hybrid -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=XHYN Hybrid,O=Android,C=DE"

          "$BT/apksigner" sign             --ks out/hybrid.keystore --ks-pass pass:android --key-pass pass:android             --out out/XHYN_V0.17_HYBRID_PERFORMANCE_SIGNED.apk             out/XHYN_V0.17_HYBRID_PERFORMANCE_ALIGNED.apk

          "$BT/apksigner" verify --verbose --print-certs out/XHYN_V0.17_HYBRID_PERFORMANCE_SIGNED.apk
          "$BT/aapt" dump badging out/XHYN_V0.17_HYBRID_PERFORMANCE_SIGNED.apk | tee out/aapt-badging.txt
          "$BT/aapt" dump xmltree out/XHYN_V0.17_HYBRID_PERFORMANCE_SIGNED.apk AndroidManifest.xml >/dev/null
          unzip -t out/XHYN_V0.17_HYBRID_PERFORMANCE_SIGNED.apk >/dev/null
          sha256sum out/XHYN_V0.17_HYBRID_PERFORMANCE_SIGNED.apk > out/XHYN_V0.17_HYBRID_PERFORMANCE_SIGNED.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: XHYN-V0.17-HYBRID-PERFORMANCE
          path: |
            out/XHYN_V0.17_HYBRID_PERFORMANCE_SIGNED.apk
            out/XHYN_V0.17_HYBRID_PERFORMANCE_SIGNED.apk.sha256
            hybrid-report/
          compression-level: 0
