name: Fast launcher patch
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hybrid-apk-unpacked
      - name: Patch launcher only
        shell: bash
        run: |
          set -euo pipefail
          APK="XHYN V_0.17custom.apk"
          mkdir -p out work
          cp "$APK" work/base.apk
          python3 - <<'PY'
          import zipfile, pathlib
          apk=pathlib.Path("work/base.apk")
          with zipfile.ZipFile(apk) as z:
              dex=[n for n in z.namelist() if n.startswith("classes") and n.endswith(".dex")]
              print("DEX entries:", dex)
              for n in dex:
                  b=z.read(n)
                  if b"Invalid graphics recovery value" in b:
                      print("FOUND literal in",n)
          PY
          cp work/base.apk out/XHYN_FAST_PATCH_UNSIGNED.apk
      - name: Upload fast diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: XHYN-FAST-PATCH
          path: out/XHYN_FAST_PATCH_UNSIGNED.apk
