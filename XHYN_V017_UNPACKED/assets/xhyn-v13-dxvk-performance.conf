# XHYN A840 PERF FORCED
# Applied at runtime through DXVK_CONFIG; launcher editor toggle is irrelevant.

dxgi.syncInterval = 0
dxgi.maxFrameLatency = 2
dxgi.maxFrameRate = 120
dxvk.maxFrameRate = 120
dxvk.framePace = max-frame-latency

dxvk.enableAsync = True
dxvk.gplAsyncCache = True
dxvk.enableGraphicsPipelineLibrary = False
dxvk.enableStateCache = True
dxvk.numCompilerThreads = 4

dxvk.enableDescriptorUpdateTemplates = False
dxvk.trackPipelineLifetime = False

dxvk.lowLatencyAllowCpuFramesOverlap = True
dxvk.latencySleep = False

# A840 is a tile-based GPU. Force DXVK's tiler heuristics for this test.
dxvk.tilerMode = True

dxvk.useRawSsbo = Auto
dxvk.enableMemoryDefrag = Auto

dxvk.enableDebugUtils = False
dxvk.zeroMappedMemory = False
d3d11.reproducibleCommandStream = False
d3d11.forceVolatileTgsmAccess = False
d3d11.forceComputeUavBarriers = False

# Kept OFF to preserve rendering correctness:
d3d11.relaxedBarriers = False
d3d11.relaxedGraphicsBarriers = False
