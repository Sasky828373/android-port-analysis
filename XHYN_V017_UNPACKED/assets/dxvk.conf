# XHYN V46 - verified options only; golden V35 native Vulkan base
dxgi.syncInterval = 0
dxgi.maxFrameLatency = 1
dxgi.tearFree = False
d3d11.relaxedBarriers = True
d3d11.relaxedGraphicsBarriers = True
d3d11.disableMsaa = True
d3d11.forceSampleRateShading = False
d3d11.maxTessFactor = 4
d3d11.samplerAnisotropy = 2
d3d11.clampNegativeLodBias = True
dxvk.numCompilerThreads = 4
dxvk.enableGraphicsPipelineLibrary = True
dxvk.enableDescriptorBuffer = True
dxvk.enableDescriptorHeap = True
dxvk.enableMemoryDefrag = True
dxvk.enableUnifiedImageLayouts = True
dxvk.useRawSsbo = True
dxvk.trackPipelineLifetime = False
dxvk.enableDebugUtils = False
dxvk.enablePresentTiming = False
dxvk.tearFree = False
dxvk.maxMemoryBudget = 0.82

# V47 A840 tile-GPU additions verified in the bundled renderer
dxvk.tilerMode = True
dxvk.lowerSinCos = True

# V49 - additional verified A840/D3D11 hot-path cuts
# Keep the native Vulkan interop/pass path from the golden V35 runtime.
d3d11.maxTessFactor = 2
d3d11.samplerAnisotropy = 1
d3d11.samplerLodBias = 0.75
d3d11.enableContextLock = False
d3d11.forceComputeLdsBarriers = False
d3d11.forceComputeUavBarriers = False
d3d11.reproducibleCommandStream = False
dxvk.enableDescriptorUpdateTemplates = False
dxvk.enableImplicitResolves = True
dxvk.latencySleep = False
dxvk.zeroMappedMemory = False

# V50 - verified command/swapchain path cuts
# Expose native command-list support so D3D11 deferred-context work can stay parallel.
d3d11.exposeDriverCommandLists = True
# Avoid creating the Android presentation surface until DXGI actually needs it.
dxgi.deferSurfaceCreation = True
# Fullscreen-exclusive handling is unnecessary on Android and adds no useful fast path.
dxvk.allowFse = False
# Disable NVIDIA-only latency/CUDA/raw-chain compatibility paths on Adreno.
dxvk.disableNvLowLatency2 = True
dxvk.enableNvCudaInterop = False
dxvk.enableNvRawAccessChains = False

# V52 - native Vulkan + DXVK combined pass
# Keep direct image mapping available; avoids forcing staging/copy path where renderer can map directly.
d3d11.disableDirectImageMapping = False
# Do not add an extra DXVK latency tolerance window.
dxvk.latencyTolerance = 0
# This device is Adreno; hideIntegratedGraphics filtering is unnecessary and kept disabled.
dxvk.hideIntegratedGraphics = False
# Android has no desktop composition swapchain fast path to gain here.
dxgi.enableDummyCompositionSwapchain = False
# Keep HDR conversion path out of the hot path unless explicitly requested by launcher.
dxgi.enableHDR = False


# HYBRID-A840 V1 — native Android/Vulkan interop + GOLD DXVK
# Keep GOLD responsible for D3D11 translation while the runtime owns Android Vulkan interop.
# Conservative correctness settings: do not force relaxed graphics/resource barriers.
dxgi.syncInterval = 0
dxgi.maxFrameLatency = 1
dxgi.deferSurfaceCreation = True
dxgi.enableDummyCompositionSwapchain = False
dxvk.tilerMode = True
dxvk.numCompilerThreads = 4
dxvk.latencySleep = False
dxvk.latencyTolerance = 0
dxvk.trackPipelineLifetime = False
dxvk.enableDebugUtils = False
dxvk.zeroMappedMemory = False
d3d11.relaxedBarriers = False
d3d11.relaxedGraphicsBarriers = False
d3d11.forceComputeUavBarriers = False
d3d11.reproducibleCommandStream = False


# HYBRID-A840 V2 — CPU/submission pacing
dxgi.syncInterval = 0
dxgi.maxFrameLatency = 1
dxvk.framePace = max-frame-latency
dxvk.lowLatencyAllowCpuFramesOverlap = True
dxvk.latencySleep = False
dxvk.latencyTolerance = 0
dxvk.numCompilerThreads = 4
dxvk.tilerMode = True
dxvk.trackPipelineLifetime = False
dxvk.enablePresentTiming = False
