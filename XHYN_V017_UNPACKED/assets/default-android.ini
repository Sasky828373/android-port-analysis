# Android launch configuration. Graphics overrides are in Launch graphics.
# Input, overlay and aspect settings apply after leaving the launcher; driver and HDR need a restart.
# Performance collection can change while running. Root-folder switch files are not used.

[display]
# fit: preserve aspect with letterboxing; stretch: fill the screen.
scale_mode=fit
hdr=false

[diagnostics]
debug_bar=false
logcat=false
# Separate probes with spaces or commas; * enables all probes and may produce large logs.
probes=

[performance]
# Set true to capture, false to save and stop. Polled every 250 ms.
capture=false
# 0 disables automatic hitch capture; valid threshold: 10..5000 ms.
hitch_ms=0
target_fps=120

[scheduling]
# bounded: wake by permits; platform: system semaphore fallback. Restart required.
semaphore=bounded

[benchmark]
# enabled is a one-time request, reset to false before launch.
enabled=false
pass=4
iterations=1
frame_times=false

[launcher]
# Automatically start the game when the launcher opens.
auto_start=false

[trainer]
controller_shortcut=START+RB+RT
# Built-in development trainer, inspired by Menyoo. Story mode only; also available on the Trainer page.
menyoo_enabled=false

[vulkan]
# system: built-in driver; custom: an AdrenoTools-format ZIP selected in Drivers.
driver=system
driver_zip=
validation=false
legacy_vulkan13=false
# Above 0 runs only the standalone Vulkan test for this many seconds; no game data is loaded.
native_smoke_seconds=0
interop_native=true
interop_smoke=false
skin_pass=true
skin_owned_target=false
luminance_pass=true
ptfx_refract_pass=true

[render_debug]
sss_console_path=false
skip_skin_pass=false
force_sss_params=false
sss_white_src=false

[input]
rumble_use_right_motor=false
press_haptics=false
phone_rumble=false
controller_rumble=false
touch_enabled=true
show_controls=true
layout_profile=

[hud]
# Minimap and notification layout. Position and size follow normalized rectangles in the control layout.
minimap_override=false
minimap_tap=true
minimap_x=0
minimap_y=0
minimap_w=100
minimap_h=100
feed_override=false
feed_x=0
feed_y=0
feed_w=100
feed_h=100
feed_direction=below

[overlay]
enabled=false
defaults_version=2
layout=row
font=monospace
text_color=#ffffffff
background_color=#ff181517
border_color=#80b79aff
border=0
corner=2
padding=1
margin=2
scale=85
fps=false
cpu=false
gpu=false
temperature=false
opacity=55
text_size=10
position=top_center
